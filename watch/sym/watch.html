<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Face Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .instructions {
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            color: #333;
        }

        .upload-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            margin-top: 50px;
            width: 100%;
            max-width: 300px;
            align-items: center; /* Center the buttons */
        }

        .upload-button {
            position: relative;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
            color: #333;
            text-align: center;
            width: 280px; /* Fixed width instead of 100% */
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .upload-button:hover {
            border-color: #007acc;
            background: #f8f9fa;
        }

        .upload-button input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            left: 0;
            top: 0;
        }

        .watch-container {
            margin-top: 60px;
            margin-bottom: 20px;
            position: relative;
            width: 38mm;
            height: 38mm;
        }

        .hour-wrapper,
        .minute-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: center;
            z-index: 3;
        }

        .watch-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transform-origin: center;
            border: none;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .base-layer {
            left: -3mm;
            top: -6mm;
            width: 50mm;
            height: 50mm;
            background-image: url('base.svg');
            border-radius: 50%;
            z-index: -1;
        }

        .background-layer {
            background-image: url('bg.svg');
            border-radius: 50%;
            z-index: 1;
        }

        .hour-layer {
            background-image: url('hour.svg');
            border-radius: 50%;
            z-index: 2;
            animation: hourRotation 43200s linear infinite;
        }

        .minute-layer {
            background-image: url('minute.svg');
            border-radius: 50%;
            z-index: 3;
            animation: minuteRotation 3600s linear infinite;
        }

        @keyframes hourRotation {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes minuteRotation {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="instructions">📷 Upload images to simulate</div>

    

    <div class="watch-container">
        <div class="watch-layer base-layer"></div>

        <svg class="watch-layer" style="z-index: 0;">
            <circle cx="50%" cy="50%" r="15mm" fill="gold" />
        </svg>

        <div class="watch-layer background-layer"></div>
        
        <div class="hour-wrapper">
            <div class="watch-layer hour-layer"></div>
        </div>
        
        <div class="minute-wrapper">
            <div class="watch-layer minute-layer"></div>
        </div>
    </div>

    <div class="upload-controls">
        <label class="upload-button">
            Background Plate
            <input type="file" accept="image/*" id="backgroundUpload">
        </label>
        <label class="upload-button">
            Hour Plate
            <input type="file" accept="image/*" id="hourUpload">
        </label>
        <label class="upload-button">
            Minute Plate
            <input type="file" accept="image/*" id="minuteUpload">
        </label>
    </div>

    <script>
function setInitialTime() {
    const now = new Date();
    const hours = now.getHours() % 12;
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();

    const totalMinutes = (hours * 60) + minutes + (seconds / 60);
    const hourAngle = (totalMinutes / 720) * 360;
    const minuteAngle = ((minutes * 60) + seconds) / 60 * 6;

    document.querySelector('.hour-wrapper').style.transform = `rotate(${hourAngle}deg)`;
    document.querySelector('.minute-wrapper').style.transform = `rotate(${minuteAngle}deg)`;
}

function handleImageUpload(inputId, targetClass) {
    document.getElementById(inputId).addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;
                document.querySelector(`.${targetClass}`).style.backgroundImage = `url(${imageUrl})`;
            };
            reader.readAsDataURL(file);
        }
    });
}

handleImageUpload('backgroundUpload', 'background-layer');
handleImageUpload('hourUpload', 'hour-layer');
handleImageUpload('minuteUpload', 'minute-layer');

setInitialTime();
</script>
</body>
</html>
