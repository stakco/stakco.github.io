<body>

    <script type="module">
        import { StakcoUtils } from 'https://stakcos.com/assets/1.0.0/components/stakco-utils.js';
        import { StakcoConfig } from 'https://stakcos.com/assets/1.0.0/components/stakco-config.js';

        const CONFIG = StakcoConfig.getConfig('voc');

        // VOC Sensor state
        let sensorConnected = false;
        let actionCount = 0;
        let puzzleSolved = false;
        let currentVOC = 0;
        let previousVOC = 0;
        let vocThresholds = { low: 100, medium: 300, high: 500 };

        const puzzleContainer = document.querySelector('stakco-puzzle-container');
        const layerControls = document.querySelector('stakco-layer-controls');
        const infoPanel = document.querySelector('stakco-info-panel');
        const shareWindow = document.querySelector('stakco-share-window');
        const permissionPrompt = document.querySelector('stakco-permission-prompt');
        const branding = document.querySelector('stakco-branding');
        const shareButton = document.querySelector('stakco-share-button');
        
        const sensorInfo = document.getElementById('sensor-info');
        const vocValueSpan = document.getElementById('voc-value');
        const activeLayerSpan = document.getElementById('active-layer');
        const actionCountSpan = document.getElementById('action-count');
        const sensorIndicator = document.getElementById('sensor-indicator');
        const qualityIndicator = document.getElementById('quality-indicator');

        // Kiwrious VOC Sensor Controller (native WebSerial implementation)
        class KiwriousVOCController {
            constructor() {
                this.port = null;
                this.reader = null;
                this.isReading = false;
                this.onSerialData = null;
                this.onSerialConnection = null;
            }

            async connectAndReadAsync() {
                try {
                    // Request serial port with Kiwrious filters
                    this.port = await navigator.serial.requestPort({
                        filters: [
                            { usbVendorId: 0x04d8 },  // Microchip vendor ID
                            { usbVendorId: 0x0d28, usbProductId: 0x0204 }
                        ]
                    });

                    // Open port with Kiwrious baud rate
                    await this.port.open({ baudRate: 230400 });
                    
                    console.log('Kiwrious VOC sensor connected');
                    
                    if (this.onSerialConnection) {
                        this.onSerialConnection(true);
                    }

                    // Start reading data
                    this.startReading();
                    
                } catch (error) {
                    console.error('Failed to connect:', error);
                    throw error;
                }
            }

            async startReading() {
                if (!this.port || !this.port.readable) {
                    console.error('Port not readable');
                    return;
                }

                this.isReading = true;
                this.reader = this.port.readable.getReader();

                try {
                    while (this.isReading) {
                        const { value, done } = await this.reader.read();
                        
                        if (done) {
                            break;
                        }

                        if (value) {
                            this.parseVOCData(value);
                        }
                    }
                } catch (error) {
                    console.error('Reading error:', error);
                } finally {
                    this.reader.releaseLock();
                }
            }

            parseVOCData(data) {
                // Kiwrious VOC sensor sends 26 bytes per packet
                // VOC value is at bytes 6-7 (16-bit little-endian)
                if (data.length >= 8) {
                    const dataView = new DataView(data.buffer);
                    
                    // Read VOC value (16-bit unsigned integer at offset 6)
                    const vocValue = dataView.getUint16(6, true); // true = little-endian
                    
                    if (this.onSerialData && vocValue !== undefined) {
                        const decodedData = {
                            decodedValues: [{
                                label: 'voc',
                                value: vocValue
                            }],
                            sensorType: 'VOC'
                        };
                        this.onSerialData(decodedData);
                    }
                }
            }

            async disconnect() {
                this.isReading = false;
                
                if (this.reader) {
                    await this.reader.cancel();
                    this.reader = null;
                }
                
                if (this.port) {
                    await this.port.close();
                    this.port = null;
                }
                
                if (this.onSerialConnection) {
                    this.onSerialConnection(false);
                }
            }
        }

        // Mock service for testing without hardware
        class MockVOCService {
            constructor() {
                this.onSerialData = null;
                this.onSerialConnection = null;
            }

            async connectAndReadAsync() {
                console.log('Mock: Connecting to VOC sensor...');
                if (this.onSerialConnection) {
                    this.onSerialConnection(true);
                }
                this.startMockReadings();
            }

            startMockReadings() {
                setInterval(() => {
                    if (this.onSerialData && !puzzleSolved) {
                        const mockVOC = Math.floor(Math.random() * 600);
                        const mockData = {
                            decodedValues: [{
                                label: 'voc',
                                value: mockVOC
                            }],
                            sensorType: 'VOC'
                        };
                        this.onSerialData(mockData);
                    }
                }, 500);
            }

            async disconnect() {
                if (this.onSerialConnection) {
                    this.onSerialConnection(false);
                }
            }
        }

        let serialService;

        async function init() {
            console.log('Initializing Stakco VOC Sensor...');

            StakcoUtils.preventZoom();
            setupEventListeners();

            // Initialize real Kiwrious VOC controller
            serialService = new KiwriousVOCController();

            // Wait for puzzle container to be ready
            await new Promise(resolve => {
                if (puzzleContainer.shadowRoot) {
                    resolve();
                } else {
                    puzzleContainer.addEventListener('puzzle-ready', resolve, { once: true });
                }
            });

            setTimeout(checkPermissionNeeded, 1000);
            console.log('App initialized');
        }

        function setupEventListeners() {
            puzzleContainer.addEventListener('puzzle-ready', () => {
                console.log('Puzzle ready');
            });

            puzzleContainer.addEventListener('puzzle-solved', () => {
                puzzleSolved = true;
                handlePuzzleSolved();
            });

            layerControls.addEventListener('layerchange', (e) => {
                puzzleContainer.switchLayer(e.detail.layer);
                activeLayerSpan.textContent = e.detail.layer;
            });

            permissionPrompt.addEventListener('primary-action', async () => {
                await requestSensorAccess();
            });

            permissionPrompt.addEventListener('secondary-action', () => {
                initializeSensor();
            });

            shareButton.addEventListener('share-clicked', handleShare);
        }

        async function requestSensorAccess() {
            if (!navigator.serial) {
                infoPanel.setContent('<p>Web Serial API not supported in this browser</p>');
                return;
            }

            try {
                await serialService.connectAndReadAsync();
                
                // Set up data callback
                serialService.onSerialData = handleSensorData;
                
                // Set up connection callback
                if (serialService.onSerialConnection) {
                    serialService.onSerialConnection = (connected) => {
                        sensorConnected = connected;
                        if (!connected) {
                            infoPanel.setContent('<p>VOC Sensor disconnected</p>');
                        }
                    };
                }
                
                initializeSensor();
                
            } catch (error) {
                console.error('Sensor access denied:', error);
                infoPanel.setContent('<p>VOC Sensor access denied</p>');
            }
        }

        function initializeSensor() {
            infoPanel.setContent('<p>VOC Sensor ready - Air quality controls puzzle layers</p>');
            sensorInfo.classList.remove('hidden');
            branding.hide();
            sensorConnected = true;
        }

        function handleSensorData(decodedData) {
            if (puzzleSolved) return;

            const values = decodedData.decodedValues;
            
            // VOC sensor has 1 observable
            if (values && values.length > 0) {
                const vocData = values.find(v => v.label.toLowerCase() === 'voc') || values[0];
                currentVOC = vocData.value;
                
                showSensorActivity();
                vocValueSpan.textContent = Math.round(currentVOC);
                
                // Update air quality indicator
                updateAirQualityBar(currentVOC);
                
                // Control puzzle based on VOC level changes
                handleVOCChange();
                
                previousVOC = currentVOC;
            }
        }

        function handleVOCChange() {
            const vocDelta = currentVOC - previousVOC;
            
            // Threshold-based layer switching
            if (Math.abs(vocDelta) > 50) { // Significant change threshold
                actionCount++;
                actionCountSpan.textContent = actionCount;
                
                // Map VOC ranges to layers
                let targetLayer;
                if (currentVOC < vocThresholds.low) {
                    targetLayer = 1;
                } else if (currentVOC < vocThresholds.medium) {
                    targetLayer = 2;
                } else {
                    targetLayer = 3;
                }
                
                const currentLayer = puzzleContainer.currentLayer;
                if (targetLayer !== currentLayer) {
                    puzzleContainer.switchLayer(targetLayer);
                    activeLayerSpan.textContent = targetLayer;
                    layerControls.setActiveLayer(targetLayer);
                }
            }
            
            // Use VOC delta for rotation
            if (Math.abs(vocDelta) > 5) {
                const rotationAmount = vocDelta / 10; // Scale factor
                puzzleContainer.rotateCurrentLayer(rotationAmount);
                puzzleContainer.checkAlignment();
            }
        }

        function updateAirQualityBar(voc) {
            // Map VOC to 0-100% position
            const maxVOC = 600;
            const percentage = Math.min((voc / maxVOC) * 100, 100);
            qualityIndicator.style.left = `${percentage}%`;
        }

        function showSensorActivity() {
            sensorIndicator.classList.add('active');
            setTimeout(() => sensorIndicator.classList.remove('active'), 200);
        }

        function handlePuzzleSolved() {
            console.log(`Puzzle solved with ${actionCount} sensor actions!`);

            StakcoUtils.vibrate([200, 100, 300, 100, 200]);

            infoPanel.setContent(`<p>Puzzle solved with ${actionCount} sensor actions!</p>`);

            setTimeout(() => {
                layerControls.hide();
                sensorInfo.classList.add('hidden');
                shareButton.show();
            }, 2000);

            // Animate all layers to zero
            setTimeout(() => {
                puzzleContainer.animateToSolution(2000);
            }, 500);
        }

        async function handleShare() {
            const layerImages = puzzleContainer.getLayerImages();
            const message = `Solved with VOC sensor in ${actionCount} actions!`;
            shareWindow.setAttribute('filename', `stakco-voc-${actionCount}actions.png`);
            await shareWindow.open(layerImages, message, true);
        }

        async function checkPermissionNeeded() {
            if (navigator.serial) {
                permissionPrompt.show();
            } else {
                infoPanel.setContent('<p>Web Serial API not supported in this browser. Please use Chrome, Edge, or Opera.</p>');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
