    <style>
        body {
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        /* Steps Info Panel */
        #steps-info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            border: 2px solid var(--primary-color);
            color: white;
            border-radius: 15px;
            padding: 15px 30px;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-soft);
            z-index: 800;
            display: none;
            gap: 30px;
            font-family: 'Inter', sans-serif;
        }

        #steps-info.show {
            display: flex;
        }

        .steps-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .steps-label {
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .steps-value {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 24px;
            font-family: 'Courier New', monospace;
        }

        .walking-indicator {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #333;
            border: 2px solid #666;
            transition: all 0.2s ease;
        }

        .walking-indicator.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-glow);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        /* Mobile adjustment */
        @media (max-width: 600px) {
            #steps-info {
                top: 80px;
                padding: 12px 20px;
                gap: 20px;
            }

            .steps-value {
                font-size: 20px;
            }
        }

        /* Debug Panel */
        #debug-panel {
            position: fixed;
            bottom: 100px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #0f0;
            z-index: 1000;
            display: none;

        #debug-panel.show {

<body>
    <!-- Components -->
    <stakco-orientation-overlay></stakco-orientation-overlay>

    <button id="debug-toggle">Show Debug</button>
    
    <!-- Debug Panel -->
    <div id="debug-panel">
        <div><strong>SENSOR DEBUG</strong></div>
        <div>Baseline: <span id="debug-baseline">--</span></div>
        <div>Current: <span id="debug-current">--</span></div>
        <div>Deviation: <span id="debug-deviation">--</span></div>
        <div>Peak: <span id="debug-peak">--</span></div>
        <div>State: <span id="debug-state">INIT</span></div>
        <div>Steps: <span id="debug-steps">0</span></div>
    </div>
    
    <!-- Steps Info Display -->
    <div id="steps-info">
        <div class="steps-row">
            <span class="steps-label">Total Steps</span>
            <span class="steps-value" id="total-steps">0</span>
        </div>
        <div class="steps-row">

        <div class="steps-row">

    <stakco-puzzle-container
        layers="3"
        user-id="109949450257686494443"
        puzzle-id="A2A3_3"
        tolerance="2">
    </stakco-puzzle-container>
    
    <stakco-layer-controls layers="3"></stakco-layer-controls>

    <stakco-share-button label="Share Success!"></stakco-share-button>

    <stakco-permission-prompt 
        title="Enable Motion Sensors"
        message="This app needs access to your device's motion sensors to count your steps and rotate puzzle layers as you walk."
        primary-label="Enable Motion"
        secondary-label="Skip">
    </stakco-permission-prompt>

    <stakco-share-window 
        title="Stakco Steps"
        share-url="https://stakcos.com/steps/">
        <div slot="text">Solved by walking!</div>

    <script type="module">
        import { StakcoUtils } from 'https://stakcos.com/assets/1.0.0/components/stakco-utils.js';
        import { StakcoConfig } from 'https://stakcos.com/assets/1.0.0/components/stakco-config.js';

        // Step Detection Algorithm Configuration
        const STEP_CONFIG = {
            THRESHOLD_LOW: 0.5,          // Minimum acceleration change to consider
            THRESHOLD_HIGH: 3.0,         // Maximum acceleration (filter out impacts/drops)
            MIN_STEP_INTERVAL: 300,      // Minimum ms between steps (prevents double counting)
            MAX_STEP_INTERVAL: 2000,     // Maximum ms between steps (resets walking state)
            ROTATION_PER_STEP: 15,       // Degrees to rotate per step
            SMOOTHING_WINDOW: 10,        // Number of samples for smoothing
            BASELINE_SAMPLES: 20         // Samples to establish baseline
        };

        // App state
        let totalSteps = 0;
        let lastStepTime = 0;
        let isWalking = false;
        let firstInteraction = false;
        let accelerationHistory = [];
        let baselineHistory = [];
        let baselineMagnitude = 0;
        let lastPeakMagnitude = 0;
        let lookingForPeak = true;

        // Get component references
        const puzzleContainer = document.querySelector('stakco-puzzle-container');
        const countdown = document.querySelector('stakco-countdown');
        const layerControls = document.querySelector('stakco-layer-controls');
        const infoPanel = document.querySelector('stakco-info-panel');
        const shareWindow = document.querySelector('stakco-share-window');
        const orientationOverlay = document.querySelector('stakco-orientation-overlay');
        const permissionPrompt = document.querySelector('stakco-permission-prompt');
        const branding = document.querySelector('stakco-branding');
        const shareButton = document.querySelector('stakco-share-button');
        
        // Steps info elements
        const stepsInfo = document.getElementById('steps-info');
        const totalStepsSpan = document.getElementById('total-steps');
        const rotationValueSpan = document.getElementById('rotation-value');
        const walkingIndicator = document.getElementById('walking-indicator');

        // Debug elements
        const debugPanel = document.getElementById('debug-panel');
        const debugToggle = document.getElementById('debug-toggle');
        const debugBaseline = document.getElementById('debug-baseline');
        const debugCurrent = document.getElementById('debug-current');
        const debugDeviation = document.getElementById('debug-deviation');
        const debugPeak = document.getElementById('debug-peak');
        const debugState = document.getElementById('debug-state');
        const debugSteps = document.getElementById('debug-steps');

        // Debug toggle
        debugToggle.addEventListener('click', () => {
            debugPanel.classList.toggle('show');
            debugToggle.textContent = debugPanel.classList.contains('show') ? 'Hide Debug' : 'Show Debug';
        });

        async function init() {
            StakcoUtils.preventZoom();
            setupEventListeners();
            setTimeout(checkPermissionNeeded, 1000);
        }

        function setupEventListeners() {
            // Puzzle container events
            puzzleContainer.addEventListener('puzzle-ready', () => {
                console.log('Puzzle ready');
            });

            puzzleContainer.addEventListener('layer-switched', (e) => {
                updateRotationDisplay(e.detail.rotation);
            });

            puzzleContainer.addEventListener('layer-rotated', (e) => {
                updateRotationDisplay(e.detail.rotation);
                puzzleContainer.checkAlignment();
            });

            puzzleContainer.addEventListener('puzzle-solved', (e) => {
                solvePuzzle(e.detail.layers);
            });

            // Layer controls
            layerControls.addEventListener('layerchange', (e) => {
                puzzleContainer.switchLayer(e.detail.layer);
            });

            // Orientation overlay
            orientationOverlay.addEventListener('blocked', () => {
                if (countdown && countdown.active) {
                    countdown.pause();
                }
            });

            orientationOverlay.addEventListener('unblocked', () => {
                if (countdown && countdown.paused) {
                    countdown.resume();
                }
            });

            // Permission prompt
            permissionPrompt.addEventListener('primary-action', async () => {
                const granted = await requestMotionPermission();
                if (granted) {
                    initializeMotion();
                }
            });

            permissionPrompt.addEventListener('secondary-action', () => {
                initializeMotion();
            });

            // Share button
            shareButton.addEventListener('share-clicked', handleShare);
        }

        async function requestMotionPermission() {
            if (typeof DeviceMotionEvent !== 'undefined' && 
                typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceMotionEvent.requestPermission();
                    return response === 'granted';
                } catch (error) {
                    console.error('Permission request failed:', error);
                    return false;
                }
            }
            return true; // Permission not needed on Android
        }

        function initializeMotion() {
            if (window.DeviceMotionEvent) {
                window.addEventListener('devicemotion', handleMotion);
                infoPanel.setContent('<p>Walk to rotate selected layer - Each step rotates the puzzle!</p>');
            } else {
                infoPanel.setContent('<p>Motion sensors not supported on this device</p>');
            }
        }

        function handleMotion(event) {
            if (puzzleContainer.isSolved || orientationOverlay.isBlocked()) return;

            // Get acceleration data
            const accel = event.accelerationIncludingGravity;
            if (!accel || accel.x === null || accel.y === null || accel.z === null) return;

            // Calculate magnitude of acceleration vector
            const magnitude = Math.sqrt(
                accel.x * accel.x + 
                accel.y * accel.y + 
                accel.z * accel.z
            );

            // Build baseline during initial samples
            if (baselineHistory.length < STEP_CONFIG.BASELINE_SAMPLES) {
                baselineHistory.push(magnitude);
                if (baselineHistory.length === STEP_CONFIG.BASELINE_SAMPLES) {
                    // Calculate baseline (average when device is relatively still)
                    baselineMagnitude = baselineHistory.reduce((a, b) => a + b, 0) / baselineHistory.length;
                    console.log('Baseline established:', baselineMagnitude.toFixed(2), 'm/s²');
                }
                return;
            }

            // Start countdown on first motion (after baseline established)
            if (!firstInteraction) {
                firstInteraction = true;
                countdown.start();
                stepsInfo.classList.add('show');
                branding.hide();
                infoPanel.setContent('<p>Pedometer active - Walk to align all layers!</p>');
            }

            // Add to history for smoothing
            accelerationHistory.push(magnitude);
            if (accelerationHistory.length > STEP_CONFIG.SMOOTHING_WINDOW) {
                accelerationHistory.shift();
            }

            // Calculate smoothed magnitude
            const smoothedMagnitude = accelerationHistory.reduce((a, b) => a + b, 0) / accelerationHistory.length;

            // Calculate deviation from baseline
            const deviation = Math.abs(smoothedMagnitude - baselineMagnitude);

            // Update debug display
            debugCurrent.textContent = smoothedMagnitude.toFixed(2);
            debugDeviation.textContent = deviation.toFixed(2);
            debugBaseline.textContent = baselineMagnitude.toFixed(2);
            debugState.textContent = lookingForPeak ? 'LOOKING_PEAK' : 'LOOKING_VALLEY';

            // Detect step using improved algorithm
            detectStep(smoothedMagnitude, deviation);

            // Update walking state
            const now = Date.now();
            if (now - lastStepTime > STEP_CONFIG.MAX_STEP_INTERVAL) {
                setWalkingState(false);
            }
        }

        function detectStep(currentMagnitude, deviation) {
            const now = Date.now();
            
            // Check if enough time has passed since last step
            if (now - lastStepTime < STEP_CONFIG.MIN_STEP_INTERVAL) {
                return;
            }

            // Looking for peak (upward motion)
            if (lookingForPeak) {
                // Check if we have a significant peak above baseline
                if (deviation > STEP_CONFIG.THRESHOLD_LOW && 
                    deviation < STEP_CONFIG.THRESHOLD_HIGH &&
                    currentMagnitude > lastPeakMagnitude) {
                    lastPeakMagnitude = currentMagnitude;
                    debugPeak.textContent = lastPeakMagnitude.toFixed(2);
                } else if (lastPeakMagnitude > baselineMagnitude + STEP_CONFIG.THRESHOLD_LOW) {
                    // We found a peak, now look for valley
                    lookingForPeak = false;
                }
            } 
            // Looking for valley (downward motion after peak)
            else {
                // Check if magnitude is decreasing and close to baseline
                if (deviation < STEP_CONFIG.THRESHOLD_LOW * 0.7) {
                    // Step detected! Peak followed by valley = one step
                    totalSteps++;
                    lastStepTime = now;
                    
                    // Reset for next step
                    lookingForPeak = true;
                    lastPeakMagnitude = 0;
                    debugPeak.textContent = '--';
                    
                    // Update UI
                    totalStepsSpan.textContent = totalSteps;
                    debugSteps.textContent = totalSteps;
                    setWalkingState(true);
                    
                    // Rotate puzzle layer
                    const rotationDelta = STEP_CONFIG.ROTATION_PER_STEP;
                    puzzleContainer.rotateCurrentLayer(rotationDelta);
                    
                    // Small vibration feedback
                    StakcoUtils.vibrate([10]);
                    
                    console.log(`Step ${totalSteps} detected! Deviation: ${deviation.toFixed(2)}`);
                }
            }
        }

        function setWalkingState(walking) {
            if (walking !== isWalking) {
                isWalking = walking;
                if (walking) {
                    walkingIndicator.classList.add('active');
                } else {
                    walkingIndicator.classList.remove('active');
                }
            }
        }

        function updateRotationDisplay(rotation) {
            rotationValueSpan.textContent = `${Math.round(rotation)}°`;
        }

        function solvePuzzle(layerImages) {
            console.log('Puzzle solved!');
            
            countdown.stop();
            StakcoUtils.vibrate(StakcoConfig.VIBRATION_PATTERN);
            
            // Hide UI elements
            layerControls.hide();
            infoPanel.collapse();
            stepsInfo.classList.remove('show');
            
            // Show share button
            shareButton.show();
            
            // Animate to zero
            setTimeout(() => {
                puzzleContainer.animateToSolution(StakcoConfig.SOLVE_ANIMATION_DURATION);
            }, 500);
        }

        async function handleShare() {
            const timeToSolve = countdown.getTime();
            const layerImages = puzzleContainer.getLayerImages();
            
            const message = `Solved in ${timeToSolve} with ${totalSteps} steps!`;
            shareWindow.setAttribute('filename', `stakco-steps-${totalSteps}steps.png`);
            
            await shareWindow.open(layerImages, message, true);
        }

        async function checkPermissionNeeded() {
            if (typeof DeviceMotionEvent !== 'undefined' && 
                typeof DeviceMotionEvent.requestPermission === 'function') {
                permissionPrompt.show();
            } else {
                initializeMotion();
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
