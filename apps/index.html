    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--text-primary);
            min-height: 100dvh;
            overflow-x: hidden;
            padding: 40px 20px 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            flex: 1;
            overflow-y: auto;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 40px;
            padding: 20px;
            justify-content: center;
            justify-items: center;
            width: 100%;
            margin: 0 auto;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .app-item.hidden {
            display: none;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            position: relative;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 12px rgba(249, 167, 68, 0.3));
            transition: filter 0.3s ease;
        }

        .app-item:hover .app-icon {
            filter: drop-shadow(0 8px 20px rgba(249, 167, 68, 0.6));
        }

        .app-icon-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://stakcos.com/assets/1.0.0/images/stakco_logo_squricle.png') no-repeat center;
            background-size: contain;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .app-icon-bg.reveal {
            opacity: 1;
        }

        .app-icon-fg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(249, 167, 68, 0.1);
            border-radius: 20px;
            font-size: 36px;
            color: rgba(249, 167, 68, 0.9);
            transition: opacity 0.6s ease, background 0.3s ease;
        }

        .app-item:hover .app-icon-fg {
            background: rgba(249, 167, 68, 0.15);
        }

        .app-icon-fg.hide {
            opacity: 0;
        }

        .app-name {
            font-size: 14px;
            font-weight: 500;
            color: white;
            text-align: center;
            line-height: 1.3;
        }

        .search-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: var(--text-primary);
            display: flex;
            justify-content: center;
        }

        .search-bar {
            width: 100%;
            max-width: 600px;
            padding: 16px 24px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-bar:focus {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 2px rgba(249, 167, 68, 0.3);
        }

        .loading {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            padding: 40px;
            font-size: 14px;
        }

        .error {
            text-align: center;
            color: rgba(255, 100, 100, 0.8);
            padding: 40px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .apps-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 35px;
            }

            .app-icon {
                width: 70px;
                height: 70px;
            }

            .app-icon-fg {
                font-size: 32px;
            }

            .app-name {
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 40px 10px 100px;
            }

            .apps-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 30px;
                max-width: 340px;
                padding: 20px 10px;
            }

            .app-icon {
                width: 60px;
                height: 60px;
            }

            .app-icon-fg {
                font-size: 28px;
            }

            .app-name {
                font-size: 12px;
            }

            .search-container {
                padding: 15px;
            }

            .search-bar {
                padding: 14px 20px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="apps-grid" id="apps-grid">
            <div class="loading">Loading apps...</div>
        </div>
    </div>
    
    <div class="search-container">
        <input 
            type="text" 
            class="search-bar" 
            id="search-bar" 
            placeholder="Search"
            autocomplete="off"
        >
    </div>

    <script>
        const MANIFEST_URL = 'https://stakcos.com/assets/1.0.0/apps/manifest.json';
        let appsData = [];

        async function fetchManifest() {
            try {
                const response = await fetch(MANIFEST_URL);
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch manifest: ${response.status}`);
                }
                
                const data = await response.json();
                return data.apps || [];
            } catch (error) {
                console.error('Error fetching manifest:', error);
                throw error;
            }
        }

        function renderApps(apps) {
            const grid = document.getElementById('apps-grid');
            grid.innerHTML = '';
            
            if (apps.length === 0) {
                grid.innerHTML = '<div class="loading">No apps found</div>';
                return;
            }

            apps.forEach(app => {
                const appItem = document.createElement('a');
                appItem.href = app.url;
                appItem.className = 'app-item';
                appItem.target = '_blank';
                appItem.title = app.description || app.title;
                appItem.dataset.tags = (app.tags || []).join(' ');
                
                appItem.innerHTML = `
                    <div class="app-icon">
                        <div class="app-icon-bg"></div>
                        <div class="app-icon-fg">
                            <i class="${app.icon || 'fa-solid fa-puzzle-piece'}"></i>
                        </div>
                    </div>
                    <div class="app-name">${app.title}</div>
                `;
                
                grid.appendChild(appItem);
            });
        }

        function showError(message) {
            const grid = document.getElementById('apps-grid');
            grid.innerHTML = `<div class="error">${message}</div>`;
        }

        async function initializeApp() {
            try {
                appsData = await fetchManifest();
                renderApps(appsData);
            } catch (error) {
                showError('Failed to load apps. Please try again later.');
            }
        }

        document.addEventListener('DOMContentLoaded', initializeApp);

        // Synchronized reveal animation for all icons
        function startSynchronizedReveals() {
            function revealAllIcons() {
                const appItems = document.querySelectorAll('.app-item:not(.hidden)');
                
                appItems.forEach(item => {
                    const bg = item.querySelector('.app-icon-bg');
                    const fg = item.querySelector('.app-icon-fg');
                    
                    if (!bg || !fg) return;
                    
                    // Reveal Stakco logo
                    bg.classList.add('reveal');
                    fg.classList.add('hide');
                });
                
                // Hide after 1.5 seconds
                setTimeout(() => {
                    appItems.forEach(item => {
                        const bg = item.querySelector('.app-icon-bg');
                        const fg = item.querySelector('.app-icon-fg');
                        
                        if (!bg || !fg) return;
                        
                        bg.classList.remove('reveal');
                        fg.classList.remove('hide');
                    });
                }, 1500);
                
                // Schedule next reveal (between 4-12 seconds)
                const nextDelay = 4000 + Math.random() * 8000;
                setTimeout(revealAllIcons, nextDelay);
            }
            
            // Start first reveal after 3-6 seconds
            const initialDelay = 3000 + Math.random() * 3000;
            setTimeout(revealAllIcons, initialDelay);
        }

        document.addEventListener('DOMContentLoaded', () => {
            initializeApp();
            startSynchronizedReveals();
        });

        const searchBar = document.getElementById('search-bar');
        
        searchBar.addEventListener('focus', () => {
            setTimeout(() => {
                searchBar.scrollIntoView({ block: "center", behavior: "smooth" });
            }, 300);
        });
        
        searchBar.addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase().trim();
            const appItems = document.querySelectorAll('.app-item');
            
            appItems.forEach(item => {
                const appName = item.querySelector('.app-name').textContent.toLowerCase();
                const appTags = item.dataset.tags.toLowerCase();
                const appTitle = item.title.toLowerCase();
                
                if (appName.includes(searchTerm) || 
                    appTags.includes(searchTerm) || 
                    appTitle.includes(searchTerm)) {
                    item.classList.remove('hidden');
                } else {
                    item.classList.add('hidden');
                }
            });
        });
    </script>
</body>
