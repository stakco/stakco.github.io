    <style>
        body {
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        /* Clock Info Display - Bottom Horizontal Layout */
        #clock-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 8px 12px;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-soft);
            z-index: 1000;
            display: flex;
            flex-direction: row;
            gap: 0;
            font-family: 'Inter', sans-serif;
            align-items: center;
        }

        .clock-segment {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 5px;   /* vertical = 8px, horizontal = 5px */
            margin: 0 5px;      /* only horizontal margins */
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 20px;
            position: relative;
            outline: 1px solid grey;
        }

        .clock-segment:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .clock-segment.has-image::after {
            content: '';
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            background: #10b981;
            border: 2px solid var(--text-primary);
            border-radius: 50%;
        }

        .segment-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .segment-label.background,
        .segment-label.top {
            color: #9ca3af;
        }

        .segment-label.hour {
            color: #ff6b6b;
        }

        .segment-label.minute {
            color: #4ecdc4;
        }

        .segment-label.second {
            color: #45b7d1;
        }

        .segment-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            min-width: 38px;
            text-align: center;
            color: var(--text-secondary);
        }

        .segment-divider {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.2);
        }

        .file-input {
            display: none;
        }

        /* Upload hint on hover */
        .clock-segment:hover .upload-hint {
            opacity: 1;
        }

        .upload-hint {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: var(--text-secondary);
            opacity: 0;
            transition: opacity 0.2s ease;
            white-space: nowrap;
            pointer-events: none;
        }

<body>
    <stakco-info-panel icon="fa-clock">
        <p>Clock synchronized • Upload custom images</p>
    </stakco-info-panel>

    <stakco-branding 
        title="Stakco Clock" 
        version="v2.1.0" 
        subtitle="Time Puzzle">
    </stakco-branding>

    <stakco-products-panel></stakco-products-panel>

    <stakco-puzzle-container
        layers="3"
        user-id="109949450257686494443"
        puzzle-id="A2A3_3"
        tolerance="2"
        highlight-all="true">
    </stakco-puzzle-container>

    <!-- Clock Info Display -->
    <div id="clock-info">
        <!-- Background -->
        <div class="clock-segment" data-segment="background">
            <span class="segment-label background">B</span>
            <span class="segment-value" id="background-value">---</span>
            <span class="upload-hint">Upload</span>
        </div>
        
        <div class="segment-divider"></div>
        
        <!-- Hour -->
        <div class="clock-segment" data-segment="hour">
            <span class="segment-label hour">H</span>
            <span class="segment-value" id="hour-value">000'</span>
            <span class="upload-hint">Upload</span>
        </div>
        
        <div class="segment-divider"></div>
        
        <!-- Minute -->
        <div class="clock-segment" data-segment="minute">
            <span class="segment-label minute">M</span>
            <span class="segment-value" id="minute-value">000'</span>
            <span class="upload-hint">Upload</span>
        </div>
        
        <div class="segment-divider"></div>
        
        <!-- Second -->
        <div class="clock-segment" data-segment="second">
            <span class="segment-label second">S</span>
            <span class="segment-value" id="second-value">000'</span>
            <span class="upload-hint">Upload</span>
        </div>
        
        <div class="segment-divider"></div>
        
        <!-- Top -->
        <div class="clock-segment" data-segment="top">
            <span class="segment-label top">T</span>
            <span class="segment-value" id="top-value">---</span>
            <span class="upload-hint">Upload</span>
        </div>

        <!-- Hidden file inputs -->
        <input type="file" id="file-background" class="file-input" accept="image/*">
        <input type="file" id="file-hour" class="file-input" accept="image/*">
        <input type="file" id="file-minute" class="file-input" accept="image/*">
        <input type="file" id="file-second" class="file-input" accept="image/*">
        <input type="file" id="file-top" class="file-input" accept="image/*">
    </div>

    <script type="module">
        import { StakcoUtils } from 'https://stakcos.com/assets/1.0.0/components/stakco-utils.js';
        import { StakcoConfig } from 'https://stakcos.com/assets/1.0.0/components/stakco-config.js';

        const CONFIG = StakcoConfig.getConfig('clock');

        let animationId = null;
        let lastAngles = { hour: 0, minute: 0, second: 0 };

        const puzzleContainer = document.querySelector('stakco-puzzle-container');
        
        // Display elements
        const hourValueDisplay = document.getElementById('hour-value');
        const minuteValueDisplay = document.getElementById('minute-value');
        const secondValueDisplay = document.getElementById('second-value');

        async function init() {
            console.log('Initializing Stakco Clock...');
            StakcoUtils.preventZoom();
            setupEventListeners();
            setupImageUpload();
            console.log('App initialized');
        }

        function setupEventListeners() {
            puzzleContainer.addEventListener('puzzle-ready', () => {
                console.log('Puzzle ready - starting clock sync');
                
                if (typeof puzzleContainer.setLayerRotation !== 'function') {
                    console.error('setLayerRotation method not found on puzzle container!');
                    return;
                }
                
                const angles = calculateClockAngles();
                console.log('Setting initial angles:', angles);
                
                puzzleContainer.setLayerRotation(1, angles.hour);
                puzzleContainer.setLayerRotation(2, angles.minute);
                puzzleContainer.setLayerRotation(3, angles.second);
                
                lastAngles = angles;
                updateDisplays(angles);
                
                console.log('Initial setup complete, starting animation loop');
                startClockUpdate();
            });

            // TODO : Better way to check if puzzle is ready without relying on timeout
            setTimeout(() => {
                if (puzzleContainer.puzzleLayers && Object.keys(puzzleContainer.puzzleLayers).length > 0) {
                    console.log('Puzzle was already ready, starting clock now');
                    const angles = calculateClockAngles();
                    puzzleContainer.setLayerRotation(1, angles.hour);
                    puzzleContainer.setLayerRotation(2, angles.minute);
                    puzzleContainer.setLayerRotation(3, angles.second);
                    lastAngles = angles;
                    updateDisplays(angles);
                    startClockUpdate();
                }
            }, 100);

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    stopClockUpdate();
                } else {
                    const angles = calculateClockAngles();
                    puzzleContainer.setLayerRotation(1, angles.hour);
                    puzzleContainer.setLayerRotation(2, angles.minute);
                    puzzleContainer.setLayerRotation(3, angles.second);
                    lastAngles = angles;
                    startClockUpdate();
                }
            });
        }

        function setupImageUpload() {
            const segments = ['background', 'hour', 'minute', 'second', 'top'];
            
            segments.forEach(segment => {
                const segmentBtn = document.querySelector(`[data-segment="${segment}"]`);
                const fileInput = document.getElementById(`file-${segment}`);
                
                segmentBtn.addEventListener('click', () => {
                    fileInput.click();
                });
                
                fileInput.addEventListener('change', (e) => {
                    handleImageUpload(segment, e);
                });
            });
        }

        function handleImageUpload(segment, event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const imageUrl = e.target.result;
                
                // Update puzzle container based on segment type
                if (segment === 'background') {
                    puzzleContainer.setBackgroundImage(imageUrl);
                } else if (segment === 'top') {
                    puzzleContainer.setTopImage(imageUrl);
                } else {
                    // Map segment names to layer numbers
                    const layerMap = { hour: 1, minute: 2, second: 3 };
                    const layerNum = layerMap[segment];
                    if (layerNum) {
                        puzzleContainer.setLayerImage(layerNum, imageUrl);
                    }
                }
                
                // Add visual indicator
                const segmentBtn = document.querySelector(`[data-segment="${segment}"]`);
                segmentBtn.classList.add('has-image');
                
                console.log(`Image uploaded for ${segment}:`, file.name);
            };
            reader.readAsDataURL(file);
        }

        function calculateClockAngles() {
            const now = new Date();
            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            const secondAngle = (seconds + milliseconds / 1000) * 6;
            const minuteAngle = (minutes + seconds / 60) * 6;
            const hourAngle = (hours + minutes / 60) * 30;

            return {
                hour: hourAngle,
                minute: minuteAngle,
                second: secondAngle
            };
        }

        function calculateDelta(current, last) {
            let delta = current - (last % 360);
            
            if (delta < -180) delta += 360;
            if (delta > 180) delta -= 360;
            
            return delta;
        }

        function updateLayers() {
            const angles = calculateClockAngles();

            const hourDelta = calculateDelta(angles.hour, lastAngles.hour);
            const minuteDelta = calculateDelta(angles.minute, lastAngles.minute);
            const secondDelta = calculateDelta(angles.second, lastAngles.second);

            if (Math.abs(hourDelta) > 0.001) puzzleContainer.rotateLayer(1, hourDelta);
            if (Math.abs(minuteDelta) > 0.001) puzzleContainer.rotateLayer(2, minuteDelta);
            if (Math.abs(secondDelta) > 0.001) puzzleContainer.rotateLayer(3, secondDelta);

            updateDisplays(angles);
            lastAngles = angles;
        }

        function updateDisplays(angles) {
            hourValueDisplay.textContent = `${Math.round(angles.hour).toString().padStart(3, '0')}'`;
            minuteValueDisplay.textContent = `${Math.round(angles.minute).toString().padStart(3, '0')}'`;
            secondValueDisplay.textContent = `${Math.round(angles.second).toString().padStart(3, '0')}'`;
        }

        function startClockUpdate() {
            if (animationId) return;

            function update() {
                updateLayers();
                animationId = requestAnimationFrame(update);
            }
            
            updateLayers();
            animationId = requestAnimationFrame(update);
            
            console.log('Clock update loop started');
        }

        function stopClockUpdate() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
                console.log('Clock update loop stopped');
            }
        }

        window.addEventListener('beforeunload', stopClockUpdate);
        document.addEventListener('DOMContentLoaded', init);
    </script>
