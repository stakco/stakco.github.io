    <style>
        body {
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        /* Clock Info Display */
        #clock-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        .time-indicator {
            width: 70px;
            height: 70px;
            border: 3px solid var(--glass-border);
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            background: var(--glass-bg);
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .time-indicator.hour {
            border-color: #ff6b6b;
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }

        .time-indicator.minute {
            border-color: #4ecdc4;
            color: #4ecdc4;
            background: rgba(78, 205, 196, 0.1);
        }

        .time-indicator.second {
            border-color: #45b7d1;
            color: #45b7d1;
            background: rgba(69, 183, 209, 0.1);
        }

        .time-label {
            font-size: 9px;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .angle-display {
            font-size: 14px;
            font-weight: 600;
        }

        /* Clock face overlay */
        .clock-face {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
        }

        .clock-hand {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: bottom center;
            background: var(--primary-color);
            opacity: 0.4;
        }

        .hour-hand {
            width: 4px;
            height: 25%;
            transform: translate(-50%, -100%) rotate(0deg);
            background: #ff6b6b;
        }

        .minute-hand {
            width: 3px;
            height: 35%;
            transform: translate(-50%, -100%) rotate(0deg);
            background: #4ecdc4;
        }

        .second-hand {
            width: 2px;
            height: 40%;
            transform: translate(-50%, -100%) rotate(0deg);
            background: #45b7d1;
        }

        .clock-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: var(--primary-color);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: var(--shadow-glow);
        }

        /* Container wrapper for clock face */
        #clock-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

<body>
    <!-- Components -->
    <stakco-info-panel icon="fa-clock">
        <p>Clock synchronized • Layers rotate with time</p>
    </stakco-info-panel>

    <stakco-branding 
        title="Stakco Clock" 
        version="v2.0.0" 
        subtitle="Time Puzzle">
    </stakco-branding>

    <stakco-products-panel></stakco-products-panel>

    <stakco-puzzle-container
        layers="3"
        user-id="109949450257686494443"
        puzzle-id="A2A3_3"
        tolerance="2"
        highlight-all="true"
        >
        <!-- Clock face overlay inside puzzle container -->
        <div id="clock-wrapper" slot="overlay">
            <div class="clock-face">
                <div class="hour-hand clock-hand" id="ref-hour-hand"></div>
                <div class="minute-hand clock-hand" id="ref-minute-hand"></div>
                <div class="second-hand clock-hand" id="ref-second-hand"></div>
                <div class="clock-center"></div>
            </div>
        </div>
    </stakco-puzzle-container>

    <!-- Clock Info Display -->
    <div id="clock-info">
        <div class="time-indicator hour">
            <div class="angle-display" id="hour-angle">0°</div>
            <div class="time-label">Hour</div>
        </div>
        <div class="time-indicator minute">
            <div class="angle-display" id="minute-angle">0°</div>
            <div class="time-label">Min</div>
        </div>
        <div class="time-indicator second">
            <div class="angle-display" id="second-angle">0°</div>
            <div class="time-label">Sec</div>
        </div>
    </div>

    <script type="module">
        import { StakcoUtils } from 'https://stakcos.com/assets/1.0.0/components/stakco-utils.js';
        import { StakcoConfig } from 'https://stakcos.com/assets/1.0.0/components/stakco-config.js';

        // Get configuration for this app
        const CONFIG = StakcoConfig.getConfig('clock');

        // App state
        let animationId = null;
        let lastAngles = { hour: 0, minute: 0, second: 0 };

        // Get component references
        const puzzleContainer = document.querySelector('stakco-puzzle-container');
        const infoPanel = document.querySelector('stakco-info-panel');
        const branding = document.querySelector('stakco-branding');
        
        // Display elements
        const hourAngleDisplay = document.getElementById('hour-angle');
        const minuteAngleDisplay = document.getElementById('minute-angle');
        const secondAngleDisplay = document.getElementById('second-angle');
        const refHourHand = document.getElementById('ref-hour-hand');
        const refMinuteHand = document.getElementById('ref-minute-hand');
        const refSecondHand = document.getElementById('ref-second-hand');

        async function init() {
            console.log('Initializing Stakco Clock...');

            StakcoUtils.preventZoom();
            setupEventListeners();

            console.log('App initialized');
        }

        function setupEventListeners() {
            // Puzzle container events
            puzzleContainer.addEventListener('puzzle-ready', () => {
                console.log('Puzzle ready - starting clock sync');
                
                // Verify setLayerRotation method exists
                if (typeof puzzleContainer.setLayerRotation !== 'function') {
                    console.error('setLayerRotation method not found on puzzle container!');
                    return;
                }
                
                // Set initial angles to current time
                const angles = calculateClockAngles();
                console.log('Setting initial angles:', angles);
                
                puzzleContainer.setLayerRotation(1, angles.hour);
                puzzleContainer.setLayerRotation(2, angles.minute);
                puzzleContainer.setLayerRotation(3, angles.second);
                
                lastAngles = angles;
                
                // Update displays
                updateDisplays(angles);
                updateClockHands(angles);
                
                console.log('Initial setup complete, starting animation loop');
                startClockUpdate();
            });

            // Handle page visibility for performance
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    stopClockUpdate();
                } else {
                    // Resync when tab becomes visible again
                    const angles = calculateClockAngles();
                    puzzleContainer.setLayerRotation(1, angles.hour);
                    puzzleContainer.setLayerRotation(2, angles.minute);
                    puzzleContainer.setLayerRotation(3, angles.second);
                    lastAngles = angles;
                    startClockUpdate();
                }
            });
        }

        // Calculate clock hand angles
        function calculateClockAngles() {
            const now = new Date();
            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            // Calculate angles (0° = 12 o'clock, clockwise)
            const secondAngle = (seconds + milliseconds / 1000) * 6; // 6° per second
            const minuteAngle = (minutes + seconds / 60) * 6; // 6° per minute
            const hourAngle = (hours + minutes / 60) * 30; // 30° per hour

            return {
                hour: hourAngle,
                minute: minuteAngle,
                second: secondAngle
            };
        }

        // Calculate smooth rotation delta
        function calculateDelta(current, last) {
            let delta = current - (last % 360);
            
            // Handle wrapping (e.g., 359° → 0° should be +1°)
            if (delta < -180) delta += 360;
            if (delta > 180) delta -= 360;
            
            return delta;
        }

        // Update layers based on current time
        function updateLayers() {
            const angles = calculateClockAngles();

            // Calculate deltas for smooth rotation
            const hourDelta = calculateDelta(angles.hour, lastAngles.hour);
            const minuteDelta = calculateDelta(angles.minute, lastAngles.minute);
            const secondDelta = calculateDelta(angles.second, lastAngles.second);

            // Log significant changes (debug)
            if (Math.abs(secondDelta) > 0.1) {
                console.log('Rotating layers - Hour:', hourDelta.toFixed(2), 'Min:', minuteDelta.toFixed(2), 'Sec:', secondDelta.toFixed(2));
            }

            // Apply rotations to puzzle layers
            if (Math.abs(hourDelta) > 0.001) puzzleContainer.rotateLayer(1, hourDelta);
            if (Math.abs(minuteDelta) > 0.001) puzzleContainer.rotateLayer(2, minuteDelta);
            if (Math.abs(secondDelta) > 0.001) puzzleContainer.rotateLayer(3, secondDelta);

            // Update reference clock hands and displays
            updateClockHands(angles);
            updateDisplays(angles);

            // Store last angles
            lastAngles = angles;
        }

        // Update clock hand visuals
        function updateClockHands(angles) {
            if (refHourHand) {
                refHourHand.style.transform = `translate(-50%, -100%) rotate(${angles.hour}deg)`;
            }
            if (refMinuteHand) {
                refMinuteHand.style.transform = `translate(-50%, -100%) rotate(${angles.minute}deg)`;
            }
            if (refSecondHand) {
                refSecondHand.style.transform = `translate(-50%, -100%) rotate(${angles.second}deg)`;
            }
        }

        // Update display elements
        function updateDisplays(angles) {
            hourAngleDisplay.textContent = `${Math.round(angles.hour)}°`;
            minuteAngleDisplay.textContent = `${Math.round(angles.minute)}°`;
            secondAngleDisplay.textContent = `${Math.round(angles.second)}°`;
        }

        // Start the clock update loop
        function startClockUpdate() {
            if (animationId) return; // Already running

            function update() {
                updateLayers();
                animationId = requestAnimationFrame(update);
            }
            
            updateLayers(); // Initial update
            animationId = requestAnimationFrame(update);
            
            console.log('Clock update loop started');
        }

        // Stop the clock update loop
        function stopClockUpdate() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
                console.log('Clock update loop stopped');
            }
        }

        // Cleanup on unload
        window.addEventListener('beforeunload', stopClockUpdate);

        // Start app
        document.addEventListener('DOMContentLoaded', init);
    </script>
