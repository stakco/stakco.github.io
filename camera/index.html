    <style>
        body {
            padding: 0;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        html, body {
            height: 100%;
        }

        #touch-info {
            max-width: 75%;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            border-radius: 25px;
            padding: 15px 30px;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-soft);
            z-index: 800;
            display: flex;
            gap: 20px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
        }

        @media (max-width: 600px) {
            #touch-info {
                top: 80px;
            }
        }

        #touch-info.hidden {
            display: none;
        }

        .touch-row {
            display: flex;
            align-items: center;
        }

        .touch-label {
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .touch-value {
            color: var(--primary-color);
            font-weight: 600;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
        }

        #video-container {
            display: block;
            position: relative;
            width: 90vmin;
            height: 90vmin;
            max-width: calc(100vw - 20px);
            max-height: calc(100vh - 200px);
            margin: 0 auto;
            touch-action: none;
        }

        .video-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            overflow: hidden;
            touch-action: none;
            cursor: grab;
        }

        .video-layer:active {
            cursor: grabbing;
        }

        .video-layer video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        #layer1 {
            z-index: 3;
            width: 100%;
            height: 100%;
            /* Apply your shape mask */
            -webkit-mask-image: url('./masks/jigsaw_red-3.png');
            mask-image: url('./masks/jigsaw_red-3.png');
        }

        #layer2 {
            z-index: 2;
            width: 100%;
            height: 100%;
            /* Apply your shape mask */
            -webkit-mask-image: url('./masks/jigsaw_green-3.png');
            mask-image: url('./masks/jigsaw_green-3.png');
        }

        #layer3 {
            z-index: 1;
            width: 100%;
            height: 100%;
            /* Apply your shape mask */
            -webkit-mask-image: url('./masks/jigsaw_blue-3.png');
            mask-image: url('./masks/jigsaw_blue-3.png');
        }

        /* Base mask setup */
        .masked {
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-position: center;
            mask-position: center;
        }

        /* Inverse masking utility */
        .mask-invert {
            -webkit-mask-image: linear-gradient(#fff, #fff);
            mask-image: linear-gradient(#fff, #fff);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        .video-layer.active {
            z-index: 10;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.6);
        }

        /* Camera permission overlay */
        #camera-permission {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            gap: 20px;
        }

        #camera-permission.hidden {
            display: none;
        }

        #camera-permission button {
            padding: 15px 40px;
            font-size: 18px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        #camera-permission button:hover {
            transform: scale(1.05);
        }

        #camera-permission p {
            color: white;
            font-size: 16px;
            max-width: 400px;
            text-align: center;
            padding: 0 20px;
        }

        #camera-permission i {
            color: var(--primary-color);
            font-size: 64px;
        }

<body>
    <div id="camera-permission">
        <i class="fas fa-camera"></i>
        <p>This puzzle needs access to your camera to create the interactive experience</p>
        <button id="enable-camera">Enable Camera</button>
    </div>

    <stakco-info-panel icon="fa-hand-pointer">
        <p>Touch and drag to rotate layers - Align all camera feeds to solve!</p>
    </stakco-info-panel>

    <stakco-branding 
        title="Stakco Touch" 
        version="v2.0.0" 
        subtitle="Webcam Puzzle">
    </stakco-branding>

    <stakco-products-panel></stakco-products-panel>

    <div id="touch-info" class="hidden">
        <div class="touch-row">
            <span class="touch-label">Rotation:</span>
            <span class="touch-value" id="rotation-value">0°</span>
        </div>
        <div class="touch-row">
            <span class="touch-label">Layer:</span>
            <span class="touch-value" id="active-layer">1</span>
        </div>
        <div class="touch-row">
            <span class="touch-label">Moves:</span>
            <span class="touch-value" id="move-count">0</span>
        </div>
    </div>

    <div id="video-container">
        <div id="layer3" class="video-layer masked mask-invert">
            <video id="video3" playsinline muted autoplay></video>
        </div>
        <div id="layer2" class="video-layer masked mask-invert">
            <video id="video2" playsinline muted autoplay></video>
        </div>
        <div id="layer1" class="video-layer masked mask-invert active">
            <video id="video1" playsinline muted autoplay></video>
        </div>
    </div>
    
    <stakco-layer-controls layers="3"></stakco-layer-controls>

    <stakco-share-button label="Share Success!"></stakco-share-button>

    <stakco-share-window 
        title="Stakco Touch Webcam"
        share-url="https://stakcos.com/touch-webcam/">
        <div slot="text">Solved the webcam puzzle!</div>
    </stakco-share-window>

    <script type="module">
        import { StakcoUtils } from 'https://stakcos.com/assets/1.0.0/components/stakco-utils.js';

        let currentLayer = 1;
        let moveCount = 0;
        let puzzleSolved = false;
        let layerRotations = { 1: 0, 2: 120, 3: 240 };
        let stream = null;
        const ALIGNMENT_TOLERANCE = 5;

        const layerControls = document.querySelector('stakco-layer-controls');
        const infoPanel = document.querySelector('stakco-info-panel');
        const shareWindow = document.querySelector('stakco-share-window');
        const branding = document.querySelector('stakco-branding');
        const shareButton = document.querySelector('stakco-share-button');
        const cameraPermission = document.getElementById('camera-permission');
        const enableCameraBtn = document.getElementById('enable-camera');
        
        const touchInfo = document.getElementById('touch-info');
        const rotationValueSpan = document.getElementById('rotation-value');
        const activeLayerSpan = document.getElementById('active-layer');
        const moveCountSpan = document.getElementById('move-count');

        const layer1El = document.getElementById('layer1');
        const layer2El = document.getElementById('layer2');
        const layer3El = document.getElementById('layer3');
        const video1 = document.getElementById('video1');
        const video2 = document.getElementById('video2');
        const video3 = document.getElementById('video3');

        const layers = {
            1: { element: layer1El, video: video1, rotation: 0 },
            2: { element: layer2El, video: video2, rotation: 120 },
            3: { element: layer3El, video: video3, rotation: 240 }
        };

        async function init() {
            console.log('Initializing Stakco Touch Webcam...');
            
            StakcoUtils.preventZoom();
            setupEventListeners();
            
            console.log('App initialized, waiting for camera permission');
        }

        async function initializeCamera() {
            try {
                // Request camera access with ideal constraints
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 1280 },
                        facingMode: 'user' // Use front camera by default
                    },
                    audio: false
                });

                // Set the same stream to all three video elements
                video1.srcObject = stream;
                video2.srcObject = stream;
                video3.srcObject = stream;

                // Wait for all videos to be ready
                await Promise.all([
                    new Promise(resolve => video1.addEventListener('loadedmetadata', resolve, { once: true })),
                    new Promise(resolve => video2.addEventListener('loadedmetadata', resolve, { once: true })),
                    new Promise(resolve => video3.addEventListener('loadedmetadata', resolve, { once: true }))
                ]);

                // Hide permission screen
                cameraPermission.classList.add('hidden');

                // Start the puzzle
                setTimeout(() => {
                    touchInfo.classList.remove('hidden');
                    branding.hide();
                    randomizeRotations();
                }, 1000);

                console.log('Camera initialized successfully');
            } catch (error) {
                console.error('Camera access error:', error);
                alert('Unable to access camera. Please ensure you have granted camera permissions.');
            }
        }

        function randomizeRotations() {
            layers[1].rotation = Math.random() * 360;
            layers[2].rotation = Math.random() * 360;
            layers[3].rotation = Math.random() * 360;
            updateAllLayers();
        }

        function setupEventListeners() {
            // Camera enable button
            enableCameraBtn.addEventListener('click', initializeCamera);

            // Setup container-level interaction (rotates currently selected layer)
            setupContainerInteraction();

            layerControls.addEventListener('layerchange', (e) => {
                switchLayer(e.detail.layer);
            });

            shareButton.addEventListener('share-clicked', handleShare);

            // Mouse wheel to rotate selected layer
            const container = document.getElementById('video-container');
            container.addEventListener('wheel', handleWheel, { passive: false });
        }

        function setupContainerInteraction() {
            const container = document.getElementById('video-container');
            let isDragging = false;
            let startAngle = 0;
            let startRotation = 0;

            // Prevent context menu on right-click
            container.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                if (puzzleSolved) return;
                
                // Cycle to next layer
                const nextLayer = (currentLayer % 3) + 1;
                switchLayer(nextLayer);

                // Update layer controls UI
                layerControls.setActiveLayer(nextLayer);
            });

            const getAngle = (e) => {
                const rect = container.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - centerX;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - centerY;
                return Math.atan2(y, x) * (180 / Math.PI);
            };

            const handleStart = (e) => {
                if (puzzleSolved) return;
                e.preventDefault();
                isDragging = true;
                startAngle = getAngle(e);
                startRotation = layers[currentLayer].rotation;
            };

            const handleMove = (e) => {
                if (!isDragging || puzzleSolved) return;
                e.preventDefault();
                
                const currentAngle = getAngle(e);
                const deltaAngle = currentAngle - startAngle;
                layers[currentLayer].rotation = (startRotation + deltaAngle + 360) % 360;
                
                updateLayer(currentLayer);
                rotationValueSpan.textContent = `${Math.round(layers[currentLayer].rotation)}°`;
            };

            const handleEnd = (e) => {
                if (!isDragging) return;
                isDragging = false;
                moveCount++;
                moveCountSpan.textContent = moveCount;
                checkAlignment();
            };

            // Touch events
            container.addEventListener('touchstart', handleStart, { passive: false });
            container.addEventListener('touchmove', handleMove, { passive: false });
            container.addEventListener('touchend', handleEnd);

            // Mouse events
            container.addEventListener('mousedown', handleStart);
            document.addEventListener('mousemove', handleMove);
            document.addEventListener('mouseup', handleEnd);
        }

        function handleWheel(e) {
            if (puzzleSolved) return;
            e.preventDefault();
            
            // Scroll up = rotate counter-clockwise, scroll down = rotate clockwise
            const delta = e.deltaY > 0 ? 0.5 : -0.5;
            layers[currentLayer].rotation = (layers[currentLayer].rotation + delta + 360) % 360;
            
            updateLayer(currentLayer);
            rotationValueSpan.textContent = `${Math.round(layers[currentLayer].rotation)}°`;
            
            moveCount++;
            moveCountSpan.textContent = moveCount;
            checkAlignment();
        }

        function switchLayer(layerNum) {
            currentLayer = layerNum;
            activeLayerSpan.textContent = layerNum;
            
            Object.keys(layers).forEach(num => {
                layers[num].element.classList.remove('active');
            });
            layers[layerNum].element.classList.add('active');
            
            rotationValueSpan.textContent = `${Math.round(layers[layerNum].rotation)}°`;
        }

        function updateLayer(layerNum) {
            const layer = layers[layerNum];
            layer.element.style.transform = `translate(-50%, -50%) rotate(${layer.rotation}deg)`;
        }

        function updateAllLayers() {
            Object.keys(layers).forEach(num => updateLayer(parseInt(num)));
        }

        function checkAlignment() {
            const rot1 = layers[1].rotation % 360;
            const rot2 = layers[2].rotation % 360;
            const rot3 = layers[3].rotation % 360;

            const aligned = Math.abs(rot1 - rot2) < ALIGNMENT_TOLERANCE &&
                          Math.abs(rot2 - rot3) < ALIGNMENT_TOLERANCE &&
                          Math.abs(rot1 - rot3) < ALIGNMENT_TOLERANCE;

            if (aligned && !puzzleSolved) {
                handlePuzzleSolved();
            }
        }

        function handlePuzzleSolved() {
            puzzleSolved = true;
            console.log(`Puzzle solved in ${moveCount} moves!`);

            StakcoUtils.vibrate([200, 100, 300, 100, 200]);

            infoPanel.setContent(`<p>Puzzle solved in ${moveCount} moves!</p>`);

            // Animate to perfect alignment
            layers[1].rotation = 0;
            layers[2].rotation = 0;
            layers[3].rotation = 0;
            updateAllLayers();

            setTimeout(() => {
                layerControls.hide();
                touchInfo.classList.add('hidden');
                shareButton.show();
            }, 2000);
        }

        async function handleShare() {
            const canvas = document.createElement('canvas');
            canvas.width = 500;
            canvas.height = 500;
            const ctx = canvas.getContext('2d');

            // Capture current frame from webcam videos
            ctx.drawImage(video3, 0, 0, 500, 500);
            ctx.globalAlpha = 0.8;
            ctx.drawImage(video2, 50, 50, 400, 400);
            ctx.globalAlpha = 1;
            ctx.drawImage(video1, 100, 100, 300, 300);

            const dataUrl = canvas.toDataURL('image/png');
            const message = `Solved in ${moveCount} moves!`;
            
            shareWindow.setAttribute('filename', `stakco-touch-webcam-${moveCount}moves.png`);
            await shareWindow.open([dataUrl, dataUrl, dataUrl], message, true);
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
