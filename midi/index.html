<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI Compass Puzzle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #container {
            position: relative;
            width: 90vmin;
            height: 90vmin;
            max-width: calc(100vw - 20px);
            max-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .puzzle-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .puzzle-layer.active {
            opacity: 1;
            z-index: 10;
        }

        #layer1 {
            background-image: url('https://storage.googleapis.com/stakco-images/109949450257686494443/latest/A2A3_3/A2A3_0.png');
            z-index: 3;
        }

        #layer2 {
            background-image: url('https://storage.googleapis.com/stakco-images/109949450257686494443/latest/A2A3_3/A2A3_1.png');
            z-index: 2;
        }

        #layer3 {
            background-image: url('https://storage.googleapis.com/stakco-images/109949450257686494443/latest/A2A3_3/A2A3_2.png');
            z-index: 1;
        }

        #info {
            position: absolute;
            top: 70px;
            left: 20px;
            right: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            gap: 30px;
            justify-content: center;
            align-items: center;
        }

        #status {
            position: absolute;
            top: 10px;
            left: 20px;
            right: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            font-family: 'Courier New', monospace;
            color: #0f0;
            text-shadow:
                0 0 5px #0f0,
                0 0 10px #0f0,
                0 0 20px #0f0,
                0 0 40px #0f0;
            letter-spacing: 1px;
        }

        #status.hidden {
            display: none;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        #controls.hidden {
            display: none;
        }

        #share-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #00ff00;
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            box-shadow: 0 0 30px #00ff00;
            transition: all 0.3s ease;
            z-index: 1000;
            text-align: center;
            width: 50%;
        }

        #share-button.show {
            display: block;
        }

        #share-button:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 0 40px #00ff00;
        }

        .layer-button {
            width: 60px;
            height: 60px;
            border: 3px solid #555;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            color: #777;
            background: rgba(68, 68, 68, 0.3);
        }

        .layer-button.layer1 {
            border-color: #555;
        }

        .layer-button.layer2 {
            border-color: #555;
        }

        .layer-button.layer3 {
            border-color: #555;
        }

        .layer-button.active {
            background: #00ff00;
            border-color: #00ff00;
            color: #000;
            box-shadow: 0 0 20px #00ff00;
            transform: scale(1.1);
        }

        .layer-button:hover:not(.active) {
            border-color: #888;
            color: #aaa;
            background: rgba(136, 136, 136, 0.2);
        }

        /* LED Text Styling */
        .led-text {
            display: inline-block;
            margin: 0 10px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            color: #0f0;
            text-shadow:
                0 0 5px #0f0,
                0 0 10px #0f0,
                0 0 20px #0f0,
                0 0 40px #0f0;
            letter-spacing: 2px;
        }

        .led-label {
            color: #0a0;
            font-weight: bold;
            margin-right: 6px;
            text-shadow:
                0 0 3px #060,
                0 0 6px #090;
        }

        .led-value {
            color: #0f0;
            font-weight: bold;
            text-transform: uppercase;
        }

        .led-midi {
            color: #ff0;
            text-shadow: 0 0 5px #ff0, 0 0 15px #ff0;
        }

        .led-layer {
            color: #f0f;
            text-shadow: 0 0 5px #f0f, 0 0 15px #f0f;
        }

        .led-puzzle {
            color: #0ff;
            text-shadow: 0 0 5px #0ff, 0 0 15px #0ff;
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
            }
            20%, 24%, 55% {
                opacity: 0.8;
            }
            22% {
                opacity: 0.6;
            }
        }

        .led-text,
        .led-value {
            animation: flicker 2.5s infinite;
        }

        .permission-prompt {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 10000;
            width: 70%;
            display: none;
            border: 2px solid #fff;
        }

        .permission-prompt.show {
            display: block;
        }

        .permission-button {
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
        }

        .permission-button:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        /* MIDI Activity Indicator */
        .midi-activity {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #333;
            border: 2px solid #666;
            transition: all 0.2s ease;
        }

        .midi-activity.active {
            background: #00ff00;
            border-color: #00ff00;
            box-shadow: 0 0 20px #00ff00;
        }

        /* MIDI Note Visualization */
        .note-visual {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            z-index: 1000;
        }

        .note-bar {
            width: 8px;
            height: 40px;
            background: #333;
            border-radius: 4px;
            transition: all 0.1s ease;
        }

        .note-bar.active {
            background: linear-gradient(to top, #ff0066, #ff6600, #ffff00);
            box-shadow: 0 0 10px #ff6600;
        }
    </style>
</head>

<body>
    <div id="status">
        <p id="midi-status">Initializing MIDI...</p>
        <div class="midi-activity" id="midi-indicator"></div>
    </div>

    <div id="info">
        <span class="led-text">
            <span class="led-label">NOTE:</span>
            <span class="led-value led-midi" id="last-note">---</span>
        </span>
        <span class="led-text">
            <span class="led-label">LYR:</span>
            <span class="led-value led-layer" id="active-layer">1</span>
        </span>
        <span class="led-text">
            <span class="led-label">ROT:</span>
            <span class="led-value led-puzzle" id="rotation-value">0°</span>
        </span>
    </div>

    <div id="container">
        <div id="layer1" class="puzzle-layer active"></div>
        <div id="layer2" class="puzzle-layer"></div>
        <div id="layer3" class="puzzle-layer"></div>
    </div>

    <div class="note-visual" id="note-visual">
        <!-- Note bars will be generated here -->
    </div>

    <div id="controls">
        <button class="layer-button layer1 active" data-layer="1">1</button>
        <button class="layer-button layer2" data-layer="2">2</button>
        <button class="layer-button layer3" data-layer="3">3</button>
    </div>

    <div id="share-button" onclick="sharePuzzle()">🎉 Share Success!</div>

    <div id="permission-prompt" class="permission-prompt">
        <h3>Enable MIDI Access</h3>
        <p>This app needs access to your MIDI devices to control the puzzle layers with musical input.</p>
        <p>Connect a MIDI keyboard or controller, then click Enable MIDI.</p>
        <button class="permission-button" onclick="requestMIDIAccess()">Enable MIDI</button>
        <button class="permission-button" onclick="hidePermissionPrompt()">Skip</button>
    </div>

    <script>
        // App state
        let currentLayer = 1;
        let lastNote = null;
        let midiSupported = false;
        let midiAccess = null;
        let puzzleSolved = false;
        let rotationAccumulator = 0;
        let noteCount = 0;

        // Puzzle layer data structure with random initial rotations
        const puzzleLayers = {
            layer1: { 
                url: null, 
                rotation: 350, // Random initial rotation
                baseRotation: 350 // Store the base rotation
            },
            layer2: { 
                url: null, 
                rotation: 83, // Random initial rotation
                baseRotation: 83 // Store the base rotation
            },
            layer3: { 
                url: null, 
                rotation: 270, // Random initial rotation
                baseRotation: 270 // Store the base rotation
            }
        };

        // MIDI note names for display
        const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        // DOM elements
        const lastNoteSpan = document.getElementById('last-note');
        const activeLayerSpan = document.getElementById('active-layer');
        const rotationValueSpan = document.getElementById('rotation-value');
        const midiStatus = document.getElementById('midi-status');
        const midiIndicator = document.getElementById('midi-indicator');
        const permissionPrompt = document.getElementById('permission-prompt');
        const controlsDiv = document.getElementById('controls');
        const statusDiv = document.getElementById('status');
        const shareButton = document.getElementById('share-button');
        const noteVisual = document.getElementById('note-visual');

        // Load today's puzzle data
        async function loadPuzzleData() {
            try {
                console.log('Loading puzzle...');
                
                // Direct image URLs - no server loading needed
                puzzleLayers.layer1.url = 'https://storage.googleapis.com/stakco-images/109949450257686494443/latest/A2A3_3/A2A3_0.png';
                puzzleLayers.layer2.url = 'https://storage.googleapis.com/stakco-images/109949450257686494443/latest/A2A3_3/A2A3_1.png';
                puzzleLayers.layer3.url = 'https://storage.googleapis.com/stakco-images/109949450257686494443/latest/A2A3_3/A2A3_2.png';

                // Apply initial random rotations to all layers
                applyInitialRotations();
                updateRotationDisplay();

                console.log('Puzzle images loaded successfully');
                console.log('Initial rotations:', {
                    layer1: puzzleLayers.layer1.rotation + '°',
                    layer2: puzzleLayers.layer2.rotation + '°',
                    layer3: puzzleLayers.layer3.rotation + '°'
                });

            } catch (error) {
                console.error('Error loading puzzle data:', error);
                midiStatus.textContent = 'Failed to load puzzle data';
            }
        }

        // Apply initial random rotations to all layers
        function applyInitialRotations() {
            Object.keys(puzzleLayers).forEach(layerKey => {
                const layerNumber = layerKey.replace('layer', '');
                const layerElement = document.getElementById(layerKey);
                const rotation = puzzleLayers[layerKey].rotation;
                
                if (layerElement) {
                    layerElement.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
                }
            });
        }

        // Create note visualization bars
        function createNoteVisual() {
            noteVisual.innerHTML = '';
            for (let i = 0; i < 12; i++) {
                const bar = document.createElement('div');
                bar.className = 'note-bar';
                bar.dataset.note = i;
                noteVisual.appendChild(bar);
            }
        }

        // Handle MIDI message
        function handleMIDIMessage(message) {
            if (puzzleSolved) return;

            const [status, note, velocity] = message.data;
            
            // Only handle note on messages (0x90 = 144)
            if ((status & 0xF0) === 0x90 && velocity > 0) {
                noteCount++;
                
                // Calculate rotation delta based on note and velocity
                const noteName = noteNames[note % 12];
                const octave = Math.floor(note / 12) - 1;
                const noteDisplay = `${noteName}${octave}`;
                
                // Visual feedback
                showMIDIActivity();
                updateNoteVisual(note % 12);
                lastNoteSpan.textContent = noteDisplay;
                
                // Calculate rotation delta
                // Higher notes rotate more, velocity affects rotation speed
                const baseRotation = (note % 12) * 3; // 0-33 degrees base
                const velocityMultiplier = velocity / 127; // 0-1
                const rotationDelta = (baseRotation + 1) * velocityMultiplier; // 5-38 degrees
                
                // Apply rotation to current layer
                puzzleLayers[`layer${currentLayer}`].rotation += rotationDelta;
                
                // Apply rotation to the layer element
                const activeLayerElement = document.getElementById(`layer${currentLayer}`);
                if (activeLayerElement) {
                    activeLayerElement.style.transform = `translate(-50%, -50%) rotate(${puzzleLayers[`layer${currentLayer}`].rotation}deg)`;
                }
                
                // Update display
                updateRotationDisplay();
                
                // Check for solution
                checkSolution();
                
                console.log(`MIDI Note: ${noteDisplay}, Velocity: ${velocity}, Rotation: +${rotationDelta.toFixed(1)}°`);
            }
        }

        // Show MIDI activity indicator
        function showMIDIActivity() {
            midiIndicator.classList.add('active');
            setTimeout(() => {
                midiIndicator.classList.remove('active');
            }, 200);
        }

        // Update note visualization
        function updateNoteVisual(noteIndex) {
            // Reset all bars
            document.querySelectorAll('.note-bar').forEach(bar => {
                bar.classList.remove('active');
            });
            
            // Activate current note bar
            const activeBar = document.querySelector(`[data-note="${noteIndex}"]`);
            if (activeBar) {
                activeBar.classList.add('active');
                setTimeout(() => {
                    activeBar.classList.remove('active');
                }, 300);
            }
        }

        // Request MIDI access
        async function requestMIDIAccess() {
            if (!navigator.requestMIDIAccess) {
                midiStatus.textContent = 'MIDI not supported in this browser';
                return;
            }

            try {
                midiAccess = await navigator.requestMIDIAccess();
                midiSupported = true;
                
                // Set up MIDI input listeners
                for (let input of midiAccess.inputs.values()) {
                    input.onmidimessage = handleMIDIMessage;
                    console.log('MIDI input connected:', input.name);
                }
                
                // Listen for new MIDI connections
                midiAccess.onstatechange = (event) => {
                    console.log('MIDI state change:', event.port.name, event.port.state);
                    if (event.port.type === 'input' && event.port.state === 'connected') {
                        event.port.onmidimessage = handleMIDIMessage;
                    }
                };
                
                midiStatus.textContent = `MIDI active - Play notes to rotate layer ${currentLayer}`;
                hidePermissionPrompt();
                
            } catch (error) {
                console.error('MIDI access denied:', error);
                midiStatus.textContent = 'MIDI access denied';
            }
        }

        // Share function
        function sharePuzzle() {
            const shareData = {
                title: 'MIDI Azimuth Puzzle',
                text: `I solved the stakco MIDI puzzle with ${noteCount} notes!`,
                url: 'https://stakcos.com/azimuth-midi/'
            };

            if (navigator.share) {
                navigator.share(shareData)
                    .then(() => console.log('Successful share'))
                    .catch((error) => console.log('Error sharing:', error));
            } else {
                // Fallback for browsers that don't support Web Share API
                const textArea = document.createElement('textarea');
                textArea.value = 'https://stakcos.com/azimuth-midi/';
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('Link copied to clipboard: https://stakcos.com/azimuth-midi/');
            }
        }

        function checkSolution() {
            if (puzzleSolved) return;

            // Normalize all layer rotations for comparison
            const layer1Normalized = ((puzzleLayers.layer1.rotation % 360) + 360) % 360;
            const layer2Normalized = ((puzzleLayers.layer2.rotation % 360) + 360) % 360;
            const layer3Normalized = ((puzzleLayers.layer3.rotation % 360) + 360) % 360;

            // Check if all layers are aligned (within 2 degrees tolerance)
            const tolerance = 2;
            const isAligned = Math.abs(layer1Normalized - layer2Normalized) <= tolerance &&
                             Math.abs(layer2Normalized - layer3Normalized) <= tolerance &&
                             Math.abs(layer1Normalized - layer3Normalized) <= tolerance;

            if (isAligned) {
                // Vibrate if available
                if (navigator.vibrate) {
                    navigator.vibrate([200, 100, 300, 100, 200]);
                }
                
                puzzleSolved = true;
                console.log(`Puzzle solved with ${noteCount} notes!`);
                
                // Hide controls and status
                controlsDiv.classList.add('hidden');
                statusDiv.classList.add('hidden');
                
                // Show share button
                shareButton.classList.add('show');
                
                // Smoothly rotate all layers to zero
                rotateAllLayersToZero();
            }
        }

        // Smoothly rotate all layers to zero degrees
        function rotateAllLayersToZero() {
            Object.keys(puzzleLayers).forEach(layerKey => {
                const layerElement = document.getElementById(layerKey);
                if (layerElement) {
                    // Add transition for smooth animation to zero
                    layerElement.style.transition = 'transform 2s ease-out';
                    layerElement.style.transform = 'translate(-50%, -50%) rotate(0deg)';
                    
                    // Update internal rotation value
                    puzzleLayers[layerKey].rotation = 0;
                }
            });
        }

        // Update rotation value display
        function updateRotationDisplay() {
            const currentRotation = puzzleLayers[`layer${currentLayer}`].rotation;
            // Normalize only for display purposes
            let displayRotation = currentRotation % 360;
            if (displayRotation < 0) displayRotation += 360;
            rotationValueSpan.textContent = `${Math.round(displayRotation)}°`;
        }

        // Switch active layer
        function switchLayer(layerNumber) {
            if (puzzleSolved) return;

            // Remove active class from all layers and buttons
            document.querySelectorAll('.puzzle-layer').forEach(layer => {
                layer.classList.remove('active');
            });
            document.querySelectorAll('.layer-button').forEach(button => {
                button.classList.remove('active');
            });

            // Add active class to selected layer and button
            document.getElementById(`layer${layerNumber}`).classList.add('active');
            document.querySelector(`[data-layer="${layerNumber}"]`).classList.add('active');

            currentLayer = layerNumber;
            activeLayerSpan.textContent = layerNumber;

            // Update rotation display for the new layer
            updateRotationDisplay();
            
            // Update status message
            if (midiSupported) {
                midiStatus.textContent = `MIDI active - Play notes to rotate layer ${currentLayer}`;
            }

            console.log(`Switched to layer ${layerNumber}, rotation: ${Math.round(puzzleLayers[`layer${layerNumber}`].rotation)}°`);
        }

        // Hide permission prompt
        function hidePermissionPrompt() {
            permissionPrompt.classList.remove('show');
        }

        // Show permission prompt if needed
        function showPermissionPromptIfNeeded() {
            if (navigator.requestMIDIAccess) {
                permissionPrompt.classList.add('show');
            } else {
                midiStatus.textContent = 'MIDI not supported in this browser';
            }
        }

        // Initialize the app
        function initApp() {
            console.log('Initializing MIDI Compass Puzzle App...');

            // Load puzzle data
            loadPuzzleData();
            
            // Create note visualization
            createNoteVisual();

            // Add layer button event listeners
            document.querySelectorAll('.layer-button').forEach(button => {
                button.addEventListener('click', () => {
                    const layerNumber = parseInt(button.dataset.layer);
                    switchLayer(layerNumber);
                });
            });

            // Add keyboard shortcuts
            document.addEventListener('keydown', (event) => {
                if (puzzleSolved) return;
                
                switch (event.key) {
                    case '1':
                        switchLayer(1);
                        break;
                    case '2':
                        switchLayer(2);
                        break;
                    case '3':
                        switchLayer(3);
                        break;
                    case ' ': // Spacebar to request MIDI access
                        event.preventDefault();
                        if (!midiSupported) {
                            requestMIDIAccess();
                        }
                        break;
                }
            });

            // Show permission prompt if needed
            setTimeout(() => {
                showPermissionPromptIfNeeded();
            }, 1000);
        }

        // Start the app when page loads
        document.addEventListener('DOMContentLoaded', initApp);

        // Prevent zoom on mobile
        document.addEventListener('touchstart', function (e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>

</html>
