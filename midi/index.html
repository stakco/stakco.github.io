    <style>
        body {
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        #midi-info {
            max-width: 75%;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 15px 30px;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-soft);
            z-index: 800;
            display: flex;
            gap: 20px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
        }

        /* Mobile adjustment */
        @media (max-width: 600px) {
            #midi-info {
                top: 80px; /* override for mobile */
            }
        }

        #midi-info.hidden {
            display: none;
        }

        .midi-row {
            display: flex;
            align-items: center;
        }

        .midi-label {
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .midi-value {
            color: var(--primary-color);
            font-weight: 600;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
        }

        .midi-activity {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #333;
            border: 2px solid #666;
            transition: all 0.2s ease;
            display: inline-block;
            margin-left: 10px;
        }

        .midi-activity.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-glow);
        }

        .note-visual {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            z-index: 800;
        }

        .note-bar {
            width: 8px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            transition: all 0.1s ease;
        }

        .note-bar.active {
            background: var(--primary-gradient);
            box-shadow: var(--shadow-glow);
        }
    </style>
</head>

<body>
    <stakco-info-panel icon="fa-music">
        <p>Initializing MIDI... Connect keyboard to play</p>
    </stakco-info-panel>

    <stakco-branding 
        title="Stakco MIDI" 
        version="v2.0.0" 
        subtitle="Music Puzzle">
    </stakco-branding>

    <stakco-products-panel></stakco-products-panel>

    <div id="midi-info" class="hidden">
        <div class="midi-row">
            <span class="midi-label">Note:</span>
            <span class="midi-value" id="last-note">-</span>
            <span class="midi-activity" id="midi-indicator"></span>
        </div>
        <div class="midi-row">
            <span class="midi-label">Layer:</span>
            <span class="midi-value" id="active-layer">1</span>
        </div>
        <div class="midi-row">
            <span class="midi-label">Rotation:</span>
            <span class="midi-value" id="rotation-value">0°</span>
        </div>
    </div>

    <stakco-puzzle-container
        layers="3"
        user-id="109949450257686494443"
        puzzle-id="A2A3_3"
        tolerance="2">
    </stakco-puzzle-container>

    <div class="note-visual" id="note-visual"></div>
    
    <stakco-layer-controls layers="3"></stakco-layer-controls>

    <stakco-share-button label="Share Success!"></stakco-share-button>

    <stakco-permission-prompt 
        title="Enable MIDI Access"
        message="This app needs access to your MIDI devices to control puzzle layers with musical input. Connect a MIDI keyboard, then enable MIDI. When you solve the puzzle, your keyboard will play celebration music!"
        primary-label="Enable MIDI"
        secondary-label="Skip">
    </stakco-permission-prompt>

    <stakco-share-window 
        title="Stakco MIDI"
        share-url="https://stakcos.com/midi/">
        <div slot="text">Solved with music!</div>
    </stakco-share-window>

    <script type="module">
        import { StakcoUtils } from 'https://stakcos.com/assets/1.0.0/components/stakco-utils.js';
        import { StakcoConfig } from 'https://stakcos.com/assets/1.0.0/components/stakco-config.js';

        const CONFIG = StakcoConfig.getConfig('midi');

        // MIDI state
        let midiAccess = null;
        let midiOutput = null;
        let noteCount = 0;
        let isPlayingCelebration = false;
        let puzzleSolved = false;

        const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        const celebrationMelody = [
            { note: 67, duration: 300 }, { note: 69, duration: 300 }, { note: 71, duration: 300 },
            { note: 74, duration: 300 }, { note: 76, duration: 300 }, { note: 78, duration: 300 },
            { note: 79, duration: 600 }, { note: 0, duration: 200 }, { note: 83, duration: 300 },
            { note: 81, duration: 300 }, { note: 79, duration: 300 }, { note: 76, duration: 300 },
            { note: 74, duration: 300 }, { note: 72, duration: 300 }, { note: 67, duration: 800 }
        ];

        const victoryFanfare = [
            { note: 60, duration: 300 }, { note: 64, duration: 300 }, { note: 67, duration: 300 },
            { note: 72, duration: 300 }, { note: 0, duration: 100 }, { note: 65, duration: 300 },
            { note: 69, duration: 300 }, { note: 72, duration: 300 }, { note: 77, duration: 300 },
            { note: 0, duration: 100 }, { note: 67, duration: 300 }, { note: 71, duration: 300 },
            { note: 74, duration: 300 }, { note: 79, duration: 300 }, { note: 0, duration: 200 },
            { note: 60, duration: 800 }, { note: 64, duration: 800 }, { note: 67, duration: 800 },
            { note: 72, duration: 800 }, { note: 76, duration: 800 }
        ];

        const puzzleContainer = document.querySelector('stakco-puzzle-container');
        const layerControls = document.querySelector('stakco-layer-controls');
        const infoPanel = document.querySelector('stakco-info-panel');
        const shareWindow = document.querySelector('stakco-share-window');
        const permissionPrompt = document.querySelector('stakco-permission-prompt');
        const branding = document.querySelector('stakco-branding');
        const shareButton = document.querySelector('stakco-share-button');
        
        const midiInfo = document.getElementById('midi-info');
        const lastNoteSpan = document.getElementById('last-note');
        const activeLayerSpan = document.getElementById('active-layer');
        const rotationValueSpan = document.getElementById('rotation-value');
        const midiIndicator = document.getElementById('midi-indicator');
        const noteVisual = document.getElementById('note-visual');

        async function init() {
            console.log('Initializing Stakco MIDI...');

            StakcoUtils.preventZoom();
            createNoteVisual();
            setupEventListeners();

            // Wait for puzzle container to be ready
            await new Promise(resolve => {
                if (puzzleContainer.shadowRoot) {
                    resolve();
                } else {
                    puzzleContainer.addEventListener('puzzle-ready', resolve, { once: true });
                }
            });

            setTimeout(checkPermissionNeeded, 1000);
            console.log('App initialized');
        }

        function setupEventListeners() {
            puzzleContainer.addEventListener('puzzle-ready', () => {
                console.log('Puzzle ready');
            });

            puzzleContainer.addEventListener('puzzle-solved', () => {
                puzzleSolved = true;
                handlePuzzleSolved();
            });

            layerControls.addEventListener('layerchange', (e) => {
                puzzleContainer.switchLayer(e.detail.layer);
                activeLayerSpan.textContent = e.detail.layer;
                updateRotationDisplay();
            });

            permissionPrompt.addEventListener('primary-action', async () => {
                await requestMIDIAccess();
            });

            permissionPrompt.addEventListener('secondary-action', () => {
                initializeMIDI();
            });

            shareButton.addEventListener('share-clicked', handleShare);
        }

        function createNoteVisual() {
            noteVisual.innerHTML = '';
            for (let i = 0; i < 12; i++) {
                const bar = document.createElement('div');
                bar.className = 'note-bar';
                bar.dataset.note = i;
                noteVisual.appendChild(bar);
            }
        }

        async function requestMIDIAccess() {
            if (!navigator.requestMIDIAccess) {
                infoPanel.setContent('<p>MIDI not supported in this browser</p>');
                return;
            }

            try {
                midiAccess = await navigator.requestMIDIAccess({ sysex: false });
                
                for (let input of midiAccess.inputs.values()) {
                    input.onmidimessage = handleMIDIMessage;
                    console.log('MIDI input connected:', input.name);
                }
                
                for (let output of midiAccess.outputs.values()) {
                    if (!midiOutput) {
                        midiOutput = output;
                        console.log('MIDI output connected:', output.name);
                        break;
                    }
                }
                
                midiAccess.onstatechange = (event) => {
                    if (event.port.type === 'input' && event.port.state === 'connected') {
                        event.port.onmidimessage = handleMIDIMessage;
                        console.log('New MIDI input connected');
                    }
                    if (event.port.type === 'output' && event.port.state === 'connected' && !midiOutput) {
                        midiOutput = event.port;
                        console.log('New MIDI output connected');
                    }
                };
                
                initializeMIDI();
                
            } catch (error) {
                console.error('MIDI access denied:', error);
                infoPanel.setContent('<p>MIDI access denied</p>');
            }
        }

        function initializeMIDI() {
            const outputStatus = midiOutput ? ' (Output: ✓)' : ' (Output: ✗)';
            infoPanel.setContent(`<p>MIDI active - Play notes to rotate layers${outputStatus}</p>`);
            midiInfo.classList.remove('hidden');
            branding.hide();
        }

        function handleMIDIMessage(message) {
            if (puzzleSolved || isPlayingCelebration) return;

            const [status, note, velocity] = message.data;
            
            if ((status & 0xF0) === 0x90 && velocity > 0) {
                noteCount++;
                
                const noteName = noteNames[note % 12];
                const octave = Math.floor(note / 12) - 1;
                
                showMIDIActivity();
                updateNoteVisual(note % 12);
                lastNoteSpan.textContent = `${noteName}${octave}`;
                
                // Calculate rotation delta
                const baseRotation = (note % 12) * 3;
                const velocityMultiplier = velocity / 127;
                const rotationDelta = (baseRotation + 1) * velocityMultiplier;
                
                // Use the puzzle container's rotateCurrentLayer method
                puzzleContainer.rotateCurrentLayer(rotationDelta);
                
                console.log(`MIDI: ${noteName}${octave}, vel:${velocity}, rot:+${rotationDelta.toFixed(1)}°`);
                
                updateRotationDisplay();
                
                // Use the puzzle container's checkAlignment method
                puzzleContainer.checkAlignment();
            }
        }

        function showMIDIActivity() {
            midiIndicator.classList.add('active');
            setTimeout(() => midiIndicator.classList.remove('active'), 200);
        }

        function updateNoteVisual(noteIndex) {
            document.querySelectorAll('.note-bar').forEach(bar => bar.classList.remove('active'));
            const activeBar = document.querySelector(`[data-note="${noteIndex}"]`);
            if (activeBar) {
                activeBar.classList.add('active');
                setTimeout(() => activeBar.classList.remove('active'), 300);
            }
        }

        function updateRotationDisplay() {
            const rotation = puzzleContainer.getCurrentRotation();
            let displayRotation = rotation % 360;
            if (displayRotation < 0) displayRotation += 360;
            rotationValueSpan.textContent = `${Math.round(displayRotation)}°`;
        }

        function handlePuzzleSolved() {
            console.log(`Puzzle solved with ${noteCount} notes!`);

            StakcoUtils.vibrate([200, 100, 300, 100, 200]);

            if (midiOutput) {
                playCelebrationMelody();
            } else {
                infoPanel.setContent(`<p>Puzzle solved with ${noteCount} notes!</p>`);
            }

            setTimeout(() => {
                layerControls.hide();
                midiInfo.classList.add('hidden');
                shareButton.show();
            }, 2000);

            // Animate all layers to zero
            setTimeout(() => {
                puzzleContainer.animateToSolution(2000);
            }, 500);
        }

        async function playCelebrationMelody() {
            if (!midiOutput || isPlayingCelebration) return;

            isPlayingCelebration = true;
            infoPanel.setContent('<p>Playing celebration music!</p>');

            for (let { note, duration } of celebrationMelody) {
                if (note > 0) sendMIDINote(note, 90, duration * 0.8);
                await new Promise(resolve => setTimeout(resolve, duration));
            }

            await new Promise(resolve => setTimeout(resolve, 500));
            
            for (let { note, duration } of victoryFanfare) {
                if (note > 0) sendMIDINote(note, 110, duration * 0.9);
                await new Promise(resolve => setTimeout(resolve, duration));
            }

            isPlayingCelebration = false;
            infoPanel.setContent(`<p>Puzzle solved with ${noteCount} notes!</p>`);
        }

        function sendMIDINote(note, velocity = 100, duration = 500) {
            if (!midiOutput) return;

            try {
                midiOutput.send([0x90, note, velocity]);
                setTimeout(() => midiOutput.send([0x80, note, 0]), duration);
                
                showMIDIActivity();
                updateNoteVisual(note % 12);
                
                const noteName = noteNames[note % 12];
                const octave = Math.floor(note / 12) - 1;
                lastNoteSpan.textContent = `${noteName}${octave}`;
            } catch (error) {
                console.error('Error sending MIDI note:', error);
            }
        }

        async function handleShare() {
            const layerImages = puzzleContainer.getLayerImages();
            const message = `Solved with ${noteCount} notes!`;
            shareWindow.setAttribute('filename', `stakco-midi-${noteCount}notes.png`);
            await shareWindow.open(layerImages, message, true);
        }

        async function checkPermissionNeeded() {
            if (navigator.requestMIDIAccess) {
                permissionPrompt.show();
            } else {
                infoPanel.setContent('<p>MIDI not supported in this browser</p>');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
