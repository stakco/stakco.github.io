<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Compass-driven Stakco puzzles with device orientation controls.">
    <title>Stakco Azimuth</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://stakcos.com/assets/1.0.0/theme.css">
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    
    <!-- Import Stakco Components -->
    <script type="module" src="https://stakcos.com/assets/1.0.0/components/stakco-countdown.js"></script>
    <script type="module" src="https://stakcos.com/assets/1.0.0/components/stakco-compass-info.js"></script>
    <script type="module" src="https://stakcos.com/assets/1.0.0/components/stakco-layer-controls.js"></script>
    <script type="module" src="https://stakcos.com/assets/1.0.0/components/stakco-info-panel.js"></script>
    <script type="module" src="https://stakcos.com/assets/1.0.0/components/stakco-share-window.js"></script>
    <script type="module" src="https://stakcos.com/assets/1.0.0/components/stakco-orientation-overlay.js"></script>
    <script type="module" src="https://stakcos.com/assets/1.0.0/components/stakco-permission-prompt.js"></script>
    <script type="module" src="https://stakcos.com/assets/1.0.0/components/stakco-products-panel.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--text-primary);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        button {
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        #container {
            position: relative;
            width: 90vmin;
            height: 90vmin;
            max-width: calc(100vw - 20px);
            max-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .puzzle-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: none;
            transition: transform 0s;
        }

        .puzzle-layer.solving {
            transition: transform 4s ease-out;
        }

        .puzzle-layer.active {
            opacity: 1;
        }

        .layer-label {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--glass-bg);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            box-shadow: var(--shadow-soft);
            pointer-events: none;
            z-index: 50000;
        }

        .puzzle-layer.active .layer-label {
            background: var(--primary-gradient);
            border-color: var(--primary-color);
            color: white;
            box-shadow: var(--shadow-glow);
            animation: labelPulse 2s ease-in-out infinite;
        }

        @keyframes labelPulse {
            0%, 100% {
                background: var(--glass-bg);
                color: var(--text-secondary);
                box-shadow: var(--shadow-soft);
            }
            50% {
                background: var(--primary-gradient);
                color: white;
                box-shadow: var(--shadow-glow);
            }
        }

        #branding {
            position: absolute;
            top: 18px;
            font-size: 14px;
            text-align: center;
            font-family: 'Inter', sans-serif;
            color: var(--primary-color);
            text-shadow: var(--shadow-glow);
            letter-spacing: 1px;
            font-weight: 500;
        }

        #branding.hidden {
            display: none;
        }

        #share-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            box-shadow: var(--shadow-glow);
            transition: all 0.3s ease;
            z-index: 1000;
            font-family: 'Inter', sans-serif;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        #share-button.show {
            display: block;
        }

        #share-button:hover {
            box-shadow: 0 10px 25px rgba(249, 167, 68, 0.4);
        }
    </style>
</head>

<body>
    <!-- Components -->
    <stakco-orientation-overlay></stakco-orientation-overlay>
    
    <stakco-countdown></stakco-countdown>
    
    <stakco-compass-info></stakco-compass-info>
    
    <stakco-info-panel icon="fa-compass">
        <p>Initializing compass... Rotate device to control selected layer</p>
    </stakco-info-panel>

    <div id="branding">
        <p style="display: inline; margin-left: 2px; vertical-align: middle;">
            Stakco Azimuth <span id="product-version">v2.0.0</span>
        </p>
        <p style="margin-top: 2px;">Compass Puzzle</p>
    </div>

    <stakco-products-panel></stakco-products-panel>

    <div id="container">
        <div id="layer1" class="puzzle-layer active">
            <div class="layer-label">1</div>
        </div>
        <div id="layer2" class="puzzle-layer">
            <div class="layer-label">2</div>
        </div>
        <div id="layer3" class="puzzle-layer">
            <div class="layer-label">3</div>
        </div>
    </div>
    
    <stakco-layer-controls layers="3"></stakco-layer-controls>

    <button id="share-button">Share Success!</button>

    <stakco-permission-prompt 
        title="Enable Device Orientation"
        message="This app needs access to your device's compass to rotate the puzzle layers using compass direction."
        primary-label="Enable Compass"
        secondary-label="Skip">
    </stakco-permission-prompt>

    <stakco-share-window 
        title="Stakco Azimuth"
        share-url="https://stakcos.com/azimuth/">
        <div slot="text">Solved with compass navigation!</div>
    </stakco-share-window>

    <script type="module">
        import { StakcoUtils } from 'https://stakcos.com/assets/1.0.0/components/stakco-utils.js';

        // Configuration
        const CONFIG = {
            ROTATION_TOLERANCE: 2,
            SOLVE_ANIMATION_DURATION: 4000,
            VIBRATION_PATTERN: [200, 100, 300, 100, 200],
            USER_ID: '109949450257686494443',
            PUZZLE_ID: 'A2A3_3'
        };

        // App state
        let currentLayer = 1;
        let lastHeading = null;
        let puzzleSolved = false;
        let firstInteraction = false;

        // Puzzle layer data
        const puzzleLayers = {
            layer1: { rotation: StakcoUtils.randomRotation(), url: null },
            layer2: { rotation: StakcoUtils.randomRotation(), url: null },
            layer3: { rotation: StakcoUtils.randomRotation(), url: null }
        };

        // Get component references
        const countdown = document.querySelector('stakco-countdown');
        const compassInfo = document.querySelector('stakco-compass-info');
        const layerControls = document.querySelector('stakco-layer-controls');
        const infoPanel = document.querySelector('stakco-info-panel');
        const shareWindow = document.querySelector('stakco-share-window');
        const orientationOverlay = document.querySelector('stakco-orientation-overlay');
        const permissionPrompt = document.querySelector('stakco-permission-prompt');
        const shareButton = document.getElementById('share-button');
        const branding = document.getElementById('branding');

        // Initialize app
        async function init() {
            console.log('Initializing Stakco Azimuth...');

            // Prevent zoom on mobile
            StakcoUtils.preventZoom();

            // Load puzzle images
            await loadPuzzleData();

            // Apply initial rotations
            applyInitialRotations();

            // Setup event listeners
            setupEventListeners();

            // Show permission prompt if needed (delayed)
            setTimeout(checkPermissionNeeded, 1000);

            console.log('App initialized');
        }

        async function loadPuzzleData() {
            const images = StakcoUtils.loadPuzzleImages(CONFIG.USER_ID, CONFIG.PUZZLE_ID);
            
            puzzleLayers.layer1.url = images.layer1;
            puzzleLayers.layer2.url = images.layer2;
            puzzleLayers.layer3.url = images.layer3;

            document.getElementById('layer1').style.backgroundImage = `url('${images.layer1}')`;
            document.getElementById('layer2').style.backgroundImage = `url('${images.layer2}')`;
            document.getElementById('layer3').style.backgroundImage = `url('${images.layer3}')`;

            console.log('Puzzle images loaded');
        }

        function applyInitialRotations() {
            Object.keys(puzzleLayers).forEach(layerKey => {
                const element = document.getElementById(layerKey);
                const rotation = puzzleLayers[layerKey].rotation;
                element.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
            });

            updateRotationDisplay();
            console.log('Initial rotations applied');
        }

        function setupEventListeners() {
            // Layer controls
            layerControls.addEventListener('layerchange', (e) => {
                switchLayer(e.detail.layer);
            });

            // Orientation overlay
            orientationOverlay.addEventListener('blocked', () => {
                if (countdown && countdown.active) {
                    countdown.pause();
                }
            });

            orientationOverlay.addEventListener('unblocked', () => {
                if (countdown && countdown.paused) {
                    countdown.resume();
                }
            });

            // Permission prompt
            permissionPrompt.addEventListener('primary-action', async () => {
                const granted = await StakcoUtils.requestOrientationPermission();
                if (granted) {
                    initializeOrientation();
                }
            });

            permissionPrompt.addEventListener('secondary-action', () => {
                initializeOrientation();
            });

            // Share button
            shareButton.addEventListener('click', handleShare);

            // Device orientation
            if (StakcoUtils.isOrientationSupported()) {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function switchLayer(layerNumber) {
            if (puzzleSolved) return;

            // Update visual state
            document.querySelectorAll('.puzzle-layer').forEach(layer => {
                layer.classList.remove('active');
            });
            document.getElementById(`layer${layerNumber}`).classList.add('active');

            currentLayer = layerNumber;
            updateRotationDisplay();

            console.log(`Switched to layer ${layerNumber}`);
        }

        function handleOrientation(event) {
            if (puzzleSolved || orientationOverlay.isBlocked()) return;

            // Start countdown on first interaction
            if (!firstInteraction) {
                firstInteraction = true;
                countdown.start();
                compassInfo.show();
                branding.classList.add('hidden');
                infoPanel.setContent('<p>Compass active - Rotate device to align all layers</p>');
            }

            let heading = event.alpha;
            if (heading === null) return;

            // Calculate delta
            if (lastHeading !== null) {
                let deltaHeading = heading - lastHeading;
                
                // Handle wrapping
                if (deltaHeading > 180) deltaHeading -= 360;
                if (deltaHeading < -180) deltaHeading += 360;

                // Apply to current layer
                puzzleLayers[`layer${currentLayer}`].rotation += deltaHeading;

                // Update display
                const layerElement = document.getElementById(`layer${currentLayer}`);
                layerElement.style.transform = `translate(-50%, -50%) rotate(${puzzleLayers[`layer${currentLayer}`].rotation}deg)`;

                updateRotationDisplay();
                checkSolution();
            }

            lastHeading = heading;
            compassInfo.updateHeading(heading);
        }

        function updateRotationDisplay() {
            const rotation = puzzleLayers[`layer${currentLayer}`].rotation;
            compassInfo.updateRotation(rotation);
        }

        function checkSolution() {
            if (puzzleSolved) return;

            const rotations = [
                puzzleLayers.layer1.rotation,
                puzzleLayers.layer2.rotation,
                puzzleLayers.layer3.rotation
            ];

            if (StakcoUtils.rotationsAligned(rotations, CONFIG.ROTATION_TOLERANCE)) {
                solvePuzzle();
            }
        }

        function solvePuzzle() {
            puzzleSolved = true;
            console.log('Puzzle solved!');

            // Stop countdown
            countdown.stop();

            // Vibrate
            StakcoUtils.vibrate(CONFIG.VIBRATION_PATTERN);

            // Hide UI elements
            layerControls.hide();
            infoPanel.collapse();
            compassInfo.hide();

            // Show share button
            shareButton.classList.add('show');

            // Animate to zero
            setTimeout(animateToZero, 500);
        }

        function animateToZero() {
            Object.keys(puzzleLayers).forEach(layerKey => {
                const element = document.getElementById(layerKey);
                element.classList.add('solving');
                element.style.transform = 'translate(-50%, -50%) rotate(0deg)';
                puzzleLayers[layerKey].rotation = 0;
            });
        }

        async function handleShare() {
            const finalTime = countdown.getTime();
            const layerImages = [
                puzzleLayers.layer1.url,
                puzzleLayers.layer2.url,
                puzzleLayers.layer3.url
            ];
            
            const message = `Solved in ${finalTime} with compass navigation!`;
            shareWindow.setAttribute('filename', `stakco-azimuth-${finalTime.replace(':', '')}.png`);
            
            await shareWindow.open(layerImages, message, true);
        }

        async function checkPermissionNeeded() {
            if (typeof DeviceOrientationEvent !== 'undefined' && 
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                permissionPrompt.show();
            } else {
                initializeOrientation();
            }
        }

        function initializeOrientation() {
            if (StakcoUtils.isOrientationSupported()) {
                infoPanel.setContent('<p>Compass ready - Rotate device to control selected layer</p>');
                console.log('Orientation initialized');
            } else {
                infoPanel.setContent('<p>Device orientation not supported on this device</p>');
                console.log('Orientation not supported');
            }
        }

        // Start app
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
