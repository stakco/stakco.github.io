<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singapore MRT Line Tracker</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #container {
            position: relative;
            width: 300px;
            height: 300px;
        }

        .mrt-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 1s ease-in-out;
        }

        #green-line {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjUwIiBoZWlnaHQ9IjI1MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8Y2lyY2xlIGN4PSIxMjUiIGN5PSIxMjUiIHI9IjEwMCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMDA4MDAwIiBzdHJva2Utd2lkdGg9IjEwIiBvcGFjaXR5PSIwLjgiLz4KICA8dGV4dCB4PSIxMjUiIHk9IjEzMCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iIzAwODAwMCIgZm9udC1zaXplPSIxNCIgZm9udC13ZWlnaHQ9ImJvbGQiPkdyZWVuIExpbmU8L3RleHQ+Cjwvc3ZnPg==');
            z-index: 3;
        }

        #yellow-line {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjUwIiBoZWlnaHQ9IjI1MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8Y2lyY2xlIGN4PSIxMjUiIGN5PSIxMjUiIHI9IjgwIiBmaWxsPSJub25lIiBzdHJva2U9IiNGRkQ3MDAiIHN0cm9rZS13aWR0aD0iMTAiIG9wYWNpdHk9IjAuOCIvPgogIDx0ZXh0IHg9IjEyNSIgeT0iMTMwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjRkZENzAwIiBmb250LXNpemU9IjE0IiBmb250LXdlaWdodD0iYm9sZCI+WWVsbG93IExpbmU8L3RleHQ+Cjwvc3ZnPg==');
            z-index: 2;
        }

        #blue-line {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjUwIiBoZWlnaHQ9IjI1MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8Y2lyY2xlIGN4PSIxMjUiIGN5PSIxMjUiIHI9IjYwIiBmaWxsPSJub25lIiBzdHJva2U9IiMwMDZBRDAiIHN0cm9rZS13aWR0aD0iMTAiIG9wYWNpdHk9IjAuOCIvPgogIDx0ZXh0IHg9IjEyNSIgeT0iMTMwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjMDA2QUQwIiBmb250LXNpemU9IjE0IiBmb250LXdlaWdodD0iYm9sZCI+Qmx1ZSBMaW5lPC90ZXh0Pgo8L3N2Zz4=');
            z-index: 1;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
        }

        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
        }

        .active {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>Singapore MRT Line Tracker</h3>
        <p>Current Location: <span id="coordinates">Getting GPS...</span></p>
        <p>Nearest Station: <span id="nearest-station">Detecting...</span></p>
        <p>Active Line: <span id="active-line">None</span></p>
    </div>

    <div id="container">
        <div id="green-line" class="mrt-layer"></div>
        <div id="yellow-line" class="mrt-layer"></div>
        <div id="blue-line" class="mrt-layer"></div>
    </div>

    <div id="status">
        <p id="gps-status">Initializing GPS...</p>
    </div>

    <script>
        // Singapore MRT Station Coordinates (sample stations for each line)
        const mrtStations = {
            green: [
                { name: "Tanjong Pagar", lat: 1.276568, lng: 103.845436 },
                { name: "Raffles Place", lat: 1.283806, lng: 103.851533 },
                { name: "City Hall", lat: 1.293239, lng: 103.852219 },
                { name: "Dhoby Ghaut", lat: 1.299156, lng: 103.845736 },
                { name: "Somerset", lat: 1.300514, lng: 103.838975 },
                { name: "Orchard", lat: 1.304314, lng: 103.831939 },
                { name: "Newton", lat: 1.313083, lng: 103.838358 },
                { name: "Novena", lat: 1.320394, lng: 103.843681 },
                { name: "Toa Payoh", lat: 1.332706, lng: 103.847325 },
                { name: "Braddell", lat: 1.340333, lng: 103.847078 },
                { name: "Bishan", lat: 1.351236, lng: 103.848456 },
                { name: "Ang Mo Kio", lat: 1.369847, lng: 103.849444 },
                { name: "Yio Chu Kang", lat: 1.382067, lng: 103.844817 },
                { name: "Woodlands", lat: 1.437083, lng: 103.786500 }
            ],
            yellow: [
                { name: "HarbourFront", lat: 1.265297, lng: 103.822203 },
                { name: "Chinatown", lat: 1.284017, lng: 103.843889 },
                { name: "Clarke Quay", lat: 1.288611, lng: 103.846694 },
                { name: "Dhoby Ghaut", lat: 1.299156, lng: 103.845736 },
                { name: "Little India", lat: 1.306967, lng: 103.849283 },
                { name: "Farrer Park", lat: 1.312236, lng: 103.853544 },
                { name: "Boon Keng", lat: 1.319528, lng: 103.861547 },
                { name: "Potong Pasir", lat: 1.331019, lng: 103.869228 },
                { name: "Woodleigh", lat: 1.339117, lng: 103.870394 },
                { name: "Serangoon", lat: 1.349872, lng: 103.873181 },
                { name: "Kovan", lat: 1.360025, lng: 103.885119 },
                { name: "Hougang", lat: 1.371236, lng: 103.892336 },
                { name: "Punggol", lat: 1.405064, lng: 103.902331 }
            ],
            blue: [
                { name: "Bugis", lat: 1.300192, lng: 103.856253 },
                { name: "City Hall", lat: 1.293239, lng: 103.852219 },
                { name: "Raffles Place", lat: 1.283806, lng: 103.851533 },
                { name: "Marina Bay", lat: 1.276056, lng: 103.854675 },
                { name: "Bayfront", lat: 1.282375, lng: 103.859694 },
                { name: "Promenade", lat: 1.292861, lng: 103.861178 },
                { name: "Esplanade", lat: 1.293489, lng: 103.855436 },
                { name: "Bras Basah", lat: 1.297031, lng: 103.850964 },
                { name: "Bencoolen", lat: 1.301019, lng: 103.850356 },
                { name: "Jalan Besar", lat: 1.305283, lng: 103.855411 },
                { name: "Lavender", lat: 1.307297, lng: 103.862981 },
                { name: "Kallang", lat: 1.311469, lng: 103.871486 }
            ]
        };

        // App state
        let currentLocation = null;
        let activeLines = { green: false, yellow: false, blue: false };
        let rotationAngles = { green: 0, yellow: 0, blue: 0 };
        
        // Proximity threshold in meters
        const PROXIMITY_THRESHOLD = 500;

        // DOM elements
        const coordinatesSpan = document.getElementById('coordinates');
        const nearestStationSpan = document.getElementById('nearest-station');
        const activeLineSpan = document.getElementById('active-line');
        const gpsStatus = document.getElementById('gps-status');
        const greenLine = document.getElementById('green-line');
        const yellowLine = document.getElementById('yellow-line');
        const blueLine = document.getElementById('blue-line');

        // Calculate distance between two coordinates using Haversine formula
        function calculateDistance(lat1, lng1, lat2, lng2) {
            const R = 6371000; // Earth's radius in meters
            const dLat = toRadians(lat2 - lat1);
            const dLng = toRadians(lng2 - lng1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                     Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) *
                     Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function toRadians(degrees) {
            return degrees * (Math.PI / 180);
        }

        // Find nearest stations for each line
        function findNearestStations(lat, lng) {
            const nearestStations = {};
            
            Object.keys(mrtStations).forEach(line => {
                let minDistance = Infinity;
                let nearestStation = null;
                
                mrtStations[line].forEach(station => {
                    const distance = calculateDistance(lat, lng, station.lat, station.lng);
                    if (distance < minDistance) {
                        minDistance = distance;
                        nearestStation = { ...station, distance };
                    }
                });
                
                nearestStations[line] = nearestStation;
            });
            
            return nearestStations;
        }

        // Update layer rotations based on proximity
        function updateLayerRotations(nearestStations) {
            const activeLinesArray = [];
            
            Object.keys(nearestStations).forEach(line => {
                const station = nearestStations[line];
                const isInProximity = station.distance <= PROXIMITY_THRESHOLD;
                
                if (isInProximity !== activeLines[line]) {
                    activeLines[line] = isInProximity;
                    
                    if (isInProximity) {
                        // Rotate by 45 degrees when entering proximity
                        rotationAngles[line] += 45;
                        activeLinesArray.push(line);
                        
                        // Add visual feedback
                        const layerElement = document.getElementById(`${line}-line`);
                        layerElement.classList.add('active');
                    } else {
                        // Remove visual feedback
                        const layerElement = document.getElementById(`${line}-line`);
                        layerElement.classList.remove('active');
                    }
                    
                    // Apply rotation
                    const layerElement = document.getElementById(`${line}-line`);
                    layerElement.style.transform = `translate(-50%, -50%) rotate(${rotationAngles[line]}deg)`;
                }
                
                if (isInProximity) {
                    activeLinesArray.push(line);
                }
            });
            
            return activeLinesArray;
        }

        // Update UI with current information
        function updateUI(lat, lng, nearestStations, activeLines) {
            coordinatesSpan.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            
            // Find overall nearest station
            let overallNearest = null;
            let minDistance = Infinity;
            
            Object.values(nearestStations).forEach(station => {
                if (station.distance < minDistance) {
                    minDistance = station.distance;
                    overallNearest = station;
                }
            });
            
            if (overallNearest) {
                nearestStationSpan.textContent = `${overallNearest.name} (${Math.round(overallNearest.distance)}m)`;
            }
            
            activeLineSpan.textContent = activeLines.length > 0 ? activeLines.join(', ') : 'None';
        }

        // Handle geolocation success
        function onLocationSuccess(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            
            currentLocation = { lat, lng };
            
            const nearestStations = findNearestStations(lat, lng);
            const activeLinesArray = updateLayerRotations(nearestStations);
            updateUI(lat, lng, nearestStations, activeLinesArray);
            
            gpsStatus.textContent = `GPS Active - Accuracy: ${Math.round(position.coords.accuracy)}m`;
        }

        // Handle geolocation error
        function onLocationError(error) {
            let errorMessage = 'GPS Error: ';
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    errorMessage += 'Location access denied by user.';
                    break;
                case error.POSITION_UNAVAILABLE:
                    errorMessage += 'Location information unavailable.';
                    break;
                case error.TIMEOUT:
                    errorMessage += 'Location request timed out.';
                    break;
                default:
                    errorMessage += 'Unknown error occurred.';
                    break;
            }
            gpsStatus.textContent = errorMessage;
            coordinatesSpan.textContent = 'GPS unavailable';
        }

        // Initialize the app
        function initApp() {
            if ('geolocation' in navigator) {
                gpsStatus.textContent = 'Requesting location permission...';
                
                // Options for geolocation
                const options = {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                };
                
                // Start watching position
                const watchId = navigator.geolocation.watchPosition(
                    onLocationSuccess,
                    onLocationError,
                    options
                );
                
                // Store watch ID for cleanup if needed
                window.geoWatchId = watchId;
                
            } else {
                gpsStatus.textContent = 'Geolocation not supported by this browser.';
            }
        }

        // Start the app when page loads
        document.addEventListener('DOMContentLoaded', initApp);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (window.geoWatchId) {
                navigator.geolocation.clearWatch(window.geoWatchId);
            }
        });

        // Add touch events for mobile interaction
        document.addEventListener('touchstart', function(e) {
            e.preventDefault();
        }, { passive: false });

        // Prevent zoom on double tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
