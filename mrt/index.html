<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singapore MRT Line Tracker</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #container {
            position: relative;
            width: 90vmin;
            height: 90vmin;
            max-width: calc(100vw - 20px);
            max-height: calc(100vh - 240px); /* Account for info bar (80px) + station tracker (160px) */
        }

        .mrt-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 1s ease-in-out;
        }

        #green-line {
            background-image: url('https://storage.googleapis.com/stakco-images/109949450257686494443/latest/A2A3_3/A2A3_0.png');
            z-index: 3;
        }

        #yellow-line {
            background-image: url('https://storage.googleapis.com/stakco-images/109949450257686494443/latest/A2A3_3/A2A3_1.png');
            z-index: 2;
        }

        #blue-line {
            background-image: url('https://storage.googleapis.com/stakco-images/109949450257686494443/latest/A2A3_3/A2A3_2.png');
            z-index: 1;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
        }

        #status {
            position: absolute;
            bottom: 180px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
        }

        .active {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        #station-tracker {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 160px;
            background: rgba(0, 0, 0, 0.95);
            color: white;
            overflow-x: auto;
            overflow-y: hidden;
            border-top: 2px solid #333;
        }

        .line-display {
            display: none;
            padding: 10px;
            height: 140px;
        }

        .line-display.active-display {
            display: block;
        }

        .line-header {
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 14px;
        }

        .stations-container {
            position: relative;
            height: 100px;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .stations-line {
            position: relative;
            height: 4px;
            background: #333;
            margin: 50px 20px;
            border-radius: 2px;
            min-width: calc(100vw - 40px);
        }

        .station-point {
            position: absolute;
            top: -8px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 3px solid #666;
            background: #222;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .station-point.current {
            background: #FFD700;
            border-color: #FFA500;
            box-shadow: 0 0 15px #FFD700;
            animation: pulse 2s infinite;
        }

        .station-point.proximity {
            background: #FF6B6B;
            border-color: #FF4757;
            box-shadow: 0 0 10px #FF6B6B;
        }

        .station-point.passed {
            background: #4ECDC4;
            border-color: #26de81;
        }

        .station-name {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) rotate(-45deg);
            transform-origin: center;
            font-size: 10px;
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.8);
            padding: 2px 4px;
            border-radius: 3px;
            border: 1px solid #444;
            min-width: 60px;
            text-align: center;
        }

        .station-distance {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            background: rgba(0, 0, 0, 0.9);
            padding: 1px 3px;
            border-radius: 2px;
            border: 1px solid #666;
            display: none;
        }

        .station-point.current .station-distance,
        .station-point.proximity .station-distance {
            display: block;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px #FFD700; }
            50% { box-shadow: 0 0 25px #FFD700, 0 0 35px #FFD700; }
            100% { box-shadow: 0 0 15px #FFD700; }
        }

        .line-selector {
            position: absolute;
            top: 5px;
            right: 5px;
            display: flex;
            gap: 5px;
        }

        .line-button {
            width: 30px;
            height: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
            color: white;
            transition: all 0.3s ease;
        }

        .line-button.green { background: #008000; }
        .line-button.yellow { background: #FFD700; color: black; }
        .line-button.blue { background: #006AD0; }

        .line-button.active-button {
            box-shadow: 0 0 10px currentColor;
            transform: scale(1.1);
        }

        .progress-indicator {
            position: absolute;
            top: -2px;
            height: 8px;
            background: linear-gradient(90deg, transparent 0%, currentColor 50%, transparent 100%);
            border-radius: 4px;
            transition: all 0.5s ease;
            opacity: 0.6;
        }

        /* LED Text Styling */
.led-text {
    display: block;
    margin: 5px 0;
    font-family: 'Courier New', monospace; /* dashboard look */
    font-size: 16px;
    color: #0f0; /* default green LED glow */
    text-shadow: 
        0 0 5px #0f0,
        0 0 10px #0f0,
        0 0 20px #0f0,
        0 0 40px #0f0;
    letter-spacing: 2px;
}

/* Labels in dimmer LED */
.led-label {
    color: #0a0;
    font-weight: bold;
    margin-right: 6px;
    text-shadow: 
        0 0 3px #060,
        0 0 6px #090;
}

/* Values in stronger LED */
.led-value {
    color: #0f0;
    font-weight: bold;
    text-transform: uppercase;
}

/* Different LED colors depending on type */
.led-coords { color: #0ff; text-shadow: 0 0 5px #0ff, 0 0 15px #0ff; }  /* cyan GPS */
.led-station { color: #ff0; text-shadow: 0 0 5px #ff0, 0 0 15px #ff0; }  /* yellow station */
.led-active { color: #f00; text-shadow: 0 0 5px #f00, 0 0 15px #f00; }   /* red active line */

/* Optional subtle flicker for realism */
@keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: 0.8; }
    22% { opacity: 0.6; }
}
.led-text, .led-value {
    animation: flicker 2.5s infinite;
}

    </style>
</head>
<body>

            <button class="line-button blue" data-line="blue">B</button>

            <div class="stations-container">

        // App state
        let currentLocation = null;
        let activeLines = { green: false, yellow: false, blue: false };
        let rotationAngles = { green: 0, yellow: 0, blue: 0 };
        let currentDisplayLine = 'green';
        let stationElements = { green: [], yellow: [], blue: [] };
        let currentStations = { green: null, yellow: null, blue: null };
        
        // Proximity threshold in meters
        const PROXIMITY_THRESHOLD = 500;

        // DOM elements
        const coordinatesSpan = document.getElementById('coordinates');
        const nearestStationSpan = document.getElementById('nearest-station');
        const activeLineSpan = document.getElementById('active-line');
        const gpsStatus = document.getElementById('gps-status');
        const greenLine = document.getElementById('green-line');
        const yellowLine = document.getElementById('yellow-line');
        const blueLine = document.getElementById('blue-line');

        // Calculate distance between two coordinates using Haversine formula
        function calculateDistance(lat1, lng1, lat2, lng2) {
            const R = 6371000; // Earth's radius in meters
            const dLat = toRadians(lat2 - lat1);
            const dLng = toRadians(lng2 - lng1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                     Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) *
                     Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function toRadians(degrees) {
            return degrees * (Math.PI / 180);
        }

        // Find nearest stations for each line
        function findNearestStations(lat, lng) {
            const nearestStations = {};
            
            Object.keys(mrtStations).forEach(line => {
                let minDistance = Infinity;
                let nearestStation = null;
                
                mrtStations[line].forEach(station => {
                    const distance = calculateDistance(lat, lng, station.lat, station.lng);
                    if (distance < minDistance) {
                        minDistance = distance;
                        nearestStation = { ...station, distance };
                    }
                });
                
                nearestStations[line] = nearestStation;
            });
            
            return nearestStations;
        }

        // Update layer rotations based on proximity
        function updateLayerRotations(nearestStations) {
            const activeLinesArray = [];
            
            Object.keys(nearestStations).forEach(line => {
                const station = nearestStations[line];
                const isInProximity = station.distance <= PROXIMITY_THRESHOLD;
                
                if (isInProximity !== activeLines[line]) {
                    activeLines[line] = isInProximity;
                    
                    if (isInProximity) {
                        // Rotate by 45 degrees when entering proximity
                        rotationAngles[line] += 45;
                        activeLinesArray.push(line);
                        
                        // Add visual feedback
                        const layerElement = document.getElementById(`${line}-line`);
                        layerElement.classList.add('active');
                    } else {
                        // Remove visual feedback
                        const layerElement = document.getElementById(`${line}-line`);
                        layerElement.classList.remove('active');
                    }
                    
                    // Apply rotation
                    const layerElement = document.getElementById(`${line}-line`);
                    layerElement.style.transform = `translate(-50%, -50%) rotate(${rotationAngles[line]}deg)`;
                }
                
                if (isInProximity) {
                    activeLinesArray.push(line);
                }
            });
            
            return activeLinesArray;
        }

        // Initialize station displays
        function initializeStationDisplays() {
            Object.keys(mrtStations).forEach(lineColor => {
                const stationsLine = document.getElementById(`${lineColor}-stations-line`);
                const stations = mrtStations[lineColor];
                const lineWidth = Math.max(800, stations.length * 80); // Minimum width for proper spacing
                
                stationsLine.style.width = `${lineWidth}px`;
                stationElements[lineColor] = [];
                
                stations.forEach((station, index) => {
                    // Create station point
                    const stationPoint = document.createElement('div');
                    stationPoint.className = 'station-point';
                    stationPoint.style.left = `${(index / (stations.length - 1)) * (lineWidth - 40) + 20}px`;
                    
                    // Create station name label
                    const stationName = document.createElement('div');
                    stationName.className = 'station-name';
                    stationName.textContent = station.name;
                    stationPoint.appendChild(stationName);
                    
                    // Create distance indicator
                    const stationDistance = document.createElement('div');
                    stationDistance.className = 'station-distance';
                    stationPoint.appendChild(stationDistance);
                    
                    stationsLine.appendChild(stationPoint);
                    stationElements[lineColor].push({
                        element: stationPoint,
                        station: station,
                        distanceElement: stationDistance
                    });
                });
            });
        }

        // Update station display based on current location
        function updateStationDisplay(nearestStations) {
            Object.keys(nearestStations).forEach(lineColor => {
                const stations = mrtStations[lineColor];
                const elements = stationElements[lineColor];
                const nearestStation = nearestStations[lineColor];
                
                elements.forEach((stationData, index) => {
                    const element = stationData.element;
                    const station = stationData.station;
                    const distanceElement = stationData.distanceElement;
                    
                    // Calculate distance to this station
                    if (currentLocation) {
                        const distance = calculateDistance(
                            currentLocation.lat, currentLocation.lng,
                            station.lat, station.lng
                        );
                        
                        // Update distance display
                        distanceElement.textContent = `${Math.round(distance)}m`;
                        
                        // Reset classes
                        element.className = 'station-point';
                        
                        // Determine station status
                        if (station.name === nearestStation.name && distance <= PROXIMITY_THRESHOLD) {
                            element.classList.add('current');
                            currentStations[lineColor] = index;
                        } else if (distance <= PROXIMITY_THRESHOLD * 1.5) {
                            element.classList.add('proximity');
                        } else if (currentStations[lineColor] !== null && index < currentStations[lineColor]) {
                            element.classList.add('passed');
                        }
                    }
                });
                
                // Auto-scroll to current station if on active display
                if (lineColor === currentDisplayLine && currentStations[lineColor] !== null) {
                    const currentElement = elements[currentStations[lineColor]].element;
                    const container = currentElement.parentElement.parentElement;
                    const elementLeft = parseInt(currentElement.style.left);
                    const containerWidth = container.clientWidth;
                    
                    container.scrollLeft = elementLeft - containerWidth / 2;
                }
            });
        }

        // Switch between line displays
        function switchLineDisplay(lineColor) {
            // Hide all displays
            document.querySelectorAll('.line-display').forEach(display => {
                display.classList.remove('active-display');
            });
            
            // Remove active button styling
            document.querySelectorAll('.line-button').forEach(button => {
                button.classList.remove('active-button');
            });
            
            // Show selected display
            document.getElementById(`${lineColor}-display`).classList.add('active-display');
            document.querySelector(`[data-line="${lineColor}"]`).classList.add('active-button');
            
            currentDisplayLine = lineColor;
        }

        // Update UI with current information
        function updateUI(lat, lng, nearestStations, activeLines) {
            coordinatesSpan.textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            
            // Find overall nearest station
            let overallNearest = null;
            let minDistance = Infinity;
            
            Object.values(nearestStations).forEach(station => {
                if (station.distance < minDistance) {
                    minDistance = station.distance;
                    overallNearest = station;
                }
            });
            
            if (overallNearest) {
                nearestStationSpan.textContent = `${overallNearest.name} (${Math.round(overallNearest.distance)}m)`;
            }
            
            activeLineSpan.textContent = activeLines.length > 0 ? activeLines.join(', ') : 'None';
            
            // Update LED indicator for active lines
            const lineLed = document.getElementById('line-led');
            if (activeLines.length > 0) {
                lineLed.className = 'led-dot active';
            } else {
                lineLed.className = 'led-dot inactive';
            }
            
            // Update station display
            updateStationDisplay(nearestStations);
        }

        // Handle geolocation success
        function onLocationSuccess(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            
            currentLocation = { lat, lng };
            
            const nearestStations = findNearestStations(lat, lng);
            const activeLinesArray = updateLayerRotations(nearestStations);
            updateUI(lat, lng, nearestStations, activeLinesArray);
            
            gpsStatus.textContent = `GPS Active - Accuracy: ${Math.round(position.coords.accuracy)}m`;
        }

        // Handle geolocation error
        function onLocationError(error) {
            let errorMessage = 'GPS Error: ';
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    errorMessage += 'Location access denied by user.';
                    break;
                case error.POSITION_UNAVAILABLE:
                    errorMessage += 'Location information unavailable.';
                    break;
                case error.TIMEOUT:
                    errorMessage += 'Location request timed out.';
                    break;
                default:
                    errorMessage += 'Unknown error occurred.';
                    break;
            }
            gpsStatus.textContent = errorMessage;
            coordinatesSpan.textContent = 'GPS unavailable';
        }

        // Initialize the app
        function initApp() {
            // Initialize station displays
            initializeStationDisplays();
            
            // Add line selector event listeners
            document.querySelectorAll('.line-button').forEach(button => {
                button.addEventListener('click', () => {
                    switchLineDisplay(button.dataset.line);
                });
            });
            
            if ('geolocation' in navigator) {
                gpsStatus.textContent = 'Requesting location permission...';
                
                // Options for geolocation
                const options = {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                };
                
                // Start watching position
                const watchId = navigator.geolocation.watchPosition(
                    onLocationSuccess,
                    onLocationError,
                    options
                );
                
                // Store watch ID for cleanup if needed
                window.geoWatchId = watchId;
                
            } else {
                gpsStatus.textContent = 'Geolocation not supported by this browser.';
            }
        }

        // Start the app when page loads
        document.addEventListener('DOMContentLoaded', initApp);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (window.geoWatchId) {
                navigator.geolocation.clearWatch(window.geoWatchId);
            }
        });

        // Add touch events for mobile interaction
        document.addEventListener('touchstart', function(e) {
            e.preventDefault();
        }, { passive: false });

        // Prevent zoom on double tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
