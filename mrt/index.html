    <style>
        body {
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        /* ============================================
           Bottom HUD: debug controls + LED info bar
           ============================================ */
        #hud {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 900;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #hud > * {
            pointer-events: auto;
        }

        #hud.hidden {
            opacity: 0;
        }

        #hud.hidden > * {
            pointer-events: none;
        }

        #info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            padding: 6px;
            max-width: 100%;
            box-sizing: border-box;
            border-radius: 25px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--shadow-soft);
        }

        /* LED chip */
        .led-text {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            max-width: 100%;
            box-sizing: border-box;
            height: 38px;
            padding: 0 14px;
            border-radius: 19px;
            background: rgba(60, 47, 56, 0.55);
            color: #fff;
        }

        .led-label {
            flex: 0 0 auto;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
        }

        .led-value {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--primary-color);
            text-shadow: 0 0 8px rgba(249, 167, 67, 0.55);
            animation: flicker 2.5s infinite;
        }

        .led-coords {
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
        }

        /* Active line: coloured dot in the line's own colour */
        .led-active::before {
            content: '';
            display: none;
            width: 9px;
            height: 9px;
            margin-right: 7px;
            border-radius: 50%;
            vertical-align: 1px;
            background: var(--line-color);
            box-shadow: 0 0 8px var(--line-color);
        }

        .led-active.on::before {
            display: inline-block;
        }

        /* Status chip (GPS state) */
        #status i {
            color: var(--primary-color);
            font-size: 13px;
        }

        #gps-status {
            margin: 0;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: rgba(255, 255, 255, 0.85);
        }

        /* Phones: compact chips, station on its own row */
        @media (max-width: 600px) {
            .led-text {
                height: 34px;
                padding: 0 12px;
                gap: 6px;
            }

            .led-value {
                font-size: 13px;
            }

            #info .led-text:has(#nearest-station) {
                order: -1;
            }
        }

        /* Subtle LED flicker */
        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.85; }
            22% { opacity: 0.7; }
        }

        /* ============================================
           Debug controls (prev / next station)
           ============================================ */
        #debug-controls {
            display: none;
            align-items: center;
            gap: 8px;
        }

        #debug-controls.active {
            display: flex;
        }

        .debug-button {
            width: 44px;
            height: 44px;
            flex: 0 0 auto;
            border: none;
            border-radius: 50%;
            background: var(--glass-bg);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--shadow-soft);
            transition: box-shadow 0.3s ease, background 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .debug-button:hover {
            background: var(--primary-gradient);
            box-shadow: var(--shadow-glow);
        }

        #debug-info {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 150px;
            max-width: 220px;
            height: 44px;
            padding: 0 16px;
            box-sizing: border-box;
            border-radius: 22px;
            background: var(--glass-bg);

        @media (min-width: 900px) {

                right: 20px;
                top: 50%;

        #map-button {

        #map-overlay header .title {
            height: 50px;
            line-height: 50px;
            padding: 0 22px;
            border-radius: 25px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--shadow-soft);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }

        #map-close {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--shadow-soft);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;

        #map-close:hover {

            box-shadow: var(--shadow-glow);

        #map-svg-wrap {
            position: absolute;
            inset: 80px 0 0 0;

        }

            width: 100%;

    <script type="module">
        import { StakcoUtils } from 'https://stakcos.com/assets/1.0.0/components/stakco-utils.js';
        import { StakcoConfig } from 'https://stakcos.com/assets/1.0.0/components/stakco-config.js';

        // Singapore MRT station lists for the three game lines
        const mrtStations = {
            green: [],
            yellow: [],
            blue: []
        };

        // Each MRT line drives one puzzle layer (same image order as before:
        // green = A2A3_0, yellow = A2A3_1, blue = A2A3_2)
        const LINE_LAYER = { green: 1, yellow: 2, blue: 3 };
        const LINE_SHORT = { green: 'EWL', yellow: 'CCL', blue: 'DTL' };

        // Load the game-line station lists (relative paths — works locally + in production)
        ['green', 'yellow', 'blue'].forEach(line => {
            fetch(`data/${line}.json`)
                .then(r => r.json())
                .then(data => {
                    mrtStations[line] = data;
                    console.log(`[Game] ${line} line: ${data.length} stations`);
                })
                .catch(err => console.error(`[Game] Failed to load ${line}.json:`, err));
        });

        // ============================================
        // Full-screen MRT Map — network geometry + render
        // ============================================
        let mrtNetwork = null;  // FeatureCollection from data/network.geojson (lines + stations)

        fetch('data/network.geojson')
            .then(r => r.json())
            .then(d => {
                mrtNetwork = d;
                const lc = d.features.filter(f => f.properties.kind === 'line').length;
                const sc = d.features.filter(f => f.properties.kind === 'station').length;
                console.log(`[Map] network loaded: ${lc} lines, ${sc} stations`);
            })
            .catch(err => console.error('[Map] Failed to load network.geojson:', err));

        // Color keys used by the game-side proximity logic (green/yellow/blue)
        // (Used to color the ±1 neighbor halos and the active-line LED.)
        const MAP_LINE_COLORS = {
            green:  '#009645',   // East-West Line (EWL)
            yellow: '#FA9E0D',   // Circle Line (CCL)
            blue:   '#005EC4',   // Downtown Line (DTL)
        };

        // Singapore bounding box (with a touch of padding)
        const SG_BBOX = { minLng: 103.60, maxLng: 104.05, minLat: 1.21, maxLat: 1.48 };

        function projectLngLat(lng, lat, viewW, viewH) {
            const { minLng, maxLng, minLat, maxLat } = SG_BBOX;
            const dataAspect = (maxLng - minLng) / (maxLat - minLat);
            const viewAspect = viewW / viewH;
            let scale, offX = 0, offY = 0;
            if (viewAspect > dataAspect) {
                // Letterbox horizontally
                scale = viewH / (maxLat - minLat);
                offX  = (viewW - (maxLng - minLng) * scale) / 2;
            } else {
                scale = viewW / (maxLng - minLng);
                offY  = (viewH - (maxLat - minLat) * scale) / 2;
            }
            const x = offX + (lng - minLng) * scale;
            const y = offY + (maxLat - lat) * scale;   // y inverted
            return [x, y];
        }

        // Friendly line name from station-code prefix
        const CODE_PREFIX_NAME = {
            NS: 'North-South', EW: 'East-West', CG: 'Changi Branch',
            CC: 'Circle', CE: 'Circle Ext', DT: 'Downtown', NE: 'North-East',
            TE: 'Thomson-East Coast',
            BP: 'Bukit Panjang LRT', SE: 'Sengkang LRT', SW: 'Sengkang LRT',
            PE: 'Punggol LRT',       PW: 'Punggol LRT', STC:'Sengkang LRT', PTC:'Punggol LRT',
        };
        function prefixesOf(codes) {
            return [...new Set(codes.map(c => c.match(/^[A-Z]+/)?.[0]).filter(Boolean))];
        }

        function renderMrtMap() {
            const svg = document.getElementById('map-svg');
            const wrap = document.getElementById('map-svg-wrap');
            if (!svg || !mrtNetwork) return;
            const rect = wrap.getBoundingClientRect();
            const W = rect.width || 320;
            const H = rect.height || 480;
            svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
            svg.innerHTML = '';
            const NS = 'http://www.w3.org/2000/svg';

            const lineFeatures    = mrtNetwork.features.filter(f => f.properties.kind === 'line');
            const stationFeatures = mrtNetwork.features.filter(f => f.properties.kind === 'station');

            // ---- 1. Draw all line geometries ----
            lineFeatures.forEach(f => {
                const color = f.properties.color;
                const geom = f.geometry;
                const segments = (geom.type === 'LineString') ? [geom.coordinates] : geom.coordinates;
                segments.forEach(coords => {
                    if (!coords || coords.length < 2) return;
                    const d = coords.map(([lng, lat], i) => {
                        const [x, y] = projectLngLat(lng, lat, W, H);
                        return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`;
                    }).join(' ');
                    const path = document.createElementNS(NS, 'path');
                    path.setAttribute('d', d);
                    path.setAttribute('class', 'map-line');
                    path.setAttribute('stroke', color);
                    svg.appendChild(path);
                });
            });

            // ---- 2. Determine highlights (current + ±1 per active game line) ----
            const currentNames   = new Set();    // lowercase station names
            const neighborByLine = {};           // name → 'green'|'yellow'|'blue'
            if (currentLocation) {
                const nearest = findNearestStations(currentLocation.lat, currentLocation.lng);
                Object.keys(nearest).forEach(line => {
                    const s = nearest[line];
                    if (!s || s.distance > PROXIMITY_THRESHOLD) return;
                    const stations = mrtStations[line];
                    const idx = stations.findIndex(x => x.name === s.name);
                    if (idx === -1) return;
                    currentNames.add(s.name.toLowerCase());
                    if (idx > 0)                   neighborByLine[stations[idx - 1].name.toLowerCase()] = line;
                    if (idx < stations.length - 1) neighborByLine[stations[idx + 1].name.toLowerCase()] = line;
                });
            }

            // ---- 3. Draw station dots ----
            const tooltip = document.getElementById('map-station-tooltip');
            stationFeatures.forEach(f => {
                const [lng, lat] = f.geometry.coordinates;
                const [x, y]     = projectLngLat(lng, lat, W, H);
                const key        = f.properties.name.toLowerCase();
                const colors     = f.properties.colors || [];
                const isInterchange = colors.length > 1 || (new Set(colors)).size > 1;
                const isCurrent     = currentNames.has(key);
                const isNeighbor    = !isCurrent && (key in neighborByLine);
                const primary       = colors[0] || '#999';

                const c = document.createElementNS(NS, 'circle');
                c.setAttribute('cx', x.toFixed(1));
                c.setAttribute('cy', y.toFixed(1));

                if (isCurrent) {
                    c.setAttribute('r', '7');
                    c.setAttribute('fill', '#fff');
                    c.setAttribute('stroke', '#e53935');
                    c.setAttribute('stroke-width', '3');
                } else if (isNeighbor) {
                    c.setAttribute('r', '5.5');
                    c.setAttribute('fill', '#fff');
                    c.setAttribute('stroke', MAP_LINE_COLORS[neighborByLine[key]]);
                    c.setAttribute('stroke-width', '2.5');
                } else if (isInterchange) {
                    c.setAttribute('r', '3.8');
                    c.setAttribute('fill', '#fff');
                    c.setAttribute('stroke', '#3c2f38');
                    c.setAttribute('stroke-width', '1.6');
                } else {
                    c.setAttribute('r', '2.8');
                    c.setAttribute('fill', '#fff');
                    c.setAttribute('stroke', primary);
                    c.setAttribute('stroke-width', '1.4');
                }
                c.style.cursor = 'pointer';
                c.addEventListener('click', (ev) => {
                    ev.stopPropagation();
                    const codes = f.properties.codes || [];
                    const lineNames = prefixesOf(codes).map(p => CODE_PREFIX_NAME[p] || p);
                    tooltip.querySelector('.tt-name').textContent  = f.properties.name;
                    tooltip.querySelector('.tt-lines').textContent = lineNames.join(' · ');
                    tooltip.classList.add('show');
                });
                svg.appendChild(c);
            });

            // Hide tooltip on background click
            svg.addEventListener('click', (ev) => {
                if (ev.target === svg || ev.target.tagName === 'path') {
                    tooltip.classList.remove('show');
                }
            }, { once: true });

            // ---- 5. Current location pulse ----
            if (currentLocation) {
                const [x, y] = projectLngLat(currentLocation.lng, currentLocation.lat, W, H);

                const pulse = document.createElementNS(NS, 'circle');
                pulse.setAttribute('cx', x.toFixed(1));
                pulse.setAttribute('cy', y.toFixed(1));
                pulse.setAttribute('fill', '#e53935');
                pulse.setAttribute('opacity', '0.45');
                pulse.setAttribute('r', '6');
                const aR = document.createElementNS(NS, 'animate');
                aR.setAttribute('attributeName', 'r');
                aR.setAttribute('from', '6'); aR.setAttribute('to', '28');
                aR.setAttribute('dur', '1.6s'); aR.setAttribute('repeatCount', 'indefinite');
                const aO = document.createElementNS(NS, 'animate');
                aO.setAttribute('attributeName', 'opacity');
                aO.setAttribute('from', '0.45'); aO.setAttribute('to', '0');
                aO.setAttribute('dur', '1.6s'); aO.setAttribute('repeatCount', 'indefinite');
                pulse.appendChild(aR); pulse.appendChild(aO);
                svg.appendChild(pulse);

                const dot = document.createElementNS(NS, 'circle');
                dot.setAttribute('cx', x.toFixed(1));
                dot.setAttribute('cy', y.toFixed(1));
                dot.setAttribute('r', '6');
                dot.setAttribute('fill', '#e53935');
                dot.setAttribute('stroke', '#fff');
                dot.setAttribute('stroke-width', '2.5');
                svg.appendChild(dot);
            }
        }

        function isMapOpen() {
            return document.getElementById('map-overlay').classList.contains('show');
        }
        function openMrtMap() {
            document.getElementById('map-overlay').classList.add('show');
            requestAnimationFrame(renderMrtMap);
        }
        function closeMrtMap() {
            document.getElementById('map-overlay').classList.remove('show');
            document.getElementById('map-station-tooltip').classList.remove('show');
        }

        // App state
        let currentLocation = null;
        let activeLines = { green: false, yellow: false, blue: false };
        // Last target angle applied per line (null = not applied yet)
        let rotationAngles = { green: null, yellow: null, blue: null };
        let sessionStarted = false;
        let puzzleReady = false;

        // Debug mode state
        let debugMode = false;
        let debugStationIndex = 0;
        let debugLine = 'green';

        // Proximity threshold in meters
        const PROXIMITY_THRESHOLD = 500;
        // Duration of the station-to-station layer turn
        const ROTATE_DURATION = 1000;

        // Stakco components
        const puzzleContainer = document.querySelector('stakco-puzzle-container');
        const countdown = document.querySelector('stakco-countdown');
        const infoPanel = document.querySelector('stakco-info-panel');
        const branding = document.querySelector('stakco-branding');
        const shareWindow = document.querySelector('stakco-share-window');
        const shareButton = document.querySelector('stakco-share-button');
        const orientationOverlay = document.querySelector('stakco-orientation-overlay');

        // DOM elements
        const hud = document.getElementById('hud');
        const coordinatesSpan = document.getElementById('coordinates');
        const nearestStationSpan = document.getElementById('nearest-station');
        const activeLineSpan = document.getElementById('active-line');
        const gpsStatus = document.getElementById('gps-status');

        // Calculate distance between two coordinates using Haversine formula
        function calculateDistance(lat1, lng1, lat2, lng2) {
            const R = 6371000; // Earth's radius in meters
            const dLat = toRadians(lat2 - lat1);
            const dLng = toRadians(lng2 - lng1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function toRadians(degrees) {
            return degrees * (Math.PI / 180);
        }

        // Find nearest stations for each line
        function findNearestStations(lat, lng) {
            const nearestStations = {};

            Object.keys(mrtStations).forEach(line => {
                let minDistance = Infinity;
                let nearestStation = null;

                mrtStations[line].forEach(station => {
                    const distance = calculateDistance(lat, lng, station.lat, station.lng);
                    if (distance < minDistance) {
                        minDistance = distance;
                        nearestStation = { ...station, distance };
                    }
                });

                nearestStations[line] = nearestStation;
            });

            return nearestStations;
        }

        // ============================================
        // Layer rotation through <stakco-puzzle-container>
        // ============================================
        const layerAnimations = {};   // line → timer id
        // Timer-driven frames: keeps turning (and finishes) even where rAF is paused
        const nextFrame = (cb) => setTimeout(() => cb(performance.now()), 16);

        function easeInOut(t) {
            return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        }

        // Turn a line's layer to an absolute angle along the shortest path
        function animateLineTo(line, targetAngle) {
            const layer = LINE_LAYER[line];
            const from = puzzleContainer.getAllRotations()[`layer${layer}`] || 0;
            const delta = ((targetAngle - from) % 360 + 540) % 360 - 180;
            const to = from + delta;

            if (layerAnimations[line]) clearTimeout(layerAnimations[line]);

            const start = performance.now();
            const step = (now) => {
                if (puzzleContainer.isSolved) { delete layerAnimations[line]; return; }
                const t = Math.min(1, (now - start) / ROTATE_DURATION);
                puzzleContainer.setLayerRotation(layer, from + delta * easeInOut(t));
                if (t < 1) {
                    layerAnimations[line] = nextFrame(step);
                } else {
                    delete layerAnimations[line];
                    puzzleContainer.setLayerRotation(layer, to);
                    if (Object.keys(layerAnimations).length === 0) {
                        puzzleContainer.checkAlignment();
                    }
                }
            };
            layerAnimations[line] = nextFrame(step);
        }

        // Update layer rotations based on current station position
        function updateLayerRotations(nearestStations) {
            const activeLinesArray = [];

            Object.keys(nearestStations).forEach(line => {
                const station = nearestStations[line];
                if (!station) return; // Skip if no station data

                const isInProximity = station.distance <= PROXIMITY_THRESHOLD;

                // Calculate rotation based on station position in the line
                const stations = mrtStations[line];
                if (stations && stations.length > 0) {
                    // Find the index of the current nearest station
                    const stationIndex = stations.findIndex(s => s.name === station.name);

                    if (stationIndex !== -1) {
                        // Calculate rotation angle
                        const anglePerStation = 360 / stations.length;
                        const targetAngle = Math.round(stationIndex * anglePerStation); // round to nearest int

                        // Rotate this line's layer (once the puzzle has loaded)
                        if (puzzleReady && !puzzleContainer.isSolved && rotationAngles[line] !== targetAngle) {
                            console.log(`Rotating ${line} line (layer ${LINE_LAYER[line]}) to ${targetAngle}° for station ${station.name}`);
                            rotationAngles[line] = targetAngle;
                            animateLineTo(line, targetAngle);
                        }
                    }
                }

                activeLines[line] = isInProximity;
                if (isInProximity) {
                    activeLinesArray.push(line);
                }
            });

            // Highlight the layer of the line you are on
            if (puzzleReady && activeLinesArray.length > 0) {
                const layer = LINE_LAYER[activeLinesArray[0]];
                if (puzzleContainer.getCurrentLayer() !== layer) {
                    puzzleContainer.switchLayer(layer);
                }
            }

            return activeLinesArray;
        }

        // Update UI with current information
        function updateUI(lat, lng, nearestStations, activeLines) {
            coordinatesSpan.textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;

            // Find overall nearest station
            let overallNearest = null;
            let minDistance = Infinity;

            Object.values(nearestStations).forEach(station => {
                if (station && station.distance < minDistance) {
                    minDistance = station.distance;
                    overallNearest = station;
                }
            });

            if (overallNearest) {
                nearestStationSpan.textContent = `${overallNearest.name} (${Math.round(overallNearest.distance)}m)`;
            }

            activeLineSpan.textContent = activeLines.length > 0 ? activeLines.map(l => LINE_SHORT[l]).join(' ') : 'None';
            activeLineSpan.classList.toggle('on', activeLines.length > 0);
            if (activeLines.length > 0) activeLineSpan.style.setProperty('--line-color', MAP_LINE_COLORS[activeLines[0]]);
        }

        // First location (real or debug) starts the timer, like the other apps
        function startSession() {
            if (sessionStarted) return;
            sessionStarted = true;
            countdown.start();
            branding.hide();
        }

        function runLocationUpdate(lat, lng) {
            currentLocation = { lat, lng };
            const nearestStations = findNearestStations(lat, lng);
            const activeLinesArray = updateLayerRotations(nearestStations);
            updateUI(lat, lng, nearestStations, activeLinesArray);
            if (puzzleReady) startSession();
            if (isMapOpen()) renderMrtMap();
        }

        // Handle geolocation success
        function onLocationSuccess(position) {
            runLocationUpdate(position.coords.latitude, position.coords.longitude);
            gpsStatus.textContent = `GPS ±${Math.round(position.coords.accuracy)}m`;
        }

        // Enable debug mode
        function enableDebugMode() {
            debugMode = true;
            document.getElementById('debug-controls').classList.add('active');
            document.getElementById('debug-info').classList.add('active');

            // Set initial debug position to first station of default line
            debugStationIndex = 0;
            debugLine = 'green';
            console.log('Debug mode enabled on line:', debugLine);

            gpsStatus.textContent = 'Debug mode';
            infoPanel.setContent('<p>Debug mode: step through stations</p>');
        }

        // Update debug mode simulation
        function updateDebugMode() {
            if (!debugMode || !mrtStations[debugLine] || mrtStations[debugLine].length === 0) return;

            const station = mrtStations[debugLine][debugStationIndex];
            if (!station) return;

            // Update debug info display
            document.getElementById('debug-station-info').textContent = station.name;
            document.getElementById('debug-line-info').textContent = `${LINE_SHORT[debugLine]} ${debugStationIndex + 1}/${mrtStations[debugLine].length}`;

            // Simulate being at this station and run normal location update logic
            runLocationUpdate(station.lat, station.lng);
        }

        // Navigate to previous station
        function goToPrevStation() {
            if (!debugMode || !mrtStations[debugLine]) return;

            debugStationIndex = Math.max(0, debugStationIndex - 1);
            updateDebugMode();
        }

        // Navigate to next station
        function goToNextStation() {
            if (!debugMode || !mrtStations[debugLine]) return;

            debugStationIndex = Math.min(mrtStations[debugLine].length - 1, debugStationIndex + 1);
            updateDebugMode();
        }

        // Handle geolocation error
        function onLocationError(error) {
            let errorMessage;
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    errorMessage = 'Location denied';
                    enableDebugMode(); // Enable debug mode when GPS is denied
                    break;
                case error.POSITION_UNAVAILABLE:
                    errorMessage = 'Location unavailable';
                    enableDebugMode(); // Enable debug mode when GPS unavailable
                    break;
                case error.TIMEOUT:
                    errorMessage = 'GPS timed out';
                    break;
                default:
                    errorMessage = 'GPS error';
                    break;
            }
            if (debugMode) errorMessage = 'Debug mode';
            gpsStatus.textContent = errorMessage;
            coordinatesSpan.textContent = 'Unavailable';
        }

        // ============================================
        // Solve + share (same flow as the other Stakco apps)
        // ============================================
        function solvePuzzle() {
            console.log('Puzzle solved!');
            Object.values(layerAnimations).forEach(id => clearTimeout(id));

            countdown.stop();
            StakcoUtils.vibrate(StakcoConfig.VIBRATION_PATTERN);

            infoPanel.collapse();
            hud.classList.add('hidden');
            shareButton.show();
        }

        async function handleShare() {
            const timeToSolve = countdown.getTime();
            const layerImages = puzzleContainer.getLayerImages();
            const station = nearestStationSpan.textContent.replace(/\s*\(\d+m\)$/, '');

            const message = `Solved in ${timeToSolve} at ${station}!`;
            shareWindow.setAttribute('filename', 'stakco-mrt.png');

            await shareWindow.open(layerImages, message, true);
        }

        // Initialize the app
        function initApp() {
            StakcoUtils.preventZoom();

            // The container may have finished loading before this listener exists
            if (Object.values(puzzleContainer.puzzleLayers || {}).some(l => l.url)) {
                puzzleReady = true;
            }

            // Puzzle container
            puzzleContainer.addEventListener('puzzle-ready', () => {
                console.log('Puzzle ready');
                puzzleReady = true;
                // Re-apply the latest station angles if GPS arrived before the puzzle
                rotationAngles = { green: null, yellow: null, blue: null };
                if (currentLocation) runLocationUpdate(currentLocation.lat, currentLocation.lng);
            });
            puzzleContainer.addEventListener('puzzle-solved', solvePuzzle);

            // Orientation overlay
            orientationOverlay.addEventListener('blocked', () => {
                if (countdown && countdown.active) countdown.pause();
            });
            orientationOverlay.addEventListener('unblocked', () => {
                if (countdown && countdown.paused) countdown.resume();
            });

            // Share button
            shareButton.addEventListener('share-clicked', handleShare);

            // Debug control event listeners
            document.getElementById('prev-station').addEventListener('click', goToPrevStation);
            document.getElementById('next-station').addEventListener('click', goToNextStation);

            // Map overlay
            document.getElementById('map-button').addEventListener('click', openMrtMap);
            document.getElementById('map-close').addEventListener('click', closeMrtMap);
            window.addEventListener('resize', () => { if (isMapOpen()) renderMrtMap(); });

            // Keyboard shortcuts
            document.addEventListener('keydown', (event) => {
                // ESC closes the map regardless of debug state
                if (event.key === 'Escape' && isMapOpen()) {
                    event.preventDefault();
                    closeMrtMap();
                    return;
                }
                if (debugMode) {
                    switch (event.key) {
                        case 'ArrowLeft':
                            event.preventDefault();
                            goToPrevStation();
                            break;
                        case 'ArrowRight':
                            event.preventDefault();
                            goToNextStation();
                            break;
                        case 'Escape':
                            // Exit debug mode (if GPS becomes available)
                            if (confirm('Exit debug mode?')) {
                                debugMode = false;
                                document.getElementById('debug-controls').classList.remove('active');
                                document.getElementById('debug-info').classList.remove('active');
                                gpsStatus.textContent = 'Debug off';
                            }
                            break;
                    }
                }
            });

            if ('geolocation' in navigator) {
                gpsStatus.textContent = 'Locating...';

                // Start watching position
                window.geoWatchId = navigator.geolocation.watchPosition(
                    onLocationSuccess,
                    onLocationError,
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                gpsStatus.textContent = 'No GPS';
                enableDebugMode(); // Enable debug mode if geolocation not supported
            }
        }

        // Start the app when page loads
        document.addEventListener('DOMContentLoaded', initApp);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (window.geoWatchId) {
                navigator.geolocation.clearWatch(window.geoWatchId);
            }
        });
    </script>
</body>

</html>
