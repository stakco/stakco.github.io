        body {
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        #itiles-info {
            max-width: 75%;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 15px 30px;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-soft);
            z-index: 800;
            display: flex;
            gap: 20px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
        }

        /* Mobile adjustment */
        @media (max-width: 600px) {
            #itiles-info {
                top: 80px;
                max-width: 90%;
                flex-direction: column;
                gap: 10px;
            }
        }

        #itiles-info.hidden {
            display: none;
        }

        .itiles-row {
            display: flex;
            align-items: center;
        }

        .itiles-label {
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .itiles-value {
            color: var(--primary-color);
            font-weight: 600;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
        }

        .itiles-activity {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #333;
            border: 2px solid #666;
            transition: all 0.2s ease;
            display: inline-block;
            margin-left: 10px;
        }

        .itiles-activity.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-glow);
        }

        .connection-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 850;
        }

        .connection-buttons button {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 10px 20px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .connection-buttons button:hover:not(:disabled) {
            background: var(--primary-gradient);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-glow);
        }

        .connection-buttons button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .connection-buttons button.success {
            background: var(--success-gradient);
            border-color: var(--success-color);
        }

        @media (max-width: 600px) {
            .connection-buttons {
                top: auto;
                bottom: 120px;
                right: 10px;
                left: 10px;
                justify-content: center;
            }
            
            .connection-buttons button {
                flex: 1;
                font-size: 11px;
                padding: 8px 12px;
            }
        }

        .tile-visual {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            z-index: 800;
        }

        .tile-indicator {
            width: 8px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            transition: all 0.1s ease;
        }

        .tile-indicator.active {
            background: var(--primary-gradient);
            box-shadow: var(--shadow-glow);
        }

        @media (max-width: 600px) {
            .tile-visual {
                bottom: 180px;
            }
        }

    <script type="module">
        import { StakcoUtils } from 'https://stakcos.com/assets/1.0.0/components/stakco-utils.js';
        import { StakcoConfig } from 'https://stakcos.com/assets/1.0.0/components/stakco-config.js';
        import { 
            ITilesBLEManager,
            TileColor,
            SELECT_ITILE,
            TIMEOUT_DELAY,
            CONNECTION_STATE,
            TOGGLE_SENSOR,
            GAME_STATUS
        } from 'https://stakcos.com/itiles/itiles.esm.js';

        const CONFIG = StakcoConfig.getConfig('itiles');

        // iTiles state
        const bleManager = new ITilesBLEManager();
        let touchCount = 0;
        let puzzleSolved = false;

        // Tile rotation mappings
        const tileRotations = {
            1: 0,
            2: 60,
            3: 120,
            4: 180,
            5: 240,
            6: 300
        };

        const puzzleContainer = document.querySelector('stakco-puzzle-container');
        const layerControls = document.querySelector('stakco-layer-controls');
        const infoPanel = document.querySelector('stakco-info-panel');
        const shareWindow = document.querySelector('stakco-share-window');
        const permissionPrompt = document.querySelector('stakco-permission-prompt');
        const branding = document.querySelector('stakco-branding');
        const shareButton = document.querySelector('stakco-share-button');
        
        const iTilesInfo = document.getElementById('itiles-info');
        const lastTileSpan = document.getElementById('last-tile');
        const activeLayerSpan = document.getElementById('active-layer');
        const rotationValueSpan = document.getElementById('rotation-value');
        const iTilesIndicator = document.getElementById('itiles-indicator');
        const tileVisual = document.getElementById('tile-visual');
        
        const connectBtn = document.getElementById('connectBtn');
        const pairBtn = document.getElementById('pairBtn');

        async function init() {
            console.log('Initializing Stakco iTiles...');

            StakcoUtils.preventZoom();
            createTileVisual();
            setupEventListeners();
            setupITilesEventListeners();

            // Wait for puzzle container to be ready
            await new Promise(resolve => {
                if (puzzleContainer.shadowRoot) {
                    resolve();
                } else {
                    puzzleContainer.addEventListener('puzzle-ready', resolve, { once: true });
                }
            });

            setTimeout(checkPermissionNeeded, 1000);
            console.log('App initialized');
        }

        function setupEventListeners() {
            puzzleContainer.addEventListener('puzzle-ready', () => {
                console.log('Puzzle ready');
            });

            puzzleContainer.addEventListener('puzzle-solved', () => {
                puzzleSolved = true;
                handlePuzzleSolved();
            });

            layerControls.addEventListener('layerchange', (e) => {
                puzzleContainer.switchLayer(e.detail.layer);
                activeLayerSpan.textContent = e.detail.layer;
                updateRotationDisplay();
            });

            permissionPrompt.addEventListener('primary-action', async () => {
                await connectITiles();
            });

            permissionPrompt.addEventListener('secondary-action', () => {
                initializeITiles();
            });

            shareButton.addEventListener('share-clicked', handleShare);
            
            connectBtn.addEventListener('click', connectITiles);
            pairBtn.addEventListener('click', pairITiles);
        }

        function setupITilesEventListeners() {
            bleManager.onConnectionStateChanged((state) => {
                const connected = state === CONNECTION_STATE.CONNECTED;
                
                if (connected) {
                    connectBtn.disabled = true;
                    pairBtn.disabled = false;
                    connectBtn.textContent = 'Connected';
                    console.log('iTiles master connected');
                } else {
                    connectBtn.disabled = false;
                    pairBtn.disabled = true;
                    connectBtn.textContent = 'Connect iTiles';
                }
            });

            bleManager.onPairedTileListReceived((response) => {
                const tiles = response.pairedTileIds.join(', ') || 'None';
                console.log(`Paired tiles (${response.pairedTileTotal}): ${tiles}`);
                
                if (response.pairedTileTotal > 0) {
                    initializeITiles();
                }
            });

            // Touch event handler
            bleManager.onTouch((response) => {
                if (puzzleSolved) return;
                
                const tileId = response.tileId;
                touchCount++;
                
                showITilesActivity();
                updateTileVisual(tileId);
                lastTileSpan.textContent = `#${tileId}`;
                
                // Tile 1-6: Rotate current layer to angle
                if (tileId >= 1 && tileId <= 6) {
                    const angle = tileRotations[tileId];
                    rotateToAngle(angle);
                    
                    // Visual feedback on tile
                    triggerTileFeedback(tileId);
                    
                    console.log(`Tile ${tileId} touched: rotating to ${angle}°`);
                }
                
                // Tile 7 (center): Switch to next layer
                if (tileId === 7) {
                    const currentLayer = parseInt(activeLayerSpan.textContent);
                    const nextLayer = (currentLayer % 3) + 1;
                    
                    puzzleContainer.switchLayer(nextLayer);
                    activeLayerSpan.textContent = nextLayer;
                    layerControls.setActiveLayer(nextLayer);
                    updateRotationDisplay();
                    
                    // Visual feedback on center tile
                    triggerTileFeedback(tileId);
                    
                    console.log(`Tile 7 (center) touched: switched to layer ${nextLayer}`);
                }
                
                // Check if puzzle solved
                puzzleContainer.checkAlignment();
            });
        }

        function createTileVisual() {
            tileVisual.innerHTML = '';
            // Create 7 tile indicators (6 outer + 1 center)
            for (let i = 1; i <= 7; i++) {
                const bar = document.createElement('div');
                bar.className = 'tile-indicator';
                bar.dataset.tile = i;
                tileVisual.appendChild(bar);
            }
        }

        async function connectITiles() {
            try {
                console.log('Opening iTiles device picker...');
                const device = await bleManager.requestDevice();
                console.log(`Device selected: ${device.name}`);
                
                await bleManager.connect();
                
            } catch (error) {
                console.error('iTiles connection error:', error);
                infoPanel.setContent('<p>iTiles connection failed</p>');
            }
        }

        async function pairITiles() {
            try {
                console.log('Starting auto-pairing (20 seconds)...');
                infoPanel.setContent('<p>Pairing tiles... Please wait 20 seconds</p>');
                
                pairBtn.disabled = true;
                pairBtn.textContent = 'Pairing...';
                
                await bleManager.queryOnlineTiles(SELECT_ITILE.ALL);
                
                let countdown = 20;
                const interval = setInterval(() => {
                    pairBtn.textContent = `Pairing... ${countdown}s`;
                    countdown--;
                }, 1000);
                
                await new Promise(r => setTimeout(r, 20000));
                clearInterval(interval);
                
                await bleManager.confirmAssignment(SELECT_ITILE.ALL);
                await new Promise(r => setTimeout(r, 500));
                
                // FIXED: Activate tiles 1-7 to pair all tiles including center tile
                for (let i = 1; i <= 7; i++) {
                    await bleManager.gameInProgress(GAME_STATUS.IN_GAME, i);
                    await new Promise(r => setTimeout(r, 500));
                }
                
                // Enable touch sensors
                await bleManager.toggleTouchSensor(TOGGLE_SENSOR.ON, SELECT_ITILE.ALL);
                console.log('Touch sensors enabled');
                
                await bleManager.queryPairedTiles();
                
                pairBtn.textContent = 'Paired';
                
            } catch (error) {
                console.error('Pairing error:', error);
                pairBtn.disabled = false;
                pairBtn.textContent = 'Pair Tiles';
            }
        }

        function initializeITiles() {
            infoPanel.setContent('<p>iTiles active - Touch tiles 1-6 to rotate, tile 7 (center) to switch layers</p>');
            iTilesInfo.classList.remove('hidden');
            branding.hide();
        }

        function showITilesActivity() {
            iTilesIndicator.classList.add('active');
            setTimeout(() => iTilesIndicator.classList.remove('active'), 200);
        }

        function updateTileVisual(tileId) {
            document.querySelectorAll('.tile-indicator').forEach(bar => bar.classList.remove('active'));
            const activeBar = document.querySelector(`[data-tile="${tileId}"]`);
            if (activeBar) {
                activeBar.classList.add('active');
                setTimeout(() => activeBar.classList.remove('active'), 300);
            }
        }

        function rotateToAngle(targetAngle) {
            // Get current rotation
            const currentRotation = puzzleContainer.getCurrentRotation();
            
            // Calculate shortest path to target angle
            let normalizedCurrent = ((currentRotation % 360) + 360) % 360;
            let diff = targetAngle - normalizedCurrent;
            
            // Normalize to shortest path (-180 to 180)
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            
            // Rotate by the difference
            puzzleContainer.rotateCurrentLayer(diff);
            
            updateRotationDisplay();
        }

        async function triggerTileFeedback(tileId) {
            // Light up the pressed tile
            const colors = [
                TileColor.RED, TileColor.YELLOW, TileColor.GREEN,
                TileColor.CYAN, TileColor.BLUE, TileColor.MAGENTA
            ];
            const color = colors[(tileId - 1) % colors.length];
            
            await bleManager.triggerLight(
                color,
                TIMEOUT_DELAY.SEC_1,
                0, 0,
                tileId
            );
        }

        function updateRotationDisplay() {
            const rotation = puzzleContainer.getCurrentRotation();
            let displayRotation = rotation % 360;
            if (displayRotation < 0) displayRotation += 360;
            rotationValueSpan.textContent = `${Math.round(displayRotation)}°`;
        }

        function handlePuzzleSolved() {
            console.log(`Puzzle solved with ${touchCount} touches!`);

            StakcoUtils.vibrate([200, 100, 300, 100, 200]);

            // Celebration light show
            playCelebrationLights();

            infoPanel.setContent(`<p>Puzzle solved with ${touchCount} touches!</p>`);

            setTimeout(() => {
                layerControls.hide();
                iTilesInfo.classList.add('hidden');
                shareButton.show();
            }, 2000);

            // Animate all layers to zero
            setTimeout(() => {
                puzzleContainer.animateToSolution(2000);
            }, 500);
        }

        async function playCelebrationLights() {
            const celebrationSequence = [
                { tiles: SELECT_ITILE.ALL, color: TileColor.RED, duration: 300 },
                { tiles: SELECT_ITILE.ALL, color: TileColor.YELLOW, duration: 300 },
                { tiles: SELECT_ITILE.ALL, color: TileColor.GREEN, duration: 300 },
                { tiles: SELECT_ITILE.ALL, color: TileColor.CYAN, duration: 300 },
                { tiles: SELECT_ITILE.ALL, color: TileColor.BLUE, duration: 300 },
                { tiles: SELECT_ITILE.ALL, color: TileColor.MAGENTA, duration: 300 },
            ];

            for (let { tiles, color, duration } of celebrationSequence) {
                await bleManager.triggerLight(color, TIMEOUT_DELAY.SEC_1, 0, 0, tiles);
                await new Promise(resolve => setTimeout(resolve, duration));
            }

            // Final all-white flash
            await bleManager.triggerLight(TileColor.WHITE, TIMEOUT_DELAY.SEC_2, 0, 0, SELECT_ITILE.ALL);
        }

        async function handleShare() {
            const layerImages = puzzleContainer.getLayerImages();
            const message = `Solved with ${touchCount} touches!`;
            shareWindow.setAttribute('filename', `stakco-itiles-${touchCount}touches.png`);
            await shareWindow.open(layerImages, message, true);
        }

        async function checkPermissionNeeded() {
            if (navigator.bluetooth) {
                permissionPrompt.show();
            } else {
                infoPanel.setContent('<p>Web Bluetooth not supported in this browser</p>');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
