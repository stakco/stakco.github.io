        body {

        .dial-row {

        .dial-label {

        }

<body>

    <stakco-puzzle-container
        layers="3"
        user-id="109949450257686494443"
        puzzle-id="A2A3_3"
        tolerance="2">
    </stakco-puzzle-container>

    <stakco-permission-prompt 
        title="Enable Surface Dial Access"
        message="This app needs access to your Surface Dial device to control puzzle layers with rotation and button press. Connect your Surface Dial via Bluetooth, then enable access."
        primary-label="Connect Surface Dial"
        secondary-label="Skip">
    </stakco-permission-prompt>

    <stakco-share-window 
        title="Stakco Surface Dial"
        share-url="https://stakcos.com/dial/">
        <div slot="text">Solved with Surface Dial!</div>
    </stakco-share-window>

    <script type="module">
        import { StakcoUtils } from 'https://stakcos.com/assets/1.0.0/components/stakco-utils.js';
        import { StakcoConfig } from 'https://stakcos.com/assets/1.0.0/components/stakco-config.js';

        const CONFIG = StakcoConfig.getConfig('dial');

        // Surface Dial state
        let dialDevice = null;
        let rotationCount = 0;
        let puzzleSolved = false;

        const puzzleContainer = document.querySelector('stakco-puzzle-container');
        const layerControls = document.querySelector('stakco-layer-controls');
        const infoPanel = document.querySelector('stakco-info-panel');
        const shareWindow = document.querySelector('stakco-share-window');
        const permissionPrompt = document.querySelector('stakco-permission-prompt');
        const branding = document.querySelector('stakco-branding');
        const shareButton = document.querySelector('stakco-share-button');
        
        const dialInfo = document.getElementById('dial-info');
        const dialRotationSpan = document.getElementById('dial-rotation');
        const activeLayerSpan = document.getElementById('active-layer');
        const rotationCountSpan = document.getElementById('rotation-count');
        const dialIndicator = document.getElementById('dial-indicator');

        // Surface Dial Controller
        class SurfaceDialController {
            constructor() {
                this.device = null;
                this.currentRotation = 0;
                this.isButtonPressed = false;
                this.prevBytes = null;
                this.sensitivity = 1.0;
                this.maxDelta = 1.0;
            }

            async connect() {
                try {
                    const devices = await navigator.hid.requestDevice({
                        filters: [
                            { vendorId: 0x045E, usagePage: 0x01, usage: 0x0E },
                            { vendorId: 0x045E }
                        ]
                    });
                    
                    if (!devices?.length) throw new Error('No Surface Dial selected');
                    
                    this.device = devices[0];
                    await this.device.open();
                    
                    this.device.addEventListener('inputreport', (e) => this.handleInput(e));
                    
                    console.log('Surface Dial connected:', this.device.productName);
                    return true;
                    
                } catch (error) {
                    console.error('Connection failed:', error);
                    return false;
                }
            }

            handleInput(event) {
                const { data } = event;
                const view = new DataView(data.buffer);
                
                try {
                    let rotationDelta = 0;
                    let buttonPressed = this.isButtonPressed;
                    
                    if (view.byteLength >= 2) {
                        const rawValue = view.getInt16(0, true);
                        rotationDelta = (rawValue / 256.0) * this.sensitivity;
                        
                        if (Math.abs(rotationDelta) > this.maxDelta) {
                            rotationDelta = Math.sign(rotationDelta) * this.maxDelta;
                        }
                        if (Math.abs(rotationDelta) < 0.001) rotationDelta = 0;
                    }
                    
                    if (this.prevBytes && view.byteLength > 0) {
                        for (let i = 0; i < Math.min(4, view.byteLength, this.prevBytes.length); i++) {
                            const curr = view.getUint8(i);
                            const prev = this.prevBytes[i];
                            const changed = curr ^ prev;
                            
                            if (changed & 0x01) {
                                buttonPressed = (curr & 0x01) !== 0;
                                break;
                            }
                        }
                    }
                    
                    this.prevBytes = Array.from(new Uint8Array(view.buffer)).slice(0, 8);
                    
                    if (rotationDelta !== 0) {
                        this.currentRotation = ((this.currentRotation + rotationDelta) % 360 + 360) % 360;
                        handleRotation(rotationDelta);
                    }
                    
                    if (buttonPressed !== this.isButtonPressed) {
                        this.isButtonPressed = buttonPressed;
                        if (buttonPressed) {
                            handleButtonPress();
                        }
                    }
                    
                } catch (error) {
                    console.error('Error parsing dial data:', error);
                }
            }
        }

        async function init() {
            console.log('Initializing Stakco Surface Dial...');

            StakcoUtils.preventZoom();
            setupEventListeners();

            // Wait for puzzle container to be ready
            await new Promise(resolve => {
                if (puzzleContainer.shadowRoot) {
                    resolve();
                } else {
                    puzzleContainer.addEventListener('puzzle-ready', resolve, { once: true });
                }
            });

            setTimeout(checkPermissionNeeded, 1000);
            console.log('App initialized');
        }

        function setupEventListeners() {
            puzzleContainer.addEventListener('puzzle-ready', () => {
                console.log('Puzzle ready');
            });

            puzzleContainer.addEventListener('puzzle-solved', () => {
                puzzleSolved = true;
                handlePuzzleSolved();
            });

            layerControls.addEventListener('layerchange', (e) => {
                puzzleContainer.switchLayer(e.detail.layer);
                activeLayerSpan.textContent = e.detail.layer;
                updateRotationDisplay();
            });

            permissionPrompt.addEventListener('primary-action', async () => {
                await requestDialAccess();
            });

            permissionPrompt.addEventListener('secondary-action', () => {
                initializeDial();
            });

            shareButton.addEventListener('share-clicked', handleShare);
        }

        async function requestDialAccess() {
            if (!navigator.hid) {
                infoPanel.setContent('<p>WebHID not supported in this browser</p>');
                return;
            }

            try {
                dialDevice = new SurfaceDialController();
                const connected = await dialDevice.connect();
                
                if (connected) {
                    initializeDial();
                } else {
                    infoPanel.setContent('<p>Surface Dial connection failed</p>');
                }
                
            } catch (error) {
                console.error('Dial access denied:', error);
                infoPanel.setContent('<p>Surface Dial access denied</p>');
            }
        }

        function initializeDial() {
            infoPanel.setContent('<p>Surface Dial ready - Rotate to control layers, press to switch</p>');
            dialInfo.classList.remove('hidden');
            branding.hide();
        }

        function handleRotation(delta) {
            if (puzzleSolved) return;

            rotationCount++;
            
            showDialActivity();
            dialRotationSpan.textContent = `${dialDevice.currentRotation.toFixed(1)}°`;
            rotationCountSpan.textContent = rotationCount;
            
            puzzleContainer.rotateCurrentLayer(delta);
            
            console.log(`Dial rotation: ${delta.toFixed(1)}°, total: ${rotationCount}`);
            
            updateRotationDisplay();
            puzzleContainer.checkAlignment();
        }

        function handleButtonPress() {
            if (puzzleSolved) return;

            const currentLayer = puzzleContainer.currentLayer;
            const totalLayers = parseInt(puzzleContainer.getAttribute('layers'));
            const nextLayer = (currentLayer % totalLayers) + 1;
            
            puzzleContainer.switchLayer(nextLayer);
            activeLayerSpan.textContent = nextLayer;
            
            showDialActivity();
            console.log(`Button pressed: switched to layer ${nextLayer}`);
        }

        function showDialActivity() {
            dialIndicator.classList.add('active');
            setTimeout(() => dialIndicator.classList.remove('active'), 200);
        }

        function updateRotationDisplay() {
            const rotation = puzzleContainer.getCurrentRotation();
            let displayRotation = rotation % 360;
            if (displayRotation < 0) displayRotation += 360;
            dialRotationSpan.textContent = `${Math.round(displayRotation)}°`;
        }

        function handlePuzzleSolved() {
            console.log(`Puzzle solved with ${rotationCount} rotations!`);

            StakcoUtils.vibrate([200, 100, 300, 100, 200]);

            infoPanel.setContent(`<p>Puzzle solved with ${rotationCount} rotations!</p>`);

            setTimeout(() => {
                layerControls.hide();
                dialInfo.classList.add('hidden');
                shareButton.show();
            }, 2000);

            // Animate all layers to zero
            setTimeout(() => {
                puzzleContainer.animateToSolution(2000);
            }, 500);
        }

        async function handleShare() {
            const layerImages = puzzleContainer.getLayerImages();
            const message = `Solved with ${rotationCount} rotations!`;
            shareWindow.setAttribute('filename', `stakco-dial-${rotationCount}rot.png`);
            await shareWindow.open(layerImages, message, true);
        }

        async function checkPermissionNeeded() {
            if (navigator.hid) {
                permissionPrompt.show();
            } else {
                infoPanel.setContent('<p>WebHID not supported in this browser</p>');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
