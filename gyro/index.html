    <style>
        body {
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        /* ============================================ */
        /* Loading Container                            */
        /* ============================================ */
        #loading-container {
            position: fixed;
            inset: 0;
            background: var(--bg-primary, #1a1a2e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9000;
            transition: opacity 0.5s ease;
        }

        #loading-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-ring {
            width: 80px;
            height: 80px;
            border: 3px solid rgba(249, 167, 67, 0.2);
            border-top-color: #f9a743;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loader-ring-text {
            margin-top: 16px;
            color: var(--text-secondary, #aaa);
            font-size: 14px;
            font-weight: 500;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================ */
        /* Error Container                              */
        /* ============================================ */
        #error-container {
            position: fixed;
            inset: 0;
            background: var(--bg-primary, #1a1a2e);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9001;
            padding: 24px;
            text-align: center;
        }

        #error-container.show {
            display: flex;
        }

        #error-container i {
            font-size: 48px;
            color: #ec4899;
            margin-bottom: 16px;
        }

        #error-message {
            color: var(--text-primary, #fff);
            font-size: 16px;
            max-width: 300px;
        }

        /* ============================================ */
        /* Gyro Info Display - Bottom Horizontal Layout */
        /* ============================================ */
        #gyro-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 12px 20px;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-soft);
            z-index: 800;
            display: none;
            flex-direction: row;
            gap: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            align-items: center;
        }

        #gyro-info.show {
            display: flex;
        }

        .gyro-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .gyro-label {
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .gyro-value {
            color: var(--primary-color);
            font-weight: 600;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            min-width: 35px;
            text-align: center;
        }

        .gyro-bar {
            width: 60px;
            height: 4px;
            background: var(--glass-bg);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .gyro-bar-fill {
            height: 100%;
            background: var(--primary-gradient);
            transition: width 0.1s ease;
            border-radius: 2px;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 600px) {
            #gyro-info {
                gap: 12px;
                padding: 10px 15px;
                font-size: 11px;
            }

            .gyro-label {
                font-size: 9px;
            }

            .gyro-value {
                min-width: 30px;
                font-size: 11px;
            }

            .gyro-bar {
                width: 30px;
            }
        }

    <script type="module">
        import { StakcoUtils } from 'https://cdn.stakcos.com/components/stakco-utils.js';

        // ============================================
        // Configuration
        // ============================================
        const CONFIG = {
            DEFAULT_LAYERS: 3,
            SOLVE_ANIMATION_DURATION: 4000,
            VIBRATION_PATTERN: [200, 100, 300, 100, 200],
            GCS_BUCKET_URL: 'https://storage.googleapis.com/stakco-images',
            DEFAULT_USER_ID: '109949450257686494443',
            DEFAULT_PUZZLE_ID: 'A2A3_3',
            GYRO_SENSITIVITY: 0.8,
            PERMISSION_PROMPT_DELAY: 500,
            MESSAGES: {
                READY: 'Tilt your device to rotate puzzle layers. Align them to solve!',
                ACTIVE: 'Keep tilting to align the layers.',
                UNSUPPORTED: 'Gyroscope not detected. This device may not support tilt controls.'
            }
        };

        const MESSAGES = {
            LOADING_DAILY:  'Loading today\'s puzzle...',
            LOADING_ALBUM:  'Loading album puzzle...',
            LOADING_USER:   'Loading custom puzzle...',
            ERROR_NO_SUBDOMAIN: 'This puzzle link isn\'t active right now.',
            ERROR_NO_ALBUM:     'There\'s no active puzzle here right now.',
            ERROR_NO_USER:      'This puzzle link isn\'t active right now.',
            ERROR_LOAD_FAILED:  'Puzzle couldn\'t load — please try again.'
        };

        // ============================================
        // Album Resolver (mirrors index.html logic exactly)
        // ============================================
        class AlbumResolver {
            constructor(gcsBaseUrl) {
                this.gcsBaseUrl = gcsBaseUrl;
            }

            getSubdomain() {
                const hostname = window.location.hostname;

                // localhost / test env — support ?subdomain=xxx param
                if (hostname === 'localhost' || hostname === '127.0.0.1') {
                    const urlParams = new URLSearchParams(window.location.search);
                    return urlParams.get('subdomain');
                }

                // dplay.stakcos.com test deployment
                if (hostname === 'dplay.stakcos.com') {
                    const urlParams = new URLSearchParams(window.location.search);
                    return urlParams.get('subdomain');
                }

                const parts = hostname.split('.');

                // *.dplay.stakcos.com test subdomains
                if (parts.length >= 3 && parts[1] === 'dplay' && parts[2] === 'stakcos') {
                    const sub = parts[0];
                    if (sub === 'dplay') return null;
                    return sub;
                }

                // *.play.stakcos.com production subdomains
                if (parts.length >= 3 && parts[1] === 'play' && parts[2] === 'stakcos') {
                    const sub = parts[0];
                    if (sub === 'play') return null;
                    return sub;
                }

                return null;
            }

            async fetchConfig(path) {
                const cacheBuster = `_t=${Date.now()}`;
                const separator = path.includes('?') ? '&' : '?';
                const url = `${this.gcsBaseUrl}/${path}${separator}${cacheBuster}`;
                console.log(`[AlbumResolver] Fetching: ${url}`);
                const response = await fetch(url, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Failed to fetch ${path}: ${response.status}`);
                }
                return await response.json();
            }

            async resolve(subdomain) {
                // Step 1: play.json → user_id
                const playConfig = await this.fetchConfig('play.json');
                const subdomainEntry = playConfig[subdomain];
                if (!subdomainEntry) throw new Error(MESSAGES.ERROR_NO_SUBDOMAIN);

                const userId = subdomainEntry.user_id || subdomainEntry.UserId;
                if (!userId) throw new Error(MESSAGES.ERROR_NO_USER);

                // Step 2: user.config → active_album
                const userConfig = await this.fetchConfig(`${userId}/user.config`);
                const activeAlbum = userConfig.active_album || userConfig.ActiveAlbum;
                if (!activeAlbum) throw new Error(MESSAGES.ERROR_NO_ALBUM);

                // Step 3: album.json
                const album = await this.fetchConfig(`${userId}/${activeAlbum}.album.json`);

                return { userId, subdomain, album };
            }

            calculatePuzzleIndex(album, progressIndex = 0) {
                const now = new Date();
                const puzzleCount = album.Puzzles.length;

                switch (album.Type) {
                    case 'SEQUENTIAL':
                        return Math.min(progressIndex, puzzleCount - 1);

                    case 'FREEPLAY': {
                        const urlParams = new URLSearchParams(window.location.search);
                        const puzzleParam = urlParams.get('p');
                        if (puzzleParam !== null) {
                            const idx = parseInt(puzzleParam, 10);
                            if (!isNaN(idx) && idx >= 0 && idx < puzzleCount) return idx;
                        }
                        return 0;
                    }

                    case 'GENAI': {
                        const todayStr = now.toISOString().split('T')[0];
                        const todayIndex = album.Puzzles.findIndex(p => {
                            const pid = p.PuzzleId || p.puzzleId || '';
                            return pid.startsWith(todayStr);
                        });
                        if (todayIndex >= 0) return todayIndex;
                        // Fallback: latest non-future puzzle
                        let bestIndex = 0;
                        let bestDate = '';
                        album.Puzzles.forEach((p, i) => {
                            const pid = p.PuzzleId || p.puzzleId || '';
                            const dateStr = pid.substring(0, 10);
                            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr) && dateStr <= todayStr && dateStr > bestDate) {
                                bestDate = dateStr;
                                bestIndex = i;
                            }
                        });
                        return bestIndex;
                    }

                    case 'HOUR_12': {
                        const hour12 = now.getHours() % 12;
                        return hour12 % puzzleCount;
                    }

                    case 'HOUR_OF_DAY':
                        return now.getHours() % puzzleCount;

                    case 'DAY_OF_WEEK':
                        return now.getDay() % puzzleCount;

                    case 'DAY_OF_MONTH':
                        return (now.getDate() - 1) % puzzleCount;

                    case 'DAY_OF_YEAR': {
                        const start = new Date(now.getFullYear(), 0, 0);
                        const diff = now - start;
                        const day = Math.floor(diff / (1000 * 60 * 60 * 24));
                        return (day - 1) % puzzleCount;
                    }

                    default:
                        return 0;
                }
            }
        }

        // ============================================
        // Helpers
        // ============================================

        /**
         * Extract filename base from puzzle ID (strips trailing layer-count segment).
         * e.g.  "2026-02-16_639062871440896545_3" → "2026-02-16_639062871440896545"
         *        "A2A3_3" → "A2A3"
         */
        function extractImageBase(puzzleId) {
            const lastUnderscore = puzzleId.lastIndexOf('_');
            if (lastUnderscore > 0) {
                return puzzleId.substring(0, lastUnderscore);
            }
            return puzzleId;
        }

        /**
         * Parse ?username=...&puzzle=... URL params (legacy/testing mode).
         */
        function parseUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get('username');
            const puzzle = urlParams.get('puzzle');
            if (!username || !puzzle) return null;

            const cleanPuzzle = puzzle.replace(/_image$/, '');
            const puzzleParts = cleanPuzzle.split('_');
            if (puzzleParts.length < 2) return null;

            const noOfLayers = parseInt(puzzleParts[puzzleParts.length - 1], 10);
            return {
                username,
                puzzleId: puzzleParts.slice(0, -1).join('_'),
                puzzleIdFull: cleanPuzzle,
                noOfLayers
            };
        }

        // ============================================
        // DOM References
        // ============================================
        const puzzleContainer  = document.querySelector('stakco-puzzle-container');
        const countdown        = document.querySelector('stakco-countdown');
        const infoPanel        = document.querySelector('stakco-info-panel');
        const shareWindow      = document.querySelector('stakco-share-window');
        const orientationOverlay = document.querySelector('stakco-orientation-overlay');
        const permissionPrompt = document.querySelector('stakco-permission-prompt');
        const branding         = document.querySelector('stakco-branding');
        const shareButton      = document.querySelector('stakco-share-button');
        const gyroInfo         = document.getElementById('gyro-info');
        const loadingContainer = document.getElementById('loading-container');
        const errorContainer   = document.getElementById('error-container');
        const errorMessageEl   = document.getElementById('error-message');

        // Gyro display elements
        const betaValue  = document.getElementById('beta-value');
        const gammaValue = document.getElementById('gamma-value');
        const alphaValue = document.getElementById('alpha-value');
        const betaBar    = document.getElementById('beta-bar');
        const gammaBar   = document.getElementById('gamma-bar');
        const alphaBar   = document.getElementById('alpha-bar');

        // ============================================
        // App State
        // ============================================
        let firstInteraction = false;
        let lastOrientation  = { alpha: 0, beta: 0, gamma: 0 };
        let loadingHidden    = false;

        // Album state (set during init)
        let currentAlbum      = null;
        let currentUserId     = null;
        let currentSubdomain  = null;
        let isAlbumMode       = false;

        const albumResolver = new AlbumResolver(CONFIG.GCS_BUCKET_URL);

        // ============================================
        // UI Helpers
        // ============================================
        function showLoading(message = 'Loading puzzle...') {
            loadingContainer.querySelector('.loader-ring-text').textContent = message;
            loadingContainer.classList.remove('hidden');
        }

        function hideLoading() {
            loadingContainer.classList.add('hidden');
            setTimeout(() => {
                if (loadingContainer.classList.contains('hidden')) {
                    loadingContainer.style.display = 'none';
                }
            }, 500);
        }

        function showError(message) {
            errorMessageEl.textContent = message;
            errorContainer.classList.add('show');
            loadingContainer.classList.add('hidden');
        }

        // ============================================
        // Puzzle Loading
        // ============================================
        function loadPuzzle(userId, puzzleId, layers) {
            console.log(`[Gyro] loadPuzzle: userId=${userId}, puzzleId=${puzzleId}, layers=${layers}`);
            puzzleContainer.setAttribute('layers', layers);
            puzzleContainer.setAttribute('user-id', userId);
            puzzleContainer.setAttribute('puzzle-id', puzzleId);
            puzzleContainer.setAttribute('image-base', extractImageBase(puzzleId));
            puzzleContainer.setAttribute('puzzle-type', 'user');
        }

        async function initFromSubdomain(subdomain) {
            showLoading(MESSAGES.LOADING_ALBUM);
            const data = await albumResolver.resolve(subdomain);

            currentAlbum     = data.album;
            currentUserId    = data.userId;
            currentSubdomain = subdomain;
            isAlbumMode      = true;

            // No persistent progress for gyro — always use time-based index
            const puzzleIndex = albumResolver.calculatePuzzleIndex(currentAlbum, 0);
            const currentPuzzle = currentAlbum.Puzzles[puzzleIndex];
            if (!currentPuzzle) throw new Error(MESSAGES.ERROR_LOAD_FAILED);

            const puzzleParts = currentPuzzle.PuzzleId.split('_');
            const layers = parseInt(puzzleParts[puzzleParts.length - 1], 10) || CONFIG.DEFAULT_LAYERS;

            loadPuzzle(currentUserId, currentPuzzle.PuzzleId, layers);

            // Update branding
            branding.setAttribute('title', currentAlbum.Name || 'Stakco Gyro');
            branding.setAttribute('version', '');
            if (currentAlbum.Type === 'GENAI') {
                branding.updateSubtitle("Today's AI Puzzle");
            } else {
                const total = currentAlbum.Puzzles.length;
                branding.updateSubtitle(`Puzzle ${puzzleIndex + 1} of ${total}`);
            }

            // Update share URL
            const isPrimary = subdomain === '@';
            shareWindow.setAttribute('share-url',
                isPrimary ? 'https://play.stakcos.com' : `https://${subdomain}.play.stakcos.com`
            );

            console.log(`[Gyro] Album puzzle loaded: ${currentPuzzle.PuzzleId} (index ${puzzleIndex})`);
        }

        async function initFromUrlParams() {
            const custom = parseUrlParams();
            if (!custom) return false;
            showLoading(MESSAGES.LOADING_USER);
            loadPuzzle(custom.username, custom.puzzleIdFull, custom.noOfLayers);
            branding.updateSubtitle('User Puzzle');
            return true;
        }

        function initDefaultPuzzle() {
            showLoading(MESSAGES.LOADING_DAILY);
            puzzleContainer.setAttribute('layers',     CONFIG.DEFAULT_LAYERS);
            puzzleContainer.setAttribute('user-id',    CONFIG.DEFAULT_USER_ID);
            puzzleContainer.setAttribute('puzzle-id',  CONFIG.DEFAULT_PUZZLE_ID);
            puzzleContainer.setAttribute('puzzle-type','play');
            branding.updateSubtitle('Daily Puzzle');
        }

        // ============================================
        // Main Init
        // ============================================
        async function init() {
            console.log('[Gyro] Initializing...');

            StakcoUtils.preventZoom();
            setupEventListeners();
            setTimeout(checkPermissionNeeded, CONFIG.PERMISSION_PROMPT_DELAY);

            // Resolve puzzle source — same priority as main Play app
            const subdomain = albumResolver.getSubdomain();

            try {
                if (subdomain) {
                    await initFromSubdomain(subdomain);
                } else {
                    // Try URL params first (?username=...&puzzle=...)
                    const loadedFromParams = await initFromUrlParams();
                    if (!loadedFromParams) {
                        // Try primary domain album via "@" key
                        try {
                            await initFromSubdomain('@');
                        } catch (err) {
                            console.warn('[Gyro] No primary album, falling back to default:', err.message);
                            initDefaultPuzzle();
                        }
                    }
                }
            } catch (error) {
                console.error('[Gyro] Failed to load puzzle:', error);
                showError(error.message || MESSAGES.ERROR_LOAD_FAILED);
            }

            console.log('[Gyro] Init complete');
        }

        // ============================================
        // Event Listeners
        // ============================================
        function setupEventListeners() {
            // Puzzle ready — hide loading
            puzzleContainer.addEventListener('puzzle-ready', () => {
                console.log('[Gyro] Puzzle ready');
                if (!loadingHidden) {
                    loadingHidden = true;
                    hideLoading();
                }
            });

            // Fallback: hide loading after 3s if puzzle-ready never fires
            setTimeout(() => {
                if (!loadingHidden) {
                    console.log('[Gyro] Fallback: hiding loading after timeout');
                    loadingHidden = true;
                    hideLoading();
                }
            }, 3000);

            puzzleContainer.addEventListener('puzzle-solved', (e) => {
                solvePuzzle(e.detail.layers);
            });

            // Orientation overlay — pause/resume countdown
            orientationOverlay.addEventListener('blocked', () => {
                if (countdown && countdown.active) countdown.pause();
            });
            orientationOverlay.addEventListener('unblocked', () => {
                if (countdown && countdown.paused) countdown.resume();
            });

            // iOS permission prompt
            permissionPrompt.addEventListener('primary-action', async () => {
                const granted = await StakcoUtils.requestOrientationPermission();
                if (granted) initializeOrientation();
            });
            permissionPrompt.addEventListener('secondary-action', () => {
                initializeOrientation();
            });

            // Share button
            shareButton.addEventListener('share-clicked', handleShare);

            // Device orientation — GYRO CONTROLS (preserved exactly)
            if (StakcoUtils.isOrientationSupported()) {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        // ============================================
        // Gyro Controls (unchanged from original)
        // ============================================
        function handleOrientation(event) {
            if (puzzleContainer.isSolved || orientationOverlay.isBlocked()) return;

            // Start countdown on first interaction
            if (!firstInteraction) {
                firstInteraction = true;
                countdown.start();
                gyroInfo.classList.add('show');
                branding.hide();
                infoPanel.setContent(`<p>${CONFIG.MESSAGES.ACTIVE}</p>`);
            }

            const alpha = event.alpha || 0;  // Z-axis (rotation around vertical)
            const beta  = event.beta  || 0;  // X-axis (front-back tilt, -180 to 180)
            const gamma = event.gamma || 0;  // Y-axis (left-right tilt, -90 to 90)

            // Calculate deltas
            const deltaAlpha = calculateDelta(alpha, lastOrientation.alpha, 360);
            const deltaBeta  = calculateDelta(beta,  lastOrientation.beta,  360);
            const deltaGamma = calculateDelta(gamma, lastOrientation.gamma, 180);

            // Apply deltas to layers with sensitivity multiplier
            puzzleContainer.rotateLayer(1, deltaBeta  * CONFIG.GYRO_SENSITIVITY);
            puzzleContainer.rotateLayer(2, deltaGamma * CONFIG.GYRO_SENSITIVITY);
            puzzleContainer.rotateLayer(3, deltaAlpha * CONFIG.GYRO_SENSITIVITY);

            // Update gyro info display
            updateGyroDisplay(alpha, beta, gamma);

            // Store last orientation
            lastOrientation = { alpha, beta, gamma };

            // Check solution
            puzzleContainer.checkAlignment();
        }

        function calculateDelta(current, last, range) {
            let delta = current - last;
            // Handle wrapping for circular values
            if (delta >  range / 2) delta -= range;
            if (delta < -range / 2) delta += range;
            return delta;
        }

        function updateGyroDisplay(alpha, beta, gamma) {
            alphaValue.textContent = `${Math.round(alpha)}°`;
            betaValue.textContent  = `${Math.round(beta)}°`;
            gammaValue.textContent = `${Math.round(gamma)}°`;

            const alphaPercent = ((alpha % 360) / 360) * 100;
            const betaPercent  = ((beta  + 180) / 360) * 100;
            const gammaPercent = ((gamma +  90) / 180) * 100;

            alphaBar.style.width = `${alphaPercent}%`;
            betaBar.style.width  = `${betaPercent}%`;
            gammaBar.style.width = `${gammaPercent}%`;
        }

        // ============================================
        // Solve Handler
        // ============================================
        function solvePuzzle(layerImages) {
            console.log('[Gyro] Puzzle solved!');

            countdown.stop();
            StakcoUtils.vibrate(CONFIG.VIBRATION_PATTERN);

            infoPanel.collapse();
            gyroInfo.classList.remove('show');
            shareButton.show();

            setTimeout(() => {
                puzzleContainer.animateToSolution(CONFIG.SOLVE_ANIMATION_DURATION);
            }, 500);
        }

        // ============================================
        // Share Handler
        // ============================================
        async function handleShare() {
            const timeToSolve = countdown.getTime();
            const layerImages = puzzleContainer.getLayerImages();
            const message = `Solved in ${timeToSolve} with gyroscope navigation!`;
            shareWindow.setAttribute('filename', `stakco-gyro-${timeToSolve.replace(':', '')}.png`);
            await shareWindow.open(layerImages, message, true);
        }

        // ============================================
        // Permission / Orientation Init
        // ============================================
        async function checkPermissionNeeded() {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                permissionPrompt.show();
            } else {
                initializeOrientation();
            }
        }

        function initializeOrientation() {
            if (StakcoUtils.isOrientationSupported()) {
                infoPanel.setContent(`<p>${CONFIG.MESSAGES.READY}</p>`);
                console.log('[Gyro] Orientation initialized');
            } else {
                infoPanel.setContent(`<p>${CONFIG.MESSAGES.UNSUPPORTED}</p>`);
                console.log('[Gyro] Orientation not supported');
            }
        }

        // ============================================
        // Start
        // ============================================
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
