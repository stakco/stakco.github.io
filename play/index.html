    <script type="application/ld+json">

    <title>Stakco Play</title>
    
    <!-- Import Stakco Components -->
    <script type="module" src="https://stakcos.com/assets/1.0.0/components/stakco-countdown.js"></script>
    <script type="module" src="https://stakcos.com/assets/1.0.0/components/stakco-layer-controls.js"></script>
    <script type="module" src="https://stakcos.com/assets/1.0.0/components/stakco-info-panel.js"></script>
    <script type="module" src="https://stakcos.com/assets/1.0.0/components/stakco-share-window.js"></script>
    <script type="module" src="https://stakcos.com/assets/1.0.0/components/stakco-orientation-overlay.js"></script>
    <script type="module" src="https://stakcos.com/assets/1.0.0/components/stakco-products-panel.js"></script>
    <script type="module" src="https://stakcos.com/assets/1.0.0/components/stakco-branding.js"></script>
    <script type="module" src="https://stakcos.com/assets/1.0.0/components/stakco-puzzle-container.js"></script>
    <script type="module" src="https://stakcos.com/assets/1.0.0/components/stakco-share-button.js"></script>

    <style>
        /* Apply Stakcos theme variables and override app-specific styles */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--text-primary);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        html, body {
            margin: 0; 
            height: 100%; 
            overflow: hidden;
        }

        button {
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        #solve-button {
            position: absolute;
            top: 20px;
            left: 50%;
            height: 50px;
            width: 100px;
            transform: translateX(-50%);
            background: var(--primary-gradient);
            border: 2px solid var(--glass-border);
            border-radius: 50px;
            padding: 8px 20px;
            font-family: 'Inter', sans-serif;
            color: white;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-soft);
            z-index: 800;
            display: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #solve-button.show {
            display: block;
            animation: slideDown 0.5s ease-out 0.2s both;
        }

        #solve-button:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: rgba(249, 167, 68, 0.1);
            box-shadow: var(--shadow-glow);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%);
            }
        }

        #replay-button {
            position: absolute;
            bottom: 20px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        #replay-button.show {
            display: block;
        }

        #replay-button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(249, 167, 68, 0.4);
        }

        /* Color transitions for countdown timer */
        .countdown-green { color: white; }
        .countdown-yellow { color: #ffc947; }
        .countdown-orange { color: #ff9900; }
        .countdown-red { color: #ff4444; }
    </style>
</head>

<body>
    <!-- Components -->
    <stakco-orientation-overlay></stakco-orientation-overlay>
    
    <stakco-countdown></stakco-countdown>
    
    <button id="solve-button">Solve</button>
    
    <stakco-info-panel icon="fa-gamepad">
        <p>Drag to rotate selected layer • Align all layers • Share</p>
    </stakco-info-panel>

    <stakco-branding 
        title="Stakco Play" 
        version="v2.0.0" 
        subtitle="Daily Puzzle">
    </stakco-branding>

    <stakco-products-panel></stakco-products-panel>

    <stakco-puzzle-container
        layers="3"
        user-id="109949450257686494443"
        puzzle-id="A2A3_3"
        tolerance="2">
    </stakco-puzzle-container>
    
    <stakco-layer-controls layers="3"></stakco-layer-controls>

    <stakco-share-button label="Share Success!"></stakco-share-button>

    <stakco-share-window 
        title="Stakco Play"
        share-url="https://stakcos.com/play/">
        <div slot="text">Solved in 02:30 • First try today!</div>
    </stakco-share-window>

    <button id="replay-button">Remix and try again</button>

    <script type="module">
        import { 
            isMobileDevice, 
            isLandscapeMode, 
            formatTime, 
            getDailyRotations, 
            checkImageExists, 
            preventMobileZoom, 
            normalizeAngleDelta, 
        } from 'https://stakcos.com/assets/1.0.0/utils.js';

        import { StakcoUtils } from 'https://stakcos.com/assets/1.0.0/components/stakco-utils.js';

        // Simple Game Data Manager - Define class FIRST before using it
        class GameDataManager {
            constructor() {
                this.storageKey = 'stakco-play-attempts';
            }

            loadAttempts(dateKey) {
                try {
                    const data = localStorage.getItem(this.storageKey);
                    if (!data) return { attempts: [], solved: false };
                    
                    const allData = JSON.parse(data);
                    return allData[dateKey] || { attempts: [], solved: false };
                } catch (error) {
                    console.error('Error loading attempts:', error);
                    return { attempts: [], solved: false };
                }
            }

            saveAttempt(dateKey, solved, time) {
                try {
                    const data = localStorage.getItem(this.storageKey);
                    const allData = data ? JSON.parse(data) : {};
                    
                    if (!allData[dateKey]) {
                        allData[dateKey] = { attempts: [], solved: false };
                    }
                    
                    allData[dateKey].attempts.push({ time, timestamp: Date.now() });
                    allData[dateKey].solved = solved;
                    
                    localStorage.setItem(this.storageKey, JSON.stringify(allData));
                } catch (error) {
                    console.error('Error saving attempt:', error);
                }
            }

            generatePerformanceText(dateKey, time) {
                const data = this.loadAttempts(dateKey);
                const attemptCount = data.attempts.length;
                
                let text = '';
                if (attemptCount === 1) {
                    text = 'First try today!';
                } else {
                    text = `Attempt ${attemptCount} today`;
                }
                
                return text;
            }
        }

        // Get component references
        const puzzleContainer = document.querySelector('stakco-puzzle-container');
        const infoPanel = document.querySelector('stakco-info-panel');
        const branding = document.querySelector('stakco-branding');
        const productsPanel = document.querySelector('stakco-products-panel');
        const orientationOverlay = document.querySelector('stakco-orientation-overlay');
        const countdown = document.querySelector('stakco-countdown');
        const layerControls = document.querySelector('stakco-layer-controls');
        const shareWindow = document.querySelector('stakco-share-window');
        const shareButton = document.querySelector('stakco-share-button');
        const solveButton = document.getElementById('solve-button');
        const replayButton = document.getElementById('replay-button');

        // Configuration constants
        const CONFIG = {
            DEFAULT_LAYERS: 3,
            ROTATION_TOLERANCE: 1,
            ROTATION_STEP_SMALL: 1,
            ROTATION_STEP_LARGE: 5,
            SOLVE_ANIMATION_DELAY: 500,
            SOLVE_ANIMATION_DURATION: 4000,
            DOUBLE_TAP_DELAY: 300,
            VIBRATION_PATTERN: [200, 100, 300, 100, 200],
            BASE_IMAGE_URL: 'https://storage.googleapis.com/stakco-images',
            DEFAULT_USER_ID: '109949450257686494443',
            DEFAULT_PUZZLE_ID: 'A2A3_3',
            SHARE_URL: 'https://stakcos.com/play/',
            COUNTDOWN_HIDE_DURATION: 2500
        };

        // UI text constants
        const MESSAGES = {
            LOADING_USER: 'Loading custom puzzle...',
            LOADING_DAILY: 'Loading today\'s puzzle...',
            INSTRUCTIONS: 'Drag to rotate selected layer • Align all layers • Share',
            SHARE_TITLE: 'Stakco Puzzle',
            SHARE_TEXT: "I just solved Stakco",
            CLIPBOARD_MESSAGE: 'Link copied to clipboard: https://stakcos.com/play/'
        };

        // App state
        let totalLayers = CONFIG.DEFAULT_LAYERS;
        let firstInteractionOccurred = false;
        let isDragging = false;
        let lastAngle = 0;
        let performanceText = '';

        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('username');
        const puzzle = urlParams.get('puzzle');
        const hasUrlParams = urlParams.toString() !== '';

        // Construct share URL with parameters
        let shareParams = '';
        if (urlParams.toString()) {
            shareParams = '?' + urlParams.toString();
        }

        // Generate today's date string (YYYY-MM-DD)
        const today = new Date();
        const dateStr = today.toISOString().split('T')[0];

        // Load game data - Now GameDataManager is defined above
        const gameManager = new GameDataManager();

        // Update branding based on puzzle type
        if (username && puzzle) {
            branding.updateSubtitle('User Puzzle');
        } else {
            branding.updateSubtitle('Daily Puzzle');
        }

        function parseCustomPuzzle() {
            if (!username || !puzzle) return null;

            const puzzleParts = puzzle.split('_');
            if (puzzleParts.length < 2) return null;

            const puzzleId = puzzleParts[0];
            const puzzleIdFull = `${puzzleParts[0]}_${puzzleParts[1]}`;
            const noOfLayers = parseInt(puzzleParts[1], 10);

            return { username, puzzleId, puzzleIdFull, noOfLayers };
        }

        async function init() {
            // Prevent zoom on mobile
            StakcoUtils.preventZoom();

            // Parse custom puzzle if provided
            const customPuzzle = parseCustomPuzzle();
            if (customPuzzle) {
                totalLayers = customPuzzle.noOfLayers;
                puzzleContainer.setAttribute('layers', totalLayers);
                puzzleContainer.setAttribute('user-id', customPuzzle.username);
                puzzleContainer.setAttribute('puzzle-id', customPuzzle.puzzleIdFull);
                layerControls.setAttribute('layers', totalLayers);
            }

            setupEventListeners();
            gameManager.loadAttempts(dateStr);
        }

        function setupEventListeners() {
            // Puzzle container events (like azimuth)
            puzzleContainer.addEventListener('puzzle-ready', () => {
                console.log('Puzzle ready');
            });

            puzzleContainer.addEventListener('layer-switched', (e) => {
                console.log('Layer switched:', e.detail.layer);
            });

            puzzleContainer.addEventListener('layer-rotated', (e) => {
                puzzleContainer.checkAlignment();
            });

            puzzleContainer.addEventListener('puzzle-solved', (e) => {
                solvePuzzle(e.detail.layers);
            });

            // Drag events - attach to puzzle container's internal container
            setTimeout(() => {
                const shadowRoot = puzzleContainer.shadowRoot;
                if (shadowRoot) {
                    const container = shadowRoot.querySelector('.container');
                    if (container) {
                        container.addEventListener('mousedown', startDrag);
                        document.addEventListener('mousemove', handleDrag);
                        document.addEventListener('mouseup', endDrag);

                        container.addEventListener('touchstart', startTouch, { passive: false });
                        document.addEventListener('touchmove', handleTouch, { passive: false });
                        document.addEventListener('touchend', endTouch);

                        container.addEventListener('wheel', handleScroll, { passive: false });
                        container.addEventListener('contextmenu', handleRightClick);
                    }
                }
            }, 100);

            // Keyboard controls
            document.addEventListener('keydown', handleKeyboard);

            // Layer controls (like azimuth)
            layerControls.addEventListener('layerchange', (e) => {
                puzzleContainer.switchLayer(e.detail.layer);
            });

            // Orientation overlay events
            orientationOverlay.addEventListener('blocked', () => {
                if (countdown && countdown.active) {
                    countdown.pause();
                }
            });

            orientationOverlay.addEventListener('unblocked', () => {
                if (countdown && countdown.paused) {
                    countdown.resume();
                }
            });

            // Solve button
            solveButton.addEventListener('click', () => solvePuzzle(null, true));

            // Replay button
            replayButton.addEventListener('click', remixPuzzle);

            // Share button
            shareButton.addEventListener('share-clicked', handleShare);
        }

        function handleFirstInteraction() {
            if (!firstInteractionOccurred && !hasUrlParams && !puzzleContainer.isSolved && !orientationOverlay.isBlocked()) {
                firstInteractionOccurred = true;
                countdown.start();
                branding.hide();
                infoPanel.setContent('<p>Drag active - Align all layers to solve!</p>');
            }
        }

        function startDrag(e) {
            if (puzzleContainer.isSolved || orientationOverlay.isBlocked()) return;
            e.preventDefault();
            handleFirstInteraction();
            isDragging = true;
            e.target.closest('.container').style.cursor = 'grabbing';
            lastAngle = getAngleFromEvent(e, e.clientX, e.clientY);
        }

        function handleDrag(e) {
            if (!isDragging || puzzleContainer.isSolved || orientationOverlay.isBlocked()) return;
            e.preventDefault();

            const currentAngle = getAngleFromEvent(e, e.clientX, e.clientY);
            let deltaAngle = currentAngle - lastAngle;
            
            // Normalize angle delta
            if (deltaAngle > 180) deltaAngle -= 360;
            if (deltaAngle < -180) deltaAngle += 360;

            // Use the same method as azimuth
            puzzleContainer.rotateCurrentLayer(deltaAngle);
            lastAngle = currentAngle;
        }

        function endDrag() {
            isDragging = false;
            const shadowRoot = puzzleContainer.shadowRoot;
            if (shadowRoot) {
                const container = shadowRoot.querySelector('.container');
                if (container) {
                    container.style.cursor = 'grab';
                }
            }
        }

        function startTouch(e) {
            if (puzzleContainer.isSolved || orientationOverlay.isBlocked()) return;
            e.preventDefault();
            handleFirstInteraction();
            isDragging = true;
            const touch = e.touches[0];
            lastAngle = getAngleFromEvent(e, touch.clientX, touch.clientY);
        }

        function handleTouch(e) {
            if (!isDragging || puzzleContainer.isSolved || orientationOverlay.isBlocked()) return;
            e.preventDefault();

            const touch = e.touches[0];
            const currentAngle = getAngleFromEvent(e, touch.clientX, touch.clientY);
            let deltaAngle = currentAngle - lastAngle;
            
            // Normalize angle delta
            if (deltaAngle > 180) deltaAngle -= 360;
            if (deltaAngle < -180) deltaAngle += 360;

            puzzleContainer.rotateCurrentLayer(deltaAngle);
            lastAngle = currentAngle;
        }

        function endTouch() {
            isDragging = false;
        }

        function getAngleFromEvent(e, clientX, clientY) {
            const shadowRoot = puzzleContainer.shadowRoot;
            if (!shadowRoot) return 0;
            
            const container = shadowRoot.querySelector('.container');
            if (!container) return 0;
            
            const rect = container.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            return Math.atan2(clientY - centerY, clientX - centerX) * 180 / Math.PI;
        }

        function handleKeyboard(e) {
            if (puzzleContainer.isSolved || orientationOverlay.isBlocked()) return;

            if (!firstInteractionOccurred && (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
                handleFirstInteraction();
            }

            const keyActions = {
                ' ': () => {
                    const currentLayer = puzzleContainer.currentLayer;
                    const nextLayer = (currentLayer % totalLayers) + 1;
                    puzzleContainer.switchLayer(nextLayer);
                    layerControls.setActiveLayer(nextLayer); // Sync UI
                },
                'ArrowLeft': () => puzzleContainer.rotateCurrentLayer(-CONFIG.ROTATION_STEP_LARGE),
                'ArrowRight': () => puzzleContainer.rotateCurrentLayer(CONFIG.ROTATION_STEP_LARGE),
                'ArrowUp': () => puzzleContainer.rotateCurrentLayer(CONFIG.ROTATION_STEP_SMALL),
                'ArrowDown': () => puzzleContainer.rotateCurrentLayer(-CONFIG.ROTATION_STEP_SMALL)
            };

            if (keyActions[e.key]) {
                e.preventDefault();
                keyActions[e.key]();
            } else if (!isNaN(e.key)) {
                const num = parseInt(e.key);
                if (num >= 1 && num <= totalLayers) {
                    puzzleContainer.switchLayer(num);
                    layerControls.setActiveLayer(num); // Sync UI
                }
            }
        }

        function handleScroll(e) {
            if (puzzleContainer.isSolved || orientationOverlay.isBlocked()) return;
            e.preventDefault();
            handleFirstInteraction();
            const delta = e.deltaY > 0 ? CONFIG.ROTATION_STEP_SMALL : -CONFIG.ROTATION_STEP_SMALL;
            puzzleContainer.rotateCurrentLayer(delta);
        }

        function handleRightClick(e) {
            if (puzzleContainer.isSolved || orientationOverlay.isBlocked()) return;
            e.preventDefault();
            const currentLayer = puzzleContainer.currentLayer;
            const nextLayer = (currentLayer % totalLayers) + 1;
            puzzleContainer.switchLayer(nextLayer);
            layerControls.setActiveLayer(nextLayer); // Sync UI
        }

        function solvePuzzle(layerImages, simulate = false) {
            console.log('Puzzle solved!');
            const finalTime = countdown.getTime();

            countdown.stop();

            if (navigator.vibrate) {
                navigator.vibrate(CONFIG.VIBRATION_PATTERN);
            }

            layerControls.hide();
            infoPanel.collapse();
            solveButton.style.display = 'none';

            if (!simulate) {
                shareButton.show();
                gameManager.saveAttempt(dateStr, true, finalTime);
                performanceText = gameManager.generatePerformanceText(dateStr, finalTime);
                
                // Update share window text
                const shareText = `Solved in ${finalTime} • ${performanceText}`;
                shareWindow.querySelector('[slot="text"]').textContent = shareText;
            } else {
                replayButton.classList.add('show');
            }
        }

        function remixPuzzle() {
            location.reload();
        }

        function handleShare() {
            const finalTime = countdown.getTime();
            const shareText = performanceText || `Solved in ${finalTime}`;
            
            // Get layer images from puzzle container
            const layerImages = [];
            if (puzzleContainer.puzzleLayers) {
                Object.keys(puzzleContainer.puzzleLayers).forEach(key => {
                    if (puzzleContainer.puzzleLayers[key].url) {
                        layerImages.push(puzzleContainer.puzzleLayers[key].url);
                    }
                });
            }
            
            const shareUrlWithParams = CONFIG.SHARE_URL + shareParams;
            shareWindow.setAttribute('share-url', shareUrlWithParams);
            shareWindow.setAttribute('filename', `stakco-play-${finalTime.replace(':', '')}.png`);
            shareWindow.open(layerImages, shareText, true);
        }

        // Initialize the app
        init();
    </script>
</body>
