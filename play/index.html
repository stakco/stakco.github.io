    <title>Stakco Play</title>
    
    <style>
        /* CSS Variables for consistent theming */
        :root {
            --primary-green: #00ff00;
            --background-dark: #000;
            --text-green: #0f0;
            --button-inactive: #555;
            --button-inactive-bg: rgba(68, 68, 68, 0.3);
            --button-hover: #888;
            --button-hover-bg: rgba(136, 136, 136, 0.2);
            --text-inactive: #777;
            --text-hover: #aaa;
            --container-size: 90vmin;
            --button-size: 50px;
            --border-radius: 50%;
            --transition-duration: 0.3s;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: var(--background-dark);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #container {
            position: relative;
            width: var(--container-size);
            height: var(--container-size);
            max-width: calc(100vw - 20px);
            max-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
        }

        #container.dragging {
            cursor: grabbing;
        }

        .puzzle-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: none;
        }

        .puzzle-layer.active {
            opacity: 1;
            z-index: 10;
        }

        #branding {
            position: absolute;
            top: 7px;
            margin-top: 10px;
            margin-left: 10px;
            font-size: 14px;
            text-align: center;
            font-family: 'Courier New', monospace;
            color: var(--text-green);
            text-shadow: 0 0 5px var(--text-green), 0 0 10px var(--text-green), 
                         0 0 20px var(--text-green), 0 0 40px var(--text-green);
            letter-spacing: 1px;
        }

        #branding.hidden {
            display: none;
        }

        #status {
            position: absolute;
            top: 40px;
            margin-left: 10px;
            font-size: 14px;
            text-align: center;
            font-family: 'Courier New', monospace;
            color: var(--text-green);
            text-shadow: 0 0 5px var(--text-green), 0 0 10px var(--text-green), 
                         0 0 20px var(--text-green), 0 0 40px var(--text-green);
            letter-spacing: 1px;
        }

        #status.hidden {
            display: none;
        }

        #options-container {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            z-index: 2000;
        }

        #options-button {
            width: 50px;
            height: 50px;
            border: 2px solid var(--button-inactive);
            border-radius: 8px;
            background: var(--button-inactive-bg);
            color: var(--text-inactive);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-duration) ease;
            backdrop-filter: blur(5px);
            position: relative;
            z-index: 2001;
            box-sizing: border-box;
        }

        #options-button:hover {
            border-color: var(--button-hover);
            color: var(--text-hover);
            background: var(--button-hover-bg);
        }

        #options-button.active {
            border-color: var(--primary-green);
            color: var(--primary-green);
            background: rgba(0, 255, 0, 0.1);
            box-shadow: 0 0 10px var(--primary-green);
        }

        .hamburger-icon {
            width: 18px;
            height: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hamburger-line {
            width: 100%;
            height: 2px;
            background-color: currentColor;
            transition: all var(--transition-duration) ease;
        }

        #options-menu {
            position: absolute;
            top: 0;
            right: 0;
            height: 50px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid var(--primary-green);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0;
            overflow: hidden;
            width: 50px;
            transition: width var(--transition-duration) ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px var(--primary-green);
            box-sizing: border-box;
        }

        #options-menu.show {
            width: 230px;
            padding: 0 50px 0 10px;
        }

        .option-button {
            height: 30px;
            padding: 0 15px;
            border: 1px solid var(--button-inactive);
            border-radius: 6px;
            background: var(--button-inactive-bg);
            color: var(--text-inactive);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all var(--transition-duration) ease;
            backdrop-filter: blur(5px);
            text-align: center;
            white-space: nowrap;
            opacity: 0;
            transform: translateX(-10px);
            min-width: 60px;
        }

        #options-menu.show .option-button {
            opacity: 1;
            transform: translateX(0);
        }

        .option-button:hover {
            border-color: var(--button-hover);
            color: var(--text-hover);
            background: var(--button-hover-bg);
        }

        .option-button.primary {
            border-color: var(--primary-green);
            color: var(--primary-green);
            background: rgba(0, 255, 0, 0.1);
        }

        .option-button.primary:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 15px var(--primary-green);
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        #controls.hidden {
            display: none;
        }

        .layer-button {
            width: var(--button-size);
            height: var(--button-size);
            border: 3px solid var(--button-inactive);
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-duration) ease;
            backdrop-filter: blur(5px);
            color: var(--text-inactive);
            background: var(--button-inactive-bg);
        }

        .layer-button.active {
            background: var(--primary-green);
            border-color: var(--primary-green);
            color: var(--background-dark);
            box-shadow: 0 0 20px var(--primary-green);
        }

        .layer-button:hover:not(.active) {
            border-color: var(--button-hover);
            color: var(--text-hover);
            background: var(--button-hover-bg);
        }

        #share-button {
            position: absolute;
            bottom: 20px;
            background: var(--primary-green);
            color: var(--background-dark);
            border: none;
            padding: 15px 20px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            box-shadow: 0 0 30px var(--primary-green);
            transition: all var(--transition-duration) ease;
            z-index: 1000;
            text-align: center;
        }

        #share-button.show {
            display: block;
        }

        #share-button:hover {
            box-shadow: 0 0 40px var(--primary-green);
        }

        .led-value {
            color: var(--text-green);
            font-weight: bold;
            text-transform: uppercase;
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.8; }
            22% { opacity: 0.6; }
        }

        .led-text, .led-value {
            animation: flicker 2.5s infinite;
        }

        /* Remove overlay styles as no longer needed */
    </style>
</head>

<body>
    <div id="status">
        <p id="orientation-status">Drag to rotate selected layer • Align all layers</p>    
    </div>

    <div id="branding">
        <img src="stakco_logo_squricle.png" alt="Stakco Logo" style="height: 20px; vertical-align: middle; margin-right: 0px;">
        <p id="stakco-branding" style="display: inline; margin-left: 2px; vertical-align: middle;">Stakco Play <span id="product-version">v1.0.0</span></p>
        <p id="puzzle-title" style="margin-top: 2px;"></p> 
    </div>

    <div id="options-container">
        <div id="options-menu">
            <button class="option-button primary" onclick="solvePuzzleInstantly()">Solve</button>
            <button class="option-button" onclick="remixPuzzle()">Remix</button>
        </div>
        <button id="options-button" onclick="toggleOptionsMenu()">
            <div class="hamburger-icon">
                <div class="hamburger-line"></div>
                <div class="hamburger-line"></div>
                <div class="hamburger-line"></div>
            </div>
        </button>
    </div>

    <div id="container"></div>
    <div id="controls"></div>

    <button id="share-button" onclick="sharePuzzle()">🎉 Share Success!</button>

    <script>
        // Configuration constants
        const CONFIG = {
            DEFAULT_LAYERS: 3,
            ROTATION_TOLERANCE: 1,
            ROTATION_STEP_SMALL: 1,
            ROTATION_STEP_LARGE: 5,
            SOLVE_ANIMATION_DELAY: 2000,
            SOLVE_ANIMATION_DURATION: 4000,
            DOUBLE_TAP_DELAY: 300,
            VIBRATION_PATTERN: [200, 100, 300, 100, 200],
            BASE_IMAGE_URL: 'https://storage.googleapis.com/stakco-images',
            DEFAULT_USER_ID: '109949450257686494443',
            DEFAULT_PUZZLE_ID: 'A2A3_3',
            SHARE_URL: 'https://stakcos.com/play/'
        };

        // UI text constants
        const MESSAGES = {
            LOADING_USER: 'Loading custom puzzle...',
            LOADING_DAILY: 'Loading today\'s puzzle...',
            INSTRUCTIONS: 'Drag to rotate selected layer • Align all layers',
            SHARE_TITLE: 'Stakco Daily Puzzle',
            SHARE_TEXT: "I just solved today's Stakco puzzle!",
            CLIPBOARD_MESSAGE: 'Link copied to clipboard: https://stakcos.com/play/'
        };

        // App state
        let totalLayers = CONFIG.DEFAULT_LAYERS;
        let currentLayer = 1;
        let puzzleSolved = false;
        let isDragging = false;
        let lastAngle = 0;
        let imagesLoaded = false;
        let puzzleLayers = {};
        let lastTouchEnd = 0;
        let optionsMenuOpen = false;

        // get product version from package.json (injected at build time)
        const PRODUCT_VERSION = '1.0.4'; // Placeholder, replace with actual version
        document.getElementById('product-version').textContent = `v${PRODUCT_VERSION}`;

        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('username');
        const puzzle = urlParams.get('puzzle');

        // Construct share URL with parameters
        let shareParams = '';
            if (urlParams.toString()) {
            shareParams = '?' + urlParams.toString();
        }

        // Generate today's date string (YYYY-MM-DD)
        const today = new Date();
        const dateStr = today.toISOString().split('T')[0];

        // set puzzle title in branding
        const puzzleTitleElem = document.getElementById('puzzle-title');
        if (username && puzzle) {
            puzzleTitleElem.textContent = `${puzzle} by ${username}`;
        } else {
            puzzleTitleElem.textContent = `Daily Puzzle : ${dateStr}`;
        }

        // DOM elements (cached)
        let orientationStatus, controlsDiv, statusDiv, shareButton, container, optionsButton, optionsMenu;

        // Initialize the app
        function initApp() {
            console.log('Initializing Touch Compass Puzzle App...');
            
            // Cache DOM elements
            orientationStatus = document.getElementById('orientation-status');
            controlsDiv = document.getElementById('controls');
            statusDiv = document.getElementById('status');
            shareButton = document.getElementById('share-button');
            container = document.getElementById('container');
            optionsButton = document.getElementById('options-button');
            optionsMenu = document.getElementById('options-menu');

            // Determine puzzle configuration
            const customPuzzle = parseCustomPuzzle();
            if (customPuzzle) {
                totalLayers = customPuzzle.noOfLayers;
                console.log(`Loading custom puzzle: ${customPuzzle.puzzleId} for user: ${customPuzzle.username} with ${totalLayers} layers`);
            } else {
                console.log(`Loading daily puzzle for date: ${dateStr} with ${totalLayers} layers`);
            }

            // Initialize puzzle layers
            initializePuzzleLayers();
            createDynamicElements();
            loadImages(customPuzzle);
            setupEventHandlers();

            console.log('App initialized successfully');
        }

        // Parse custom puzzle parameters
        function parseCustomPuzzle() {
            if (!username || !puzzle) return null;

            const puzzleParts = puzzle.split('_');
            if (puzzleParts.length < 2) return null;

            const puzzleId = puzzleParts[0];
            const puzzleIdFull = `${puzzleParts[0]}_${puzzleParts[1]}`;
            const noOfLayers = parseInt(puzzleParts[1], 10);

            return { username, puzzleId, puzzleIdFull, noOfLayers };
        }

        // Initialize puzzle layer data
        function initializePuzzleLayers() {
            puzzleLayers = {};
            for (let i = 1; i <= totalLayers; i++) {
                puzzleLayers[`layer${i}`] = { 
                    rotation: Math.floor(Math.random() * 360) 
                };
            }
        }

        // Create dynamic DOM elements for layers and controls
        function createDynamicElements() {
            // Clear existing content
            container.innerHTML = '';
            controlsDiv.innerHTML = '';

            // Create layer elements
            for (let i = 1; i <= totalLayers; i++) {
                const layerDiv = document.createElement('div');
                layerDiv.id = `layer${i}`;
                layerDiv.className = `puzzle-layer${i === 1 ? ' active' : ''}`;
                layerDiv.style.zIndex = totalLayers - i + 1;
                container.appendChild(layerDiv);

                const button = document.createElement('button');
                button.className = `layer-button${i === 1 ? ' active' : ''}`;
                button.dataset.layer = i;
                button.textContent = i;
                button.addEventListener('click', () => switchLayer(i));
                controlsDiv.appendChild(button);
            }
        }

        // Options menu functions
        function toggleOptionsMenu() {
            optionsMenuOpen = !optionsMenuOpen;
            
            if (optionsMenuOpen) {
                optionsMenu.classList.add('show');
                optionsButton.classList.add('active');
            } else {
                optionsMenu.classList.remove('show');
                optionsButton.classList.remove('active');
            }
        }

        function closeOptionsMenu() {
            optionsMenuOpen = false;
            optionsMenu.classList.remove('show');
            optionsButton.classList.remove('active');
        }

        function solvePuzzleInstantly() {
            closeOptionsMenu();
            
            // Set all layers to 0 rotation
            Object.keys(puzzleLayers).forEach(layerKey => {
                puzzleLayers[layerKey].rotation = 0;
                const layerElement = document.getElementById(layerKey);
                if (layerElement) {
                    layerElement.style.transform = 'translate(-50%, -50%) rotate(0deg)';
                }
            });
            
            // Mark puzzle as solved and trigger completion
            solvePuzzle();
        }

        function remixPuzzle() {
            closeOptionsMenu();
            
            if (puzzleSolved) {
                // Reset puzzle state
                puzzleSolved = false;
                controlsDiv.classList.remove('hidden');
                statusDiv.classList.remove('hidden');
                shareButton.classList.remove('show');
                orientationStatus.textContent = MESSAGES.INSTRUCTIONS;
            }
            
            // Generate new random rotations
            initializePuzzleLayers();
            applyInitialRotations();
            
            console.log('Puzzle remixed with new rotations');
        }

        // Generate image URLs based on puzzle type
        function generateImageUrls(customPuzzle) {
            const urls = { primary: {}, backup: {} };

            if (customPuzzle) {
                // Custom puzzle URLs
                for (let i = 1; i <= totalLayers; i++) {
                    urls.primary[`layer${i}`] = 
                        `${CONFIG.BASE_IMAGE_URL}/${customPuzzle.username}/${customPuzzle.puzzleIdFull}/${customPuzzle.puzzleId}_${i-1}.png`;
                }
                
                // Backup to default puzzle
                for (let i = 1; i <= 3; i++) {
                    urls.backup[`layer${i}`] = 
                        `${CONFIG.BASE_IMAGE_URL}/${CONFIG.DEFAULT_USER_ID}/latest/${CONFIG.DEFAULT_PUZZLE_ID}/${CONFIG.DEFAULT_PUZZLE_ID.split('_')[0]}_${i-1}.png`;
                }
            } else {
                // Daily puzzle URLs
                for (let i = 1; i <= totalLayers; i++) {
                    const imageIndex = i - 1;
                    urls.primary[`layer${i}`] = 
                        `${CONFIG.BASE_IMAGE_URL}/${CONFIG.DEFAULT_USER_ID}/${dateStr}/${CONFIG.DEFAULT_PUZZLE_ID}/${CONFIG.DEFAULT_PUZZLE_ID.split('_')[0]}_${imageIndex}.png`;
                    urls.backup[`layer${i}`] = 
                        `${CONFIG.BASE_IMAGE_URL}/${CONFIG.DEFAULT_USER_ID}/latest/${CONFIG.DEFAULT_PUZZLE_ID}/${CONFIG.DEFAULT_PUZZLE_ID.split('_')[0]}_${imageIndex}.png`;
                }
            }

            return urls;
        }

        // Load images with fallback mechanism
        async function loadImages(customPuzzle) {
            const loadingMessage = customPuzzle ? MESSAGES.LOADING_USER : MESSAGES.LOADING_DAILY;
            orientationStatus.textContent = loadingMessage;
            
            const imageUrls = generateImageUrls(customPuzzle);
            let loadedCount = 0;

            for (let i = 1; i <= totalLayers; i++) {
                const layerKey = `layer${i}`;
                const layerElement = document.getElementById(layerKey);
                
                if (!layerElement) continue;

                try {
                    const primaryUrl = imageUrls.primary[layerKey];
                    const imageExists = await checkImageExists(primaryUrl);
                    
                    if (imageExists) {
                        layerElement.style.backgroundImage = `url('${primaryUrl}')`;
                        console.log(`Loaded image for ${layerKey}: ${primaryUrl}`);
                    } else {
                        const backupUrl = imageUrls.backup[layerKey];
                        if (backupUrl) {
                            layerElement.style.backgroundImage = `url('${backupUrl}')`;
                            console.log(`Using backup image for ${layerKey}: ${backupUrl}`);
                        }
                    }
                    loadedCount++;
                } catch (error) {
                    console.error(`Error loading ${layerKey}:`, error);
                    const backupUrl = imageUrls.backup[layerKey];
                    if (backupUrl) {
                        layerElement.style.backgroundImage = `url('${backupUrl}')`;
                        console.log(`Error fallback for ${layerKey}, using backup`);
                    }
                    loadedCount++;
                }
            }

            applyInitialRotations();
            orientationStatus.textContent = MESSAGES.INSTRUCTIONS;
            imagesLoaded = true;
            
            console.log(`Loaded ${loadedCount}/${totalLayers} images successfully`);
        }

        // Check if image exists at URL
        async function checkImageExists(url) {
            try {
                const response = await fetch(url, { 
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-cache'
                });
                return response.ok;
            } catch (error) {
                return false;
            }
        }

        // Apply initial random rotations
        function applyInitialRotations() {
            Object.entries(puzzleLayers).forEach(([layerKey, data]) => {
                const layerElement = document.getElementById(layerKey);
                if (layerElement) {
                    layerElement.style.transform = 
                        `translate(-50%, -50%) rotate(${data.rotation}deg)`;
                }
            });
        }

        // Setup all event handlers
        function setupEventHandlers() {
            // Mouse events
            container.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', handleDrag);
            document.addEventListener('mouseup', endDrag);

            // Touch events
            container.addEventListener('touchstart', startTouch, { passive: false });
            document.addEventListener('touchmove', handleTouch, { passive: false });
            document.addEventListener('touchend', endTouch);

            // Keyboard and other events
            document.addEventListener('keydown', handleKeyboard);
            container.addEventListener('wheel', handleScroll, { passive: false });
            container.addEventListener('contextmenu', handleRightClick);

            // Prevent mobile zoom and double-tap
            preventMobileZoom();
        }

        // Prevent zoom on mobile devices
        function preventMobileZoom() {
            document.addEventListener('touchstart', (e) => {
                if (e.touches.length > 1) e.preventDefault();
            }, { passive: false });

            document.addEventListener('touchend', (event) => {
                const now = Date.now();
                if (now - lastTouchEnd <= CONFIG.DOUBLE_TAP_DELAY) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
        }

        // Drag and touch event handlers
        function startDrag(e) {
            if (puzzleSolved) return;
            e.preventDefault();
            isDragging = true;
            container.classList.add('dragging');
            lastAngle = getAngleFromEvent(e, e.clientX, e.clientY);
        }

        function handleDrag(e) {
            if (!isDragging || puzzleSolved) return;
            e.preventDefault();
            
            const currentAngle = getAngleFromEvent(e, e.clientX, e.clientY);
            const deltaAngle = normalizeAngleDelta(currentAngle - lastAngle);
            
            applyRotation(deltaAngle);
            lastAngle = currentAngle;
        }

        function endDrag() {
            isDragging = false;
            container.classList.remove('dragging');
        }

        function startTouch(e) {
            if (puzzleSolved) return;
            e.preventDefault();
            isDragging = true;
            const touch = e.touches[0];
            lastAngle = getAngleFromEvent(e, touch.clientX, touch.clientY);
        }

        function handleTouch(e) {
            if (!isDragging || puzzleSolved) return;
            e.preventDefault();
            
            const touch = e.touches[0];
            const currentAngle = getAngleFromEvent(e, touch.clientX, touch.clientY);
            const deltaAngle = normalizeAngleDelta(currentAngle - lastAngle);
            
            applyRotation(deltaAngle);
            lastAngle = currentAngle;
        }

        function endTouch() {
            isDragging = false;
        }

        // Helper function to calculate angle from event
        function getAngleFromEvent(e, clientX, clientY) {
            const rect = container.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            return Math.atan2(clientY - centerY, clientX - centerX) * 180 / Math.PI;
        }

        // Normalize angle delta to handle wrap-around
        function normalizeAngleDelta(delta) {
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;
            return delta;
        }

        // Keyboard event handler
        function handleKeyboard(e) {
            if (puzzleSolved) return;
            
            const keyActions = {
                ' ': () => switchLayer((currentLayer % totalLayers) + 1),
                'ArrowLeft': () => applyRotation(-CONFIG.ROTATION_STEP_LARGE),
                'ArrowRight': () => applyRotation(CONFIG.ROTATION_STEP_LARGE),
                'ArrowUp': () => applyRotation(CONFIG.ROTATION_STEP_SMALL),
                'ArrowDown': () => applyRotation(-CONFIG.ROTATION_STEP_SMALL)
            };

            if (keyActions[e.key]) {
                e.preventDefault();
                keyActions[e.key]();
            } else if (!isNaN(e.key)) {
                const num = parseInt(e.key);
                if (num >= 1 && num <= totalLayers) {
                    switchLayer(num);
                }
            }
        }

        // Handle scroll wheel
        function handleScroll(e) {
            if (puzzleSolved) return;
            e.preventDefault();
            const delta = e.deltaY > 0 ? CONFIG.ROTATION_STEP_SMALL : -CONFIG.ROTATION_STEP_SMALL;
            applyRotation(delta);
        }

        // Handle right click to switch layer
        function handleRightClick(e) {
            if (puzzleSolved) return;
            e.preventDefault();
            switchLayer((currentLayer % totalLayers) + 1);
        }

        // Apply rotation to current layer
        function applyRotation(deltaAngle) {
            const layerKey = `layer${currentLayer}`;
            puzzleLayers[layerKey].rotation += deltaAngle;

            const layerElement = document.getElementById(layerKey);
            if (layerElement) {
                layerElement.style.transform = 
                    `translate(-50%, -50%) rotate(${puzzleLayers[layerKey].rotation}deg)`;
            }

            checkSolution();
        }

        // Switch active layer
        function switchLayer(layerNumber) {
            if (puzzleSolved || layerNumber === currentLayer) return;

            // Update UI elements
            document.querySelectorAll('.puzzle-layer, .layer-button').forEach(el => {
                el.classList.remove('active');
            });

            const targetLayer = document.getElementById(`layer${layerNumber}`);
            const targetButton = document.querySelector(`[data-layer="${layerNumber}"]`);
            
            if (targetLayer) targetLayer.classList.add('active');
            if (targetButton) targetButton.classList.add('active');

            currentLayer = layerNumber;
            console.log(`Switched to layer ${layerNumber}`);
        }

        // Check if puzzle is solved
        function checkSolution() {
            if (puzzleSolved) return;

            const rotations = Object.values(puzzleLayers).map(layer => 
                ((layer.rotation % 360) + 360) % 360
            );

            const allAligned = rotations.every(rotation =>
                Math.abs(rotation - rotations[0]) <= CONFIG.ROTATION_TOLERANCE
            );

            if (allAligned) {
                solvePuzzle();
            }
        }

        // Handle puzzle completion
        function solvePuzzle() {
            puzzleSolved = true;
            console.log('Puzzle solved!');

            // Vibrate if supported
            if (navigator.vibrate) {
                navigator.vibrate(CONFIG.VIBRATION_PATTERN);
            }

            // Update UI
            controlsDiv.classList.add('hidden');
            statusDiv.classList.add('hidden');
            shareButton.classList.add('show');

            // Animate to final position
            setTimeout(rotateAllLayersToZero, CONFIG.SOLVE_ANIMATION_DELAY);
        }

        // Animate all layers to zero rotation
        function rotateAllLayersToZero() {
            Object.keys(puzzleLayers).forEach(layerKey => {
                const layerElement = document.getElementById(layerKey);
                if (layerElement) {
                    let currentRotation = puzzleLayers[layerKey].rotation || 0;

                    // force counter-clockwise
                    if (currentRotation > 0) {
                        currentRotation -= 360;
                    }

                    puzzleLayers[layerKey].rotation = currentRotation;
                    layerElement.style.transform = `translate(-50%, -50%) rotate(${currentRotation}deg)`;

                    // then animate to zero
                    requestAnimationFrame(() => {
                        layerElement.style.transition = `transform ${CONFIG.SOLVE_ANIMATION_DURATION}ms ease-out`;
                        layerElement.style.transform = 'translate(-50%, -50%) rotate(0deg)';
                    });
                    puzzleLayers[layerKey].rotation = 0;
                }
            });
        }

        // Share functionality
        function sharePuzzle() {
            const shareUrlWithParams = CONFIG.SHARE_URL + shareParams;

            const shareData = {
                title: MESSAGES.SHARE_TITLE,
                text: MESSAGES.SHARE_TEXT,
                url: shareUrlWithParams
            };

            if (navigator.share) {
                navigator.share(shareData)
                    .then(() => console.log('Successful share'))
                    .catch(error => console.log('Error sharing:', error));
            } else {
                // Fallback: copy to clipboard
                const textArea = document.createElement('textarea');
                textArea.value = shareUrlWithParams;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert(`Link copied to clipboard: ${shareUrlWithParams}`);
            }
        }


        // Initialize app when DOM is loaded
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
